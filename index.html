}

// ── ANALYTICS SCREEN ──
function AnalyticsScreen({transactions,categories,settings,t}){
  const now=new Date();
  const{selectedCurrency,exchangeRates}=settings;
  // Sub-tab state: "overview" (current pie + calendar) or "progress" (period comparison)
  const[subTab,setSubTab]=useState("overview");
  // My Progress controls: mode (weeks/months) and how many periods to compare
  const[periodMode,setPeriodMode]=useState("months");
  const[periodCount,setPeriodCount]=useState(3);

  // ─ Pie chart filter: independent date range ─
  // Default: this month so first-time users see something useful immediately.
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const toDateStr=(d)=>d.toISOString().split("T")[0];
  const[pieFromDate,setPieFromDate]=useState(toDateStr(monthStart));
  const[pieToDate,setPieToDate]=useState(toDateStr(today));
  // Quick-select preset chips for common ranges
  const applyRangePreset=(presetKey)=>{
    const t=new Date();
    let from,to=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    if(presetKey==="thisMonth")from=new Date(t.getFullYear(),t.getMonth(),1);
    else if(presetKey==="lastMonth"){from=new Date(t.getFullYear(),t.getMonth()-1,1);to=new Date(t.getFullYear(),t.getMonth(),0);}
    else if(presetKey==="last30")from=new Date(t.getFullYear(),t.getMonth(),t.getDate()-29);
    else if(presetKey==="last7")from=new Date(t.getFullYear(),t.getMonth(),t.getDate()-6);
    else if(presetKey==="thisYear")from=new Date(t.getFullYear(),0,1);
    setPieFromDate(toDateStr(from));setPieToDate(toDateStr(to));
  };

  // ─ Calendar (daily heatmap) filter: month-by-month navigation, separate from pie ─
  const[calYear,setCalYear]=useState(now.getFullYear());
  const[calMonth,setCalMonth]=useState(now.getMonth());
  const prevCalMonth=()=>{if(calMonth===0){setCalYear(y=>y-1);setCalMonth(11);}else setCalMonth(m=>m-1);};
  const nextCalMonth=()=>{if(calMonth===11){setCalYear(y=>y+1);setCalMonth(0);}else setCalMonth(m=>m+1);};

  // ─ Pie chart data: filtered by the independent date range ─
  const pieRangeData=useMemo(()=>{
    // End-of-day inclusive range so transactions on the toDate are included
    const fromTs=new Date(`${pieFromDate}T00:00:00`).getTime();
    const toTs=new Date(`${pieToDate}T23:59:59`).getTime();
    const filtered=transactions.filter(tx=>{
      if(tx.type!=="expense")return false;
      const ts=new Date(tx.date).getTime();
      return ts>=fromTs&&ts<=toTs;
    });
    const totalKzt=filtered.reduce((s,tx)=>s+toKZT(tx.amount,tx.currency,exchangeRates),0);
    const incomeKzt=transactions.filter(tx=>{
      if(tx.type!=="income")return false;
      const ts=new Date(tx.date).getTime();
      return ts>=fromTs&&ts<=toTs;
    }).reduce((s,tx)=>s+toKZT(tx.amount,tx.currency,exchangeRates),0);
    const bycat={};
    filtered.forEach(tx=>{
      const cat=categories.find(c=>c.id===tx.categoryId);
      const key=cat?.id||"other";
      if(!bycat[key])bycat[key]={name:cat?.name||"Other",icon:cat?.icon||"❓",color:cat?.color||"#64748b",value:0};
      bycat[key].value+=toKZT(tx.amount,tx.currency,exchangeRates);
    });
    return{
      slices:Object.values(bycat).sort((a,b)=>b.value-a.value),
      totalExp:totalKzt,
      totalInc:incomeKzt,
      txnCount:filtered.length
    };
  },[transactions,categories,exchangeRates,pieFromDate,pieToDate]);

  // ─ Calendar data: per-day expense totals for the selected calendar month ─
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const dayTotals=useMemo(()=>{
    const arr=[];
    for(let d=1;d<=daysInMonth;d++){
      const dayExp=transactions.filter(tx=>tx.type==="expense"&&sameDay(tx.date,calYear,calMonth,d))
        .reduce((s,tx)=>s+toKZT(tx.amount,tx.currency,exchangeRates),0);
      arr.push({day:d,amount:dayExp});
    }
    return arr;
  },[transactions,calYear,calMonth,daysInMonth,exchangeRates]);
  const calMonthTotal=dayTotals.reduce((s,d)=>s+d.amount,0);

  const presets=[
    {k:"last7",l:"7d"},
    {k:"last30",l:"30d"},
    {k:"thisMonth",l:"This month"},
    {k:"lastMonth",l:"Last month"},
    {k:"thisYear",l:"Year"}
  ];

  // ─ MY PROGRESS: build the period comparison data ─
  // For each selected period (most recent on the right), compute:
  //   - income / expense / saved totals (KZT, then converted to display currency)
  //   - per-category expense breakdown (top 5 + Other)
  // Periods are aligned to calendar weeks (Mon–Sun) or calendar months for clarity.
  const periods = useMemo(()=>{
    const list = [];
    const today = new Date();
    if(periodMode === "months"){
      // Generate the last N calendar months, oldest first
      for(let i = periodCount - 1; i >= 0; i--){
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        const start = new Date(d.getFullYear(), d.getMonth(), 1);
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
        const label = d.toLocaleDateString("en-US", {month:"short", year: i === 0 ? undefined : "2-digit"});
        list.push({start, end, label});
      }
    } else {
      // Weeks: ISO weeks starting Monday. Most recent is the current (partial) week.
      // Find this week's Monday
      const day = today.getDay() || 7; // Sunday → 7
      const thisMon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (day - 1));
      for(let i = periodCount - 1; i >= 0; i--){
        const start = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - i*7);
        const end   = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6, 23, 59, 59);
        const label = i === 0 ? "This wk" : i === 1 ? "Last wk" : `${start.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
        list.push({start, end, label});
      }
    }
    return list;
  }, [periodMode, periodCount]);

  // Compute totals + category breakdown per period
  const periodStats = useMemo(()=>{
    return periods.map(p=>{
      const startMs = p.start.getTime();
      const endMs = p.end.getTime();
      let incomeKzt = 0, expenseKzt = 0;
      const categoryKzt = {}; // categoryId → kzt expense
      transactions.forEach(tx=>{
        const txMs = new Date(tx.date).getTime();
        if(txMs < startMs || txMs > endMs) return;
        const kzt = toKZT(tx.amount, tx.currency, exchangeRates);
        if(tx.type === "income") incomeKzt += kzt;
        else if(tx.type === "expense"){
          expenseKzt += kzt;
          const cid = tx.categoryId || "uncategorized";
          categoryKzt[cid] = (categoryKzt[cid] || 0) + kzt;
        }
        // transfers don't count toward income/expense in this view
      });
      return {
        ...p,
        incomeKzt, expenseKzt,
        savedKzt: incomeKzt - expenseKzt,
        categoryKzt
      };
    });
  }, [periods, transactions, exchangeRates]);

  // Find top 5 expense categories across all periods (by total spend)
  const topCategories = useMemo(()=>{
    const total = {};
    periodStats.forEach(p=>{
      Object.entries(p.categoryKzt).forEach(([cid, kzt])=>{
        total[cid] = (total[cid] || 0) + kzt;
      });
    });
    return Object.entries(total)
      .sort((a,b)=>b[1]-a[1])
      .slice(0, 5)
      .map(([cid])=>{
        const cat = categories.find(c=>c.id===cid);
        return { id: cid, name: cat?.name || tr("Uncategorized", settings.uiLanguage), icon: cat?.icon || "📂" };
      });
  }, [periodStats, categories, settings.uiLanguage]);

  // Helper: percentage change from first to last period
  const pctChange = (first, last) => {
    if(!first || first === 0) return last > 0 ? 100 : 0;
    return Math.round(((last - first) / Math.abs(first)) * 100);
  };

  return(
    <div style={{height:"100%",overflow:"auto",padding:"calc(env(safe-area-inset-top, 20px) + 48px) 16px 16px"}}>
      <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,fontWeight:700,color:t.text,marginBottom:16}}>{tr("Analytics",settings.uiLanguage)}</div>

      {/* ─────── Sub-tab switcher: Overview | My Progress ─────── */}
      <div style={{display:"flex",gap:0,marginBottom:16,background:t.bgCard2,borderRadius:10,padding:4,border:`1px solid ${t.border}`}}>
        {[{k:"overview",l:tr("Overview",settings.uiLanguage)},{k:"progress",l:tr("My Progress",settings.uiLanguage)}].map(tab=>(
          <button key={tab.k}
            onClick={()=>setSubTab(tab.k)}
            style={{
              flex:1,
              background: subTab===tab.k ? t.bgCard : "transparent",
              color: subTab===tab.k ? t.text : t.textMuted,
              border:"none",
              borderRadius:7,
              padding:"8px 12px",
              fontSize:13,
              fontWeight:600,
              cursor:"pointer",
              fontFamily:"system-ui,sans-serif",
              transition:"all 0.2s ease",
              boxShadow: subTab===tab.k ? "0 1px 3px rgba(0,0,0,0.15)" : "none"
            }}>
            {tab.l}
          </button>
        ))}
      </div>

      {/* ─────── Sliding panel container: Overview | My Progress ─────── */}
      {/* The wrapper has overflow:hidden, the inner flex container is 200% wide and translates left/right */}
      <div style={{overflow:"hidden",position:"relative"}}>
        <div style={{
          display:"flex",
          width:"200%",
          transform: subTab==="overview" ? "translateX(0)" : "translateX(-50%)",
          transition:"transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1)"
        }}>
          {/* ─── Pane 1: Overview (existing content) ─── */}
          <div style={{width:"50%",flexShrink:0,paddingRight:8}}>

      {/* ─────── Pie Chart card with own date range ─────── */}
      <div style={{background:t.bgCard,borderRadius:16,padding:"16px",border:`1px solid ${t.border}`,marginBottom:16}}>
        <div style={{fontSize:15,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif",marginBottom:10}}>Spending by Category</div>

        {/* Quick preset chips */}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          {presets.map(({k,l})=>(
            <button key={k} onClick={()=>applyRangePreset(k)} style={{background:t.bgInput,color:t.textMuted,border:`1px solid ${t.border}`,borderRadius:14,padding:"5px 12px",fontSize:11,cursor:"pointer",fontWeight:500}}>
              {l}
            </button>
          ))}
        </div>

        {/* Custom date range pickers */}
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14,padding:"10px 12px",background:t.bgInput,borderRadius:10}}>
          <input type="date" value={pieFromDate} onChange={e=>setPieFromDate(e.target.value)} style={{flex:1,minWidth:0,background:"transparent",color:t.text,border:"none",fontSize:12,padding:0,fontFamily:"system-ui,sans-serif",WebkitAppearance:"none"}}/>
          <span style={{color:t.textMuted,fontSize:12}}>→</span>
          <input type="date" value={pieToDate} onChange={e=>setPieToDate(e.target.value)} style={{flex:1,minWidth:0,background:"transparent",color:t.text,border:"none",fontSize:12,padding:0,fontFamily:"system-ui,sans-serif",WebkitAppearance:"none"}}/>
        </div>

        {/* Summary numbers for the selected range */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
          {[
            {l:"Income",v:pieRangeData.totalInc,c:"#10b981"},
            {l:"Spent",v:pieRangeData.totalExp,c:"#ef4444"},
            {l:"Net",v:pieRangeData.totalInc-pieRangeData.totalExp,c:"#3b82f6"}
          ].map(({l,v,c})=>(
            <div key={l} style={{background:t.bgInput,borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
              <div style={{fontSize:10,color:t.textMuted,marginBottom:2}}>{l}</div>
              <div style={{fontSize:11,fontWeight:700,color:c,fontFamily:"monospace"}}>{fmtAmt(fromKZT(v,selectedCurrency,exchangeRates),selectedCurrency)}</div>
            </div>
          ))}
        </div>

        {pieRangeData.slices.length>0?(
          <>
            <SimplePieChart data={pieRangeData.slices}/>
            <div style={{textAlign:"center",marginTop:-110,marginBottom:92,fontSize:18,fontWeight:700,color:t.text,fontFamily:"monospace",pointerEvents:"none"}}>
              {fmtAmt(fromKZT(pieRangeData.totalExp,selectedCurrency,exchangeRates),selectedCurrency)}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
              {pieRangeData.slices.map(d=>{
                const pct=pieRangeData.totalExp>0?((d.value/pieRangeData.totalExp)*100).toFixed(1):0;
                const bar=pieRangeData.totalExp>0?(d.value/pieRangeData.totalExp)*100:0;
                return(
                  <div key={d.name}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <div style={{width:10,height:10,borderRadius:2,background:d.color,flexShrink:0}}/>
                      <span style={{fontSize:13,color:t.text,flex:1}}>{d.icon} {d.name}</span>
                      <span style={{fontSize:12,color:t.textMuted}}>{pct}%</span>
                      <span style={{fontSize:13,fontWeight:600,color:t.text,fontFamily:"monospace"}}>{fmtAmt(fromKZT(d.value,selectedCurrency,exchangeRates),selectedCurrency)}</span>
                    </div>
                    <div style={{height:3,background:t.bgInput,borderRadius:2}}><div style={{height:"100%",width:`${bar}%`,background:d.color,borderRadius:2}}/></div>
                  </div>
                );
              })}
            </div>
          </>
        ):(
          <div style={{textAlign:"center",padding:"32px 16px",color:t.textMuted}}>
            <div style={{fontSize:32,marginBottom:8}}>📊</div>
            No expenses in this range
          </div>
        )}
      </div>

      {/* ─────── Calendar card with own month navigation ─────── */}
      <div style={{background:t.bgCard,borderRadius:16,padding:"16px",border:`1px solid ${t.border}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{fontSize:15,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif"}}>Daily Spending</div>
          <div style={{fontSize:12,color:t.textMuted,fontFamily:"monospace"}}>{fmtAmt(fromKZT(calMonthTotal,selectedCurrency,exchangeRates),selectedCurrency)}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,background:t.bgInput,borderRadius:10,padding:"6px 12px"}}>
          <button onClick={prevCalMonth} style={{background:"none",border:"none",color:t.accent,fontSize:18,cursor:"pointer",padding:"2px 6px"}}>‹</button>
          <span style={{fontSize:13,fontWeight:600,color:t.text}}>{MONTHS_FULL[calMonth]} {calYear}</span>
          <button onClick={nextCalMonth} style={{background:"none",border:"none",color:t.accent,fontSize:18,cursor:"pointer",padding:"2px 6px"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
          {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,color:t.textMuted,paddingBottom:4,fontWeight:600}}>{d}</div>)}
          {Array.from({length:new Date(calYear,calMonth,1).getDay()}).map((_,i)=><div key={"e"+i}/>)}
          {dayTotals.map(({day,amount})=>{
            const hasSpending=amount>0;
            const displayAmount=hasSpending?fromKZT(amount,selectedCurrency,exchangeRates):0;
            return(
              <div key={day} style={{
                aspectRatio:"1",
                display:"flex",
                flexDirection:"column",
                alignItems:"center",
                justifyContent:"center",
                background:hasSpending?"#ef444415":"transparent",
                borderRadius:6,
                border:`1px solid ${hasSpending?"#ef444444":t.border}`,
                padding:"2px"
              }}>
                <div style={{fontSize:11,fontWeight:600,color:hasSpending?t.text:t.textMuted,lineHeight:1}}>{day}</div>
                {hasSpending&&(
                  <div style={{fontSize:9,fontWeight:600,color:"#ef4444",fontFamily:"monospace",marginTop:2,lineHeight:1}}>
                    {fmtCompact(displayAmount)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

          </div>
          {/* ─── Pane 2: My Progress ─── */}
          <div style={{width:"50%",flexShrink:0,paddingLeft:8}}>

            {/* Period mode toggle: Weeks | Months */}
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              {[{k:"weeks",l:tr("Weeks",settings.uiLanguage)},{k:"months",l:tr("Months",settings.uiLanguage)}].map(m=>(
                <button key={m.k}
                  onClick={()=>setPeriodMode(m.k)}
                  style={{
                    flex:1,background:periodMode===m.k?"#10b981":t.bgCard2,
                    color:periodMode===m.k?"#fff":t.text,
                    border:`1px solid ${periodMode===m.k?"#10b981":t.border}`,
                    borderRadius:8,padding:"8px",fontSize:13,fontWeight:600,
                    cursor:"pointer",fontFamily:"system-ui,sans-serif"
                  }}>
                  {m.l}
                </button>
              ))}
            </div>

            {/* Period count chips */}
            <div style={{display:"flex",gap:6,marginBottom:14}}>
              {[2,3,6].map(n=>(
                <button key={n}
                  onClick={()=>setPeriodCount(n)}
                  style={{
                    flex:1,background:periodCount===n?t.bgCard:t.bgCard2,
                    color:periodCount===n?t.text:t.textMuted,
                    border:`1px solid ${periodCount===n?t.text:t.border}`,
                    borderRadius:8,padding:"6px",fontSize:12,fontWeight:600,
                    cursor:"pointer",fontFamily:"system-ui,sans-serif"
                  }}>
                  {n} {periodMode==="weeks"?tr("weeks",settings.uiLanguage):tr("months",settings.uiLanguage)}
                </button>
              ))}
            </div>

            {/* Empty state if not enough data */}
            {periodStats.every(p=>p.incomeKzt===0 && p.expenseKzt===0) && (
              <div style={{background:t.bgCard,borderRadius:14,padding:"32px 16px",textAlign:"center",border:`1px solid ${t.border}`}}>
                <div style={{fontSize:36,marginBottom:8}}>📊</div>
                <div style={{fontSize:14,color:t.textMuted,lineHeight:1.5}}>
                  {tr("Not enough data yet for this period range. Log some transactions and check back later!",settings.uiLanguage)}
                </div>
              </div>
            )}

            {/* Summary cards: Income, Expenses, Saved — only show if there's data */}
            {!periodStats.every(p=>p.incomeKzt===0 && p.expenseKzt===0) && (
              <>
                {[
                  {key:"income", label:tr("Income",settings.uiLanguage), color:"#10b981", icon:"💰", getValue:(p)=>p.incomeKzt, higherIsBetter:true},
                  {key:"expense", label:tr("Expenses",settings.uiLanguage), color:"#ef4444", icon:"💸", getValue:(p)=>p.expenseKzt, higherIsBetter:false},
                  {key:"saved", label:tr("Saved",settings.uiLanguage), color:"#3b82f6", icon:"💵", getValue:(p)=>p.savedKzt, higherIsBetter:true}
                ].map(metric=>{
                  const values = periodStats.map(p=>metric.getValue(p));
                  const maxAbs = Math.max(1, ...values.map(Math.abs));
                  const change = pctChange(values[0], values[values.length-1]);
                  // Color the % change green if it moved in the "good" direction for this metric
                  const changeColor = (change > 0) === metric.higherIsBetter ? "#10b981" : (change === 0 ? t.textMuted : "#ef4444");
                  const changeArrow = change > 0 ? "↑" : change < 0 ? "↓" : "→";
                  return(
                    <div key={metric.key} style={{background:t.bgCard,borderRadius:14,padding:"14px",border:`1px solid ${t.border}`,marginBottom:12}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                        <div style={{fontSize:13,color:t.text,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
                          <span>{metric.icon}</span>{metric.label}
                        </div>
                        {periodStats.length > 1 && (
                          <div style={{fontSize:12,fontWeight:700,color:changeColor,fontFamily:"monospace"}}>
                            {changeArrow} {Math.abs(change)}%
                          </div>
                        )}
                      </div>
                      {/* Bars row: one column per period */}
                      <div style={{display:"flex",gap:6,alignItems:"flex-end",height:80,marginBottom:8}}>
                        {periodStats.map((p,i)=>{
                          const v = metric.getValue(p);
                          const heightPct = (Math.abs(v) / maxAbs) * 100;
                          const isNegative = v < 0;
                          const barColor = metric.key === "saved" && isNegative ? "#ef4444" : metric.color;
                          return(
                            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
                              <div style={{width:"100%",height:`${Math.max(2,heightPct)}%`,background:barColor,borderRadius:"4px 4px 0 0",opacity:i===periodStats.length-1?1:0.55}}/>
                            </div>
                          );
                        })}
                      </div>
                      {/* Labels row */}
                      <div style={{display:"flex",gap:6,marginBottom:4}}>
                        {periodStats.map((p,i)=>(
                          <div key={i} style={{flex:1,fontSize:9,color:t.textMuted,textAlign:"center",fontFamily:"system-ui,sans-serif"}}>{p.label}</div>
                        ))}
                      </div>
                      {/* Values row */}
                      <div style={{display:"flex",gap:6}}>
                        {periodStats.map((p,i)=>{
                          const display = fromKZT(metric.getValue(p), selectedCurrency, exchangeRates);
                          return(
                            <div key={i} style={{flex:1,fontSize:11,color:t.text,textAlign:"center",fontFamily:"monospace",fontWeight:i===periodStats.length-1?700:400}}>
                              {fmtCompact(display)}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}

                {/* Per-category breakdown */}
                {topCategories.length > 0 && (
                  <div style={{background:t.bgCard,borderRadius:14,padding:"14px",border:`1px solid ${t.border}`,marginBottom:12}}>
                    <div style={{fontSize:13,fontWeight:600,color:t.text,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
                      📂 {tr("By category",settings.uiLanguage)}
                    </div>
                    {topCategories.map(cat=>{
                      const values = periodStats.map(p=>p.categoryKzt[cat.id] || 0);
                      const maxAbs = Math.max(1, ...values);
                      const change = pctChange(values[0], values[values.length-1]);
                      // For categories, "higher is bad" since it's expense
                      const changeColor = change > 0 ? "#ef4444" : change < 0 ? "#10b981" : t.textMuted;
                      const changeArrow = change > 0 ? "↑" : change < 0 ? "↓" : "→";
                      return(
                        <div key={cat.id} style={{marginBottom:14,paddingBottom:10,borderBottom:`1px solid ${t.border}`}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                            <div style={{fontSize:13,color:t.text,display:"flex",alignItems:"center",gap:6}}>
                              <span>{cat.icon}</span><span>{cat.name}</span>
                            </div>
                            {periodStats.length > 1 && (
                              <div style={{fontSize:11,fontWeight:700,color:changeColor,fontFamily:"monospace"}}>
                                {changeArrow} {Math.abs(change)}%
                              </div>
                            )}
                          </div>
                          {/* Horizontal bars per period */}
                          {periodStats.map((p,i)=>{
                            const v = p.categoryKzt[cat.id] || 0;
                            const widthPct = (v / maxAbs) * 100;
                            const display = fromKZT(v, selectedCurrency, exchangeRates);
                            return(
                              <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:3,fontSize:10}}>
                                <div style={{width:46,color:t.textMuted,fontFamily:"system-ui,sans-serif",fontSize:9,flexShrink:0}}>{p.label}</div>
                                <div style={{flex:1,height:14,background:t.bgInput,borderRadius:3,position:"relative",overflow:"hidden"}}>
                                  <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${Math.max(2,widthPct)}%`,background:"#ef4444",opacity:i===periodStats.length-1?0.9:0.55,borderRadius:3,transition:"width 0.3s ease"}}/>
                                </div>
                                <div style={{width:55,textAlign:"right",fontFamily:"monospace",color:t.text,fontSize:10,fontWeight:i===periodStats.length-1?700:400}}>{fmtCompact(display)}</div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Honest disclaimer */}
                <div style={{fontSize:10,color:t.textMuted,fontStyle:"italic",lineHeight:1.5,padding:"4px 8px"}}>
                  💡 {tr("Saved = income − expenses for the period. Amounts converted to your selected currency at today's exchange rates.",settings.uiLanguage)}
                </div>
              </>
            )}

          </div>
        </div>
      </div>

    </div>
  );
}

// ── HISTORY SCREEN ──
function HistoryScreen({transactions,accounts,categories,settings,onTxnClick,t}){
  const now=new Date();
  const[selYear,setSelYear]=useState(now.getFullYear());
  const[selMonth,setSelMonth]=useState(now.getMonth());
  const{selectedCurrency,exchangeRates}=settings;
  const prevMonth=()=>{if(selMonth===0){setSelYear(y=>y-1);setSelMonth(11);}else setSelMonth(m=>m-1);};
  const nextMonth=()=>{if(selMonth===11){setSelYear(y=>y+1);setSelMonth(0);}else setSelMonth(m=>m+1);};
  const monthTxns=transactions.filter(tx=>sameMonth(tx.date,selYear,selMonth)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const grouped=useMemo(()=>{
    const g={};
    monthTxns.forEach(txn=>{
      const d=new Date(txn.date);
      const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if(!g[key])g[key]={label:d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),txns:[],total:0};
      g[key].txns.push(txn);
      if(txn.type==="expense")g[key].total-=toKZT(txn.amount,txn.currency,exchangeRates);
      else if(txn.type==="income")g[key].total+=toKZT(txn.amount,txn.currency,exchangeRates);
    });
    return Object.values(g);
  },[monthTxns,exchangeRates]);

  return(
    <div style={{height:"100%",overflow:"auto",padding:"calc(env(safe-area-inset-top, 20px) + 48px) 16px 16px"}}>
      <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,fontWeight:700,color:t.text,marginBottom:16}}>{tr("History",settings.uiLanguage)}</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,background:t.bgCard,borderRadius:12,padding:"10px 16px",border:`1px solid ${t.border}`}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",color:t.accent,fontSize:22,cursor:"pointer",padding:"0 6px"}}>‹</button>
        <span style={{fontSize:16,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif"}}>{MONTHS_FULL[selMonth]} {selYear}</span>
        <button onClick={nextMonth} style={{background:"none",border:"none",color:t.accent,fontSize:22,cursor:"pointer",padding:"0 6px"}}>›</button>
      </div>
      {grouped.length===0&&(
        <div style={{textAlign:"center",padding:"48px 0",color:t.textMuted}}>
          <div style={{fontSize:36,marginBottom:8}}>📭</div>
          <div style={{fontSize:15}}>No transactions this month</div>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {grouped.map((g,gi)=>(
          <div key={gi}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:13,fontWeight:600,color:t.textMuted}}>{g.label}</span>
              <span style={{fontSize:13,fontWeight:600,color:g.total>=0?"#10b981":"#ef4444",fontFamily:"monospace"}}>{g.total>=0?"+":""}{fmtAmt(fromKZT(g.total,selectedCurrency,exchangeRates),selectedCurrency)}</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {g.txns.map(txn=>{
                const acc=accounts.find(a=>a.id===txn.accountId);
                const toAcc=accounts.find(a=>a.id===txn.toAccountId);
                const cat=categories.find(c=>c.id===txn.categoryId);
                const sub=cat?.subcategories?.find(s=>s.id===txn.subcategoryId);
                const color=txn.type==="expense"?"#ef4444":txn.type==="income"?"#10b981":"#3b82f6";
                const sign=txn.type==="expense"?"-":txn.type==="income"?"+":"";
                const isTransfer=txn.type==="transfer";
                const showBothAmounts=isTransfer&&txn.toAmount!=null&&txn.toCurrency&&txn.toCurrency!==txn.currency;
                return(
                  <div key={txn.id} onClick={()=>onTxnClick(txn)} style={{background:t.bgCard,borderRadius:12,padding:"12px 14px",border:`1px solid ${t.border}`,cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                        <div style={{width:34,height:34,borderRadius:9,background:(isTransfer?"#3b82f6":(cat?.color||"#64748b"))+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{isTransfer?"⇄":cat?.icon||"💸"}</div>
                        <div style={{minWidth:0,flex:1}}>
                          <div style={{fontSize:14,fontWeight:500,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                            {isTransfer?(
                              <span>{acc?.name||"?"} <span style={{color:t.textMuted}}>→</span> {toAcc?.name||"?"}</span>
                            ):(sub?sub.name:cat?.name)||"Unknown"}
                          </div>
                          <div style={{fontSize:11,color:t.textMuted}}>{fmtTime(txn.date)}{!isTransfer?` · ${acc?.name}`:""}{txn.note?` · ${txn.note.slice(0,22)}${txn.note.length>22?"…":""}`:""}</div>
                        </div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:15,fontWeight:700,color,fontFamily:"monospace"}}>{sign}{fmtAmt(txn.amount,txn.currency)}</div>
                        {showBothAmounts&&(
                          <div style={{fontSize:11,color:t.textMuted,fontFamily:"monospace",marginTop:2}}>→ +{fmtAmt(txn.toAmount,txn.toCurrency)}</div>
                        )}
                      </div>
                    </div>
                    {txn.aiComment&&<PetCommentBlock comment={txn.aiComment} petEmoji={(PETS[settings.aiPet]||PETS.dog).emoji} t={t}/>}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── SETTINGS SCREEN ──
// ── IMPORT REVIEW MODAL ──
// Full-screen overlay listing every transaction the AI parsed. User can:
//  - toggle individual selection
//  - change category and account
//  - bulk-select / bulk-deselect
// Duplicates are flagged with a yellow badge and default to UNSELECTED so user opts in.
function ImportReviewModal({transactions,setTransactions,categories,accounts,settings,t,onConfirm,onCancel}){
  const lang=settings.uiLanguage||"English";
  const{selectedCurrency,exchangeRates}=settings;

  const selectedCount=transactions.filter(tx=>tx._selected).length;
  // Transfers need a destination — block import until they all have one (or are deselected)
  const incompleteTransfers=transactions.filter(tx=>tx._selected&&(tx._type||tx.type)==="transfer"&&!tx._toAccountId).length;
  const totalCount=transactions.length;
  const duplicateCount=transactions.filter(tx=>tx._isDuplicate).length;

  const toggleSelect=(id)=>{
    setTransactions(txs=>txs.map(tx=>tx._id===id?{...tx,_selected:!tx._selected}:tx));
  };
  const updateField=(id,field,value)=>{
    setTransactions(txs=>txs.map(tx=>tx._id===id?{...tx,[field]:value}:tx));
  };
  const selectAll=()=>setTransactions(txs=>txs.map(tx=>({...tx,_selected:true})));
  const deselectAll=()=>setTransactions(txs=>txs.map(tx=>({...tx,_selected:false})));
  const deselectDuplicates=()=>setTransactions(txs=>txs.map(tx=>tx._isDuplicate?{...tx,_selected:false}:tx));

  // For "Apply category to all with this description" bulk action
  const applyCatToSameDesc=(desc,catId)=>{
    setTransactions(txs=>txs.map(tx=>(tx.type==="expense"&&tx.description===desc)?{...tx,_categoryId:catId}:tx));
  };

  const expenseCats=categories.filter(c=>c.type==="expense");

  return(
    <div style={{position:"fixed",inset:0,background:t.bg,zIndex:1000,display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{padding:"calc(env(safe-area-inset-top, 20px) + 56px) 16px 12px",background:t.bgCard,borderBottom:`1px solid ${t.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:18,fontWeight:700,color:t.text}}>{tr("Review Import",lang)}</div>
          <button onClick={onCancel} style={{background:t.bgCard2,border:`1px solid ${t.border}`,borderRadius:"50%",width:32,height:32,color:t.textMuted,fontSize:16,cursor:"pointer"}}>×</button>
        </div>
        <div style={{fontSize:12,color:t.textMuted,lineHeight:1.5}}>
          {tr("Found",lang)} <b style={{color:t.text}}>{totalCount}</b> {tr("transactions",lang)}
          {duplicateCount>0&&<span> · <span style={{color:"#f59e0b"}}>{duplicateCount} {tr("possible duplicates",lang)}</span></span>}
        </div>
        {/* Bulk actions */}
        <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
          <button onClick={selectAll} style={{background:t.bgCard2,border:`1px solid ${t.border}`,color:t.text,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>☑ {tr("Select all",lang)}</button>
          <button onClick={deselectAll} style={{background:t.bgCard2,border:`1px solid ${t.border}`,color:t.text,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>☐ {tr("Deselect all",lang)}</button>
          {duplicateCount>0&&(
            <button onClick={deselectDuplicates} style={{background:"#f59e0b22",border:`1px solid #f59e0b55`,color:"#f59e0b",borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>⚠ {tr("Skip duplicates",lang)}</button>
          )}
        </div>
      </div>

      {/* Transaction list */}
      <div style={{flex:1,overflow:"auto",padding:"10px 16px"}}>
        {transactions.length===0&&(
          <div style={{textAlign:"center",padding:"40px",color:t.textMuted,fontSize:13}}>
            {tr("No transactions found in this PDF",lang)}
          </div>
        )}
        {transactions.map(tx=>{
          // The user-overridable type drives everything else: which accounts/category show up,
          // colors, sign in front of the amount. AI's original type is just the starting point.
          const effectiveType=tx._type||tx.type;
          const isOther=tx._categoryId==="other"||!expenseCats.find(c=>c.id===tx._categoryId);
          const dateStr=new Date(tx.date).toLocaleDateString("en-US",{month:"short",day:"numeric"});
          const typeColor=effectiveType==="expense"?"#ef4444":effectiveType==="income"?"#10b981":"#3b82f6";
          const typeSign=effectiveType==="expense"?"-":effectiveType==="income"?"+":"";
          // For transfers, we need the user to pick a destination — flag the row as incomplete if missing
          const transferMissingDest=effectiveType==="transfer"&&!tx._toAccountId;
          return(
            <div key={tx._id} style={{
              background:tx._selected?t.bgCard:t.bgCard2,
              border:`1px solid ${
                tx._isDuplicate?"#f59e0b55":
                (tx._selected&&transferMissingDest?"#ef444455":
                (tx._selected?t.border:"transparent"))
              }`,
              borderRadius:12,
              padding:"12px",
              marginBottom:8,
              opacity:tx._selected?1:0.55,
              transition:"opacity .15s"
            }}>
              {/* Header row: checkbox + description + amount */}
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:tx._selected?10:0}}>
                <input type="checkbox" checked={tx._selected} onChange={()=>toggleSelect(tx._id)}
                  style={{width:18,height:18,cursor:"pointer",flexShrink:0,accentColor:"#10b981"}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2,flexWrap:"wrap"}}>
                    <span style={{fontSize:13,fontWeight:600,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%"}}>{tx.description||tr("(no description)",lang)}</span>
                    {tx._isDuplicate&&<span style={{fontSize:9,background:"#f59e0b22",color:"#f59e0b",padding:"1px 6px",borderRadius:4,fontWeight:600,flexShrink:0}}>⚠ {tr("DUPLICATE",lang)}</span>}
                  </div>
                  <div style={{fontSize:11,color:t.textMuted}}>
                    {dateStr}
                    {tx.confidence!==undefined&&effectiveType==="expense"&&<span style={{marginLeft:6,opacity:0.7}}>· {Math.round(tx.confidence*100)}% {tr("confidence",lang)}</span>}
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:14,fontWeight:700,color:typeColor,fontFamily:"monospace"}}>
                    {typeSign}{fmtAmt(tx.amount,tx.currency||"KZT")}
                  </div>
                </div>
              </div>

              {tx._selected&&(
                <div style={{paddingLeft:28,display:"flex",flexDirection:"column",gap:6}}>
                  {/* Type selector — three pills: Expense / Income / Transfer.
                      Lets user reclassify when AI got it wrong (common for "Перевод" entries). */}
                  <div style={{display:"flex",gap:4,background:t.bgInput,borderRadius:8,padding:3}}>
                    {[
                      {k:"expense",l:tr("Expense",lang),c:"#ef4444"},
                      {k:"income", l:tr("Income",lang), c:"#10b981"},
                      {k:"transfer",l:tr("Transfer",lang),c:"#3b82f6"}
                    ].map(opt=>(
                      <button key={opt.k}
                        onClick={()=>updateField(tx._id,"_type",opt.k)}
                        style={{
                          flex:1,
                          background:effectiveType===opt.k?opt.c:"transparent",
                          color:effectiveType===opt.k?"#fff":t.textMuted,
                          border:"none",
                          borderRadius:6,
                          padding:"5px 6px",
                          fontSize:10,
                          fontWeight:600,
                          cursor:"pointer",
                          fontFamily:"system-ui,sans-serif",
                          transition:"all .15s"
                        }}>
                        {opt.l}
                      </button>
                    ))}
                  </div>

                  {/* Different inputs depending on type */}
                  {effectiveType==="expense"&&(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                      <select value={tx._categoryId} onChange={e=>updateField(tx._id,"_categoryId",e.target.value)}
                        style={{
                          background:isOther?"#f59e0b22":t.bgInput,
                          color:t.text,
                          border:`1px solid ${isOther?"#f59e0b55":t.border}`,
                          borderRadius:8,padding:"7px 8px",fontSize:11,fontFamily:"system-ui,sans-serif",cursor:"pointer"
                        }}>
                        {expenseCats.map(c=>(
                          <option key={c.id} value={c.id}>{c.icon} {c.name}</option>
                        ))}
                        <option value="other">📂 {tr("Other",lang)}</option>
                      </select>
                      <select value={tx._accountId||""} onChange={e=>updateField(tx._id,"_accountId",e.target.value)}
                        style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"7px 8px",fontSize:11,fontFamily:"system-ui,sans-serif",cursor:"pointer"}}>
                        {accounts.map(a=>(
                          <option key={a.id} value={a.id}>{a.icon} {a.name}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {effectiveType==="income"&&(
                    <select value={tx._accountId||""} onChange={e=>updateField(tx._id,"_accountId",e.target.value)}
                      style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"7px 8px",fontSize:11,fontFamily:"system-ui,sans-serif",cursor:"pointer"}}>
                      {accounts.map(a=>(
                        <option key={a.id} value={a.id}>{a.icon} {a.name} ({tr("to",lang)})</option>
                      ))}
                    </select>
                  )}

                  {effectiveType==="transfer"&&(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                      {/* From — receiving account from statement is now the source */}
                      <select value={tx._accountId||""} onChange={e=>updateField(tx._id,"_accountId",e.target.value)}
                        style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"7px 8px",fontSize:11,fontFamily:"system-ui,sans-serif",cursor:"pointer"}}>
                        <option value="" disabled>{tr("From",lang)}…</option>
                        {accounts.map(a=>(
                          <option key={a.id} value={a.id}>↗ {a.icon} {a.name}</option>
                        ))}
                      </select>
                      {/* To — user must pick. Highlighted red if empty to draw attention */}
                      <select value={tx._toAccountId||""} onChange={e=>updateField(tx._id,"_toAccountId",e.target.value)}
                        style={{
                          background:transferMissingDest?"#ef444422":t.bgInput,
                          color:t.text,
                          border:`1px solid ${transferMissingDest?"#ef444455":t.border}`,
                          borderRadius:8,padding:"7px 8px",fontSize:11,fontFamily:"system-ui,sans-serif",cursor:"pointer"
                        }}>
                        <option value="">{tr("To… (pick)",lang)}</option>
                        {accounts.filter(a=>a.id!==tx._accountId).map(a=>(
                          <option key={a.id} value={a.id}>↙ {a.icon} {a.name}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {transferMissingDest&&(
                    <div style={{fontSize:10,color:"#ef4444",fontStyle:"italic",lineHeight:1.5}}>
                      ⚠ {tr("Pick destination account, or change type to Expense / Income",lang)}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
        {transactions.some(tx=>tx._selected&&tx._categoryId==="other"&&tx.type==="expense")&&(
          <div style={{padding:"10px 12px",background:"#f59e0b22",border:`1px solid #f59e0b55`,borderRadius:8,fontSize:11,color:"#f59e0b",lineHeight:1.5,marginTop:6}}>
            💡 {tr("Some transactions are set to 'Other'. Picking a real category helps your analytics.",lang)}
          </div>
        )}
      </div>

      {/* Footer with confirm */}
      <div style={{padding:"12px 16px calc(12px + env(safe-area-inset-bottom, 0px))",background:t.bgCard,borderTop:`1px solid ${t.border}`}}>
        {incompleteTransfers>0&&(
          <div style={{fontSize:11,color:"#ef4444",marginBottom:8,textAlign:"center",fontStyle:"italic"}}>
            ⚠ {incompleteTransfers} {tr("transfer(s) need a destination account",lang)}
          </div>
        )}
        <button
          onClick={onConfirm}
          disabled={selectedCount===0||incompleteTransfers>0}
          style={{
            width:"100%",
            background:(selectedCount===0||incompleteTransfers>0)?t.bgCard2:"#10b981",
            color:(selectedCount===0||incompleteTransfers>0)?t.textMuted:"#fff",
            border:"none",
            borderRadius:12,
            padding:"14px",
            fontSize:15,
            fontWeight:600,
            cursor:(selectedCount===0||incompleteTransfers>0)?"not-allowed":"pointer",
            fontFamily:"system-ui,sans-serif"
          }}>
          {selectedCount===0
            ? tr("Nothing selected",lang)
            : `${tr("Import",lang)} ${selectedCount} ${tr("transactions",lang)}`}
        </button>
      </div>
    </div>
  );
}

// ── BUDGET SUGGESTION BANNER ──
// Shown at the top of the Categories settings when there are expense categories without
// budgets AND we have data from the previous month to base suggestions on.
// Suggests budgets for the top 3 spend categories using last month's actual spending,
// rounded up to a clean number. User can accept all, dismiss permanently, or set them manually later.
function BudgetSuggestionBanner({categories,transactions,settings,onCategoriesChange,t}){
  const[dismissed,setDismissed]=useState(false);
  if(dismissed)return null;

  // Compute last month's spend per category (in KZT)
  const now=new Date();
  const lastMonthStart=new Date(now.getFullYear(),now.getMonth()-1,1);
  const lastMonthEnd=new Date(now.getFullYear(),now.getMonth(),0,23,59,59);

  const spendByCat={};
  (transactions||[]).forEach(tx=>{
    if(tx.type!=="expense")return;
    const txDate=new Date(tx.date);
    if(txDate<lastMonthStart||txDate>lastMonthEnd)return;
    const kzt=toKZT(tx.amount,tx.currency,settings.exchangeRates);
    spendByCat[tx.categoryId]=(spendByCat[tx.categoryId]||0)+kzt;
  });

  // Find top 3 expense categories without budgets, where last-month spend > 5000 KZT (meaningful)
  const candidates=(categories||[])
    .filter(c=>{
      const isExpense=(c.type||"expense")==="expense";
      const noBudget=!c.budgetKzt;
      const meaningfulSpend=(spendByCat[c.id]||0)>=5000;
      return isExpense&&noBudget&&meaningfulSpend;
    })
    .map(c=>({cat:c,lastSpend:spendByCat[c.id]||0}))
    .sort((a,b)=>b.lastSpend-a.lastSpend)
    .slice(0,3);

  if(candidates.length===0)return null;

  // Round suggested budget up to a clean number (next multiple of 5000 KZT)
  // Add ~10% headroom so it's achievable, not stressful
  const roundClean=(kzt)=>{
    const withHeadroom=kzt*1.1;
    return Math.ceil(withHeadroom/5000)*5000;
  };

  const acceptAll=()=>{
    const updates=categories.map(c=>{
      const match=candidates.find(x=>x.cat.id===c.id);
      return match?{...c,budgetKzt:roundClean(match.lastSpend)}:c;
    });
    onCategoriesChange(updates);
    setDismissed(true);
  };

  return(
    <div style={{background:"#10b98115",border:"1px solid #10b98144",borderRadius:10,padding:"12px",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div style={{fontSize:12,fontWeight:600,color:"#10b981"}}>💡 {tr("Suggested budgets",settings.uiLanguage)}</div>
        <button onClick={()=>setDismissed(true)} style={{background:"transparent",border:"none",color:"#10b98199",fontSize:14,cursor:"pointer",padding:0,lineHeight:1}}>✕</button>
      </div>
      <div style={{fontSize:11,color:settings.darkMode?"#cbd5e1":"#475569",marginBottom:10,lineHeight:1.45}}>
        {tr("Based on last month's spending, with ~10% headroom rounded to a clean number:",settings.uiLanguage)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
        {candidates.map(({cat,lastSpend})=>{
          const suggestedKzt=roundClean(lastSpend);
          const suggestedDisplay=fromKZT(suggestedKzt,settings.selectedCurrency,settings.exchangeRates);
          const lastSpendDisplay=fromKZT(lastSpend,settings.selectedCurrency,settings.exchangeRates);
          return(
            <div key={cat.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
              <span style={{fontSize:16}}>{cat.icon}</span>
              <span style={{flex:1,color:settings.darkMode?"#e2e8f0":"#1e293b"}}>{cat.name}</span>
              <span style={{fontFamily:"monospace",color:"#10b981",fontWeight:600}}>{fmtCompact(suggestedDisplay)}</span>
              <span style={{fontSize:10,color:settings.darkMode?"#94a3b8":"#64748b"}}>({tr("was",settings.uiLanguage)} {fmtCompact(lastSpendDisplay)})</span>
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={acceptAll} style={{flex:1,background:"#10b981",border:"none",borderRadius:7,padding:"8px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>
          {tr("Apply all",settings.uiLanguage)}
        </button>
        <button onClick={()=>setDismissed(true)} style={{background:"transparent",border:`1px solid ${t.border}`,borderRadius:7,padding:"8px 14px",color:t.textMuted,fontSize:12,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>
          {tr("Skip",settings.uiLanguage)}
        </button>
      </div>
    </div>
  );
}

  const[importBank,setImportBank]=useState("kaspi"); // "kaspi" | "freedom"
  const[importTransactions,setImportTransactions]=useState([]); // parsed transactions from AI
  const[importError,setImportError]=useState(null);
  const statementFileRef=useRef();

  // Convert a File to base64 (just the data, no data: prefix)
  const fileToBase64=(file)=>new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const result=r.result;
      const i=result.indexOf(",");
      resolve(i>=0?result.slice(i+1):result);
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });

  // Triggered when user picks a PDF. Sends it to the worker, gets parsed transactions back.
  const handleStatementUpload=async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    if(file.type!=="application/pdf"){
      setImportError(tr("Please upload a PDF file",settings.uiLanguage));
      return;
    }
    setImportPhase("uploading");
    setImportError(null);
    try{
      const pdf_base64=await fileToBase64(file);
      // Build a category list for the parser. Only IDs and names — keeps prompt small.
      const cats=categories.map(c=>({id:c.id,name:c.name,type:c.type,icon:c.icon}));
      const res=await fetch(WORKER_URL+"/parse-statement",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          pdf_base64,
          bank:importBank,
          categories:cats,
          ui_language:settings.uiLanguage,
          tg_id:tg?.initDataUnsafe?.user?.id
        })
      });
      const data=await res.json();
      if(!data.ok){
        setImportError(data.error||"Parsing failed");
        setImportPhase("idle");
        return;
      }
      // Augment each transaction with UI state for the review screen.
      // Default the "from" account to whichever account matches the chosen bank's name —
      // user picked "Freedom" so we try to find their Freedom account. Falls back to first account.
      // For transfers, _toAccountId is the destination — user picks it after import is shown.
      const bankNameLower=importBank.toLowerCase();
      const matchedAccount=accounts.find(a=>a.name?.toLowerCase().includes(bankNameLower))
        ||accounts.find(a=>a.isActive!==false)
        ||accounts[0];
      const ready=data.transactions.map((tx,i)=>({
        ...tx,
        _id:"imp_"+i, // local-only key
        _selected:true, // default checked
        _type:tx.type, // user can override AI's classification (e.g. "Перевод" might really be expense)
        _categoryId:tx.suggested_category_id||"other",
        _accountId:matchedAccount?.id||null,    // for income/expense: receiving/source account
        _toAccountId:null,                       // for transfers: destination — user must pick
        // Duplicate detection: same direction, same absolute amount (±0.01), date within 1 day
        _isDuplicate:transactions.some(existing=>{
          if(existing.type!==tx.type)return false;
          if(Math.abs(existing.amount-tx.amount)>0.01)return false;
          const dayDiff=Math.abs(new Date(existing.date)-new Date(tx.date))/86400000;
          return dayDiff<=1;
        })
      }));
      // Default-uncheck likely duplicates so user has to opt in
      ready.forEach(tx=>{if(tx._isDuplicate)tx._selected=false;});
      setImportTransactions(ready);
      setImportPhase("reviewing");
    }catch(err){
      setImportError(err.message||"Upload failed");
      setImportPhase("idle");
    }finally{
      if(statementFileRef.current)statementFileRef.current.value=""; // allow re-upload same file
    }
  };

  // User taps Import — only the selected items go in, with their (possibly edited) type/category/account
  const handleConfirmImport=()=>{
    const toAdd=importTransactions
      .filter(tx=>tx._selected)
      .map(tx=>{
        const type=tx._type||tx.type;
        const base={
          id:uid(),
          date:tx.date,
          amount:tx.amount,
          currency:tx.currency||"KZT",
          type,
          accountId:tx._accountId,
          note:tx.description||"",
          aiComment:null
        };
        if(type==="expense"){
          base.categoryId=tx._categoryId||"other";
        }else if(type==="transfer"){
          base.toAccountId=tx._toAccountId; // destination account
          base.toAmount=tx.amount;          // same-currency transfer assumption for v1
          base.toCurrency=tx.currency||"KZT";
        }
        return base;
      })
      // Drop transfers without destination — user didn't pick one, can't import
      .filter(tx=>tx.type!=="transfer"||tx.toAccountId);
    if(toAdd.length===0){
      setImportPhase("idle");
      setImportTransactions([]);
      return;
    }
    // Prepend new transactions to existing list
    onTransactionsChange([...toAdd,...transactions]);
    setImportPhase("idle");
    setImportTransactions([]);
  };

  const[newFeAmt,setNewFeAmt]=useState("");
  const[newFeDay,setNewFeDay]=useState("1");
  const fileRef=useRef();

  const Toggle=({value,onChange})=>(
    <div onClick={onChange} style={{width:46,height:26,borderRadius:13,background:value?"#10b981":"#64748b",cursor:"pointer",position:"relative",transition:"background .2s",flexShrink:0}}>
      <div style={{position:"absolute",top:3,left:value?22:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 4px rgba(0,0,0,0.3)"}}/>
    </div>
  );

  const Section=({k,label,icon})=>(
    <div onClick={()=>setSec(sec===k?null:k)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:t.bgCard,borderRadius:12,cursor:"pointer",border:`1px solid ${t.border}`,marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:20}}>{icon}</span>
        <span style={{fontSize:15,fontWeight:500,color:t.text}}>{label}</span>
      </div>
      <span style={{color:t.textMuted,fontSize:20,transform:sec===k?"rotate(90deg)":"",transition:"transform .2s",lineHeight:1}}>›</span>
    </div>
  );

  return(
    <div style={{height:"100%",overflow:"auto",padding:"calc(env(safe-area-inset-top, 20px) + 48px) 16px 16px"}}>
      <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,fontWeight:700,color:t.text,marginBottom:16}}>{tr("Settings",settings.uiLanguage)}</div>

      {/* Profile */}
      <div style={{background:t.bgCard,borderRadius:16,padding:"16px",border:`1px solid ${t.border}`,marginBottom:12,display:"flex",alignItems:"center",gap:14}}>
        <div onClick={()=>fileRef.current?.click()} style={{cursor:"pointer",position:"relative",flexShrink:0}}>
          {settings.profilePicture
            ?<img src={settings.profilePicture} style={{width:58,height:58,borderRadius:"50%",objectFit:"cover"}} alt="profile"/>
            :<div style={{width:58,height:58,borderRadius:"50%",background:"#10b981",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:24,color:"#fff"}}>{(settings.displayName||"U")[0]}</div>}
          <div style={{position:"absolute",bottom:0,right:0,width:20,height:20,background:"#10b981",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff"}}>✎</div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>onSettingsChange({...settings,profilePicture:ev.target.result});r.readAsDataURL(f);}}/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:12,color:t.textMuted,marginBottom:5}}>Display Name</div>
          <input value={settings.displayName||""} onChange={e=>onSettingsChange({...settings,displayName:e.target.value})} style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"9px 12px",fontSize:15,width:"100%",fontFamily:"system-ui,sans-serif"}}/>
        </div>
      </div>

      {/* Quick Toggles */}
      <div style={{background:t.bgCard,borderRadius:14,padding:"4px 16px",border:`1px solid ${t.border}`,marginBottom:14}}>
        {[{l:"🌙 Dark Mode",k:"darkMode"},{l:"🤖 AI Coach",k:"aiEnabled"},{l:"🔔 Daily Reminders",k:"remindersEnabled"}].map(({l,k},i,arr)=>(
          <div key={k} style={{
            display:"flex",
            justifyContent:"space-between",
            alignItems:"center",
            padding:"12px 0",
            // Subtle divider between every row except the last — keeps spacing uniform
            borderBottom:i<arr.length-1?`1px solid ${t.border}`:"none"
          }}>
            <span style={{fontSize:15,fontWeight:500,color:t.text}}>{l}</span>
            <Toggle value={settings[k]} onChange={()=>onSettingsChange({...settings,[k]:!settings[k]})}/>
          </div>
        ))}
      </div>

      <Section k="accounts" label={tr("Accounts",settings.uiLanguage)} icon="🏦"/>
      {sec==="accounts"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:12}}>
          {accounts.map(a=>{
            const isEditing=editAccId===a.id;
            const allowedCurrencies=getAccountCurrencies(a.type);
            return(
              <div key={a.id} style={{padding:"9px 0",borderBottom:`1px solid ${t.border}`}}>
                {isEditing?(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                      <EmojiPicker value={editAccIcon} onChange={setEditAccIcon} t={t} categoryHint={a.type==="crypto"?"crypto":"accounts"}/>
                      <input value={editAccName} onChange={e=>setEditAccName(e.target.value)} placeholder="Account name" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"9px 10px",fontSize:14,fontFamily:"system-ui,sans-serif"}}/>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:11,color:t.textMuted,minWidth:60}}>Currency:</span>
                      <select value={editAccCurrency} onChange={e=>setEditAccCurrency(e.target.value)} style={{flex:1,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"6px 10px",fontSize:13,cursor:"pointer"}}>
                        {allowedCurrencies.map(c=><option key={c} value={c}>{sym[c]} {c}</option>)}
                      </select>
                    </div>
                    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                      <button onClick={()=>{onAccountsChange(accounts.map(x=>x.id===a.id?{...x,name:editAccName,currency:editAccCurrency,icon:editAccIcon||x.icon}:x));setEditAccId(null);}} style={{background:"#10b981",border:"none",borderRadius:6,padding:"5px 12px",color:"#fff",cursor:"pointer",fontSize:12}}>Save</button>
                      <button onClick={()=>setEditAccId(null)} style={{background:t.bgInput,border:"none",borderRadius:6,padding:"5px 12px",color:t.textMuted,cursor:"pointer",fontSize:12}}>Cancel</button>
                    </div>
                  </div>
                ):(
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:18}}>{a.icon}</span>
                    <span style={{flex:1,fontSize:14,color:t.text,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name} <span style={{color:t.textMuted}}>({a.currency})</span></span>
                    <button onClick={()=>{setEditAccId(a.id);setEditAccName(a.name);setEditAccCurrency(a.currency);setEditAccIcon(a.icon||"🏦");}} style={{background:t.bgInput,border:"none",borderRadius:6,padding:"5px 10px",color:t.textMuted,cursor:"pointer",fontSize:12,flexShrink:0}}>✎</button>
                    <button onClick={()=>{if(confirm(`Delete account "${a.name}"? This will not delete its transactions.`))onAccountsChange(accounts.filter(x=>x.id!==a.id));}} style={{background:"#ef444422",border:"none",borderRadius:6,padding:"5px 10px",color:"#ef4444",cursor:"pointer",fontSize:12,flexShrink:0}}>✕</button>
                  </div>
                )}
              </div>
            );
          })}
          <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${t.border}`}}>
            <div style={{fontSize:11,fontWeight:700,color:t.textMuted,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Add new account</div>
            <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <EmojiPicker value={newAccIcon} onChange={setNewAccIcon} t={t} categoryHint={newAccType==="crypto"?"crypto":"accounts"}/>
              <input value={newAccName} onChange={e=>setNewAccName(e.target.value)} placeholder="Account name" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"9px 10px",fontSize:14,fontFamily:"system-ui,sans-serif"}}/>
              <select value={newAccType} onChange={e=>{setNewAccType(e.target.value);setNewAccIcon(e.target.value==="crypto"?"💎":"🏦");}} style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"9px 6px",fontSize:13,flexShrink:0}}>
                <option value="bank">Bank</option><option value="crypto">Crypto</option>
              </select>
              <button onClick={()=>{
                if(!newAccName.trim())return;
                onAccountsChange([...accounts,{id:uid(),name:newAccName.trim(),type:newAccType,currency:newAccType==="crypto"?"USDT":"KZT",balance:0,icon:newAccIcon||(newAccType==="bank"?"🏦":"💰"),color:"#10b981",isActive:true}]);
                track("account_create",{type:newAccType});
                setNewAccName("");
                setNewAccIcon(newAccType==="bank"?"🏦":"💎");
              }} style={{background:"#10b981",border:"none",borderRadius:8,padding:"9px 14px",color:"#fff",cursor:"pointer",fontSize:16,fontWeight:700,flexShrink:0}}>+</button>
            </div>
          </div>
        </div>
      )}

      <Section k="categories" label={tr("Categories",settings.uiLanguage)} icon="🗂️"/>
      {sec==="categories"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:12}}>
          {/* Smart budget suggestion banner — appears when there are expense categories without budgets
              and we have last month's spending data to suggest reasonable amounts. */}
          <BudgetSuggestionBanner categories={categories} transactions={transactions} settings={settings} onCategoriesChange={onCategoriesChange} t={t}/>

          {/* Group categories by type for clearer Income vs Expense separation */}
          {["expense","income"].map(groupType=>{
            const groupCats=categories.filter(c=>{
              const ct=c.type||(/salary|income|loan|freelance/i.test(c.name)?"income":"expense");
              return ct===groupType;
            });
            if(groupCats.length===0)return null;
            const headerColor=groupType==="income"?"#10b981":"#ef4444";
            return(
              <div key={groupType} style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:headerColor,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6,paddingLeft:2}}>
                  {groupType==="income"?"💰 Income":"💸 Expense"} categories
                </div>
                {groupCats.map(c=>{
                  const isExpanded=expandedCatId===c.id;
                  const subs=c.subcategories||[];
                  const hasBudget=c.budgetKzt&&c.budgetKzt>0;
                  const budgetDisplay=hasBudget?fromKZT(c.budgetKzt,settings.selectedCurrency,settings.exchangeRates):0;
                  return(
                    <div key={c.id} style={{background:t.bgInput,borderRadius:10,marginBottom:6,overflow:"hidden"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",cursor:"pointer"}} onClick={()=>{setExpandedCatId(isExpanded?null:c.id);setNewSubName("");}}>
                        <span style={{fontSize:18}}>{c.icon}</span>
                        <span style={{flex:1,fontSize:14,color:t.text,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                        {/* Budget chip shown inline when set — for expense categories only */}
                        {groupType==="expense"&&hasBudget&&(
                          <span style={{color:"#10b981",background:"#10b98115",padding:"2px 7px",borderRadius:7,fontSize:10,fontWeight:600,fontFamily:"monospace",flexShrink:0}}>💼 {fmtCompact(budgetDisplay)}</span>
                        )}
                        <span style={{color:t.textMuted,fontSize:11,flexShrink:0}}>{subs.length} sub</span>
                        <span style={{color:t.textMuted,fontSize:14,transform:isExpanded?"rotate(90deg)":"none",transition:"transform .15s"}}>›</span>
                        <button onClick={(e)=>{e.stopPropagation();if(confirm(`Delete category "${c.name}" and all its subcategories?`))onCategoriesChange(categories.filter(x=>x.id!==c.id));}} style={{background:"#ef444422",border:"none",borderRadius:6,padding:"4px 9px",color:"#ef4444",cursor:"pointer",fontSize:11,flexShrink:0}}>✕</button>
                      </div>
                      {isExpanded&&(
                        <div className="fade-in" style={{padding:"4px 12px 12px",borderTop:`1px solid ${t.border}`}}>
                          {/* Budget input — expense categories only. Stored in KZT internally, edited in user's display currency. */}
                          {groupType==="expense"&&(
                            <div style={{padding:"8px 0",marginBottom:6,borderBottom:`1px solid ${t.border}`}}>
                              <div style={{fontSize:10,color:t.textMuted,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:6}}>
                                {tr("Monthly budget",settings.uiLanguage)} ({settings.selectedCurrency})
                              </div>
                              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                                <input
                                  type="number"
                                  value={hasBudget?Math.round(budgetDisplay):""}
                                  onChange={e=>{
                                    const v=parseFloat(e.target.value);
                                    const newBudgetKzt=v>0?toKZT(v,settings.selectedCurrency,settings.exchangeRates):null;
                                    onCategoriesChange(categories.map(cat=>cat.id===c.id?{...cat,budgetKzt:newBudgetKzt}:cat));
                                  }}
                                  placeholder={tr("e.g., 40000 — leave empty for no budget",settings.uiLanguage)}
                                  inputMode="decimal"
                                  style={{flex:1,minWidth:0,background:t.bgCard,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"8px 10px",fontSize:13,fontFamily:"monospace"}}
                                />
                                {hasBudget&&(
                                  <button
                                    onClick={()=>onCategoriesChange(categories.map(cat=>cat.id===c.id?{...cat,budgetKzt:null}:cat))}
                                    style={{background:"transparent",border:`1px solid ${t.border}`,borderRadius:7,padding:"7px 11px",color:t.textMuted,cursor:"pointer",fontSize:11,fontFamily:"system-ui,sans-serif"}}>
                                    {tr("Clear",settings.uiLanguage)}
                                  </button>
                                )}
                              </div>
                              <div style={{fontSize:10,color:t.textMuted,marginTop:6,fontStyle:"italic",lineHeight:1.4}}>
                                {tr("Soft target. Tracked on Home with pace-aware coloring.",settings.uiLanguage)}
                              </div>
                            </div>
                          )}
                          {subs.length===0&&(
                            <div style={{fontSize:11,color:t.textMuted,fontStyle:"italic",padding:"8px 4px"}}>No subcategories yet — add one below.</div>
                          )}
                          {subs.map(s=>(
                            <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 4px"}}>
                              <span style={{color:t.textMuted,fontSize:11}}>•</span>
                              <span style={{flex:1,fontSize:13,color:t.text}}>{s.name}</span>
                              <button onClick={()=>{
                                const updated=categories.map(cat=>cat.id===c.id?{...cat,subcategories:subs.filter(x=>x.id!==s.id)}:cat);
                                onCategoriesChange(updated);
                              }} style={{background:"transparent",border:"none",color:t.textMuted,cursor:"pointer",fontSize:14,padding:"2px 6px"}}>✕</button>
                            </div>
                          ))}
                          <div style={{display:"flex",gap:6,marginTop:8}}>
                            <input
                              value={newSubName}
                              onChange={e=>setNewSubName(e.target.value)}
                              onKeyDown={e=>{
                                if(e.key==="Enter"&&newSubName.trim()){
                                  const updated=categories.map(cat=>cat.id===c.id?{...cat,subcategories:[...subs,{id:uid(),name:newSubName.trim()}]}:cat);
                                  onCategoriesChange(updated);
                                  setNewSubName("");
                                }
                              }}
                              placeholder="Subcategory name"
                              style={{flex:1,minWidth:0,background:t.bgCard,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"system-ui,sans-serif"}}
                            />
                            <button onClick={()=>{
                              if(!newSubName.trim())return;
                              const updated=categories.map(cat=>cat.id===c.id?{...cat,subcategories:[...subs,{id:uid(),name:newSubName.trim()}]}:cat);
                              onCategoriesChange(updated);
                              setNewSubName("");
                            }} style={{background:"#10b981",border:"none",borderRadius:7,padding:"7px 14px",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:700,flexShrink:0}}>+</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}

          {/* Add new category form */}
          <div style={{paddingTop:12,borderTop:`1px solid ${t.border}`}}>
            <div style={{fontSize:11,fontWeight:700,color:t.textMuted,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Add new category</div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <div style={{display:"flex",borderRadius:8,overflow:"hidden",border:`1px solid ${t.border}`,flexShrink:0}}>
                {["expense","income"].map(tt=>(
                  <button key={tt} onClick={()=>setNewCatType(tt)} style={{padding:"7px 10px",background:newCatType===tt?(tt==="income"?"#10b981":"#ef4444"):t.bgInput,color:newCatType===tt?"#fff":t.textMuted,border:"none",fontSize:11,fontWeight:600,cursor:"pointer",textTransform:"uppercase"}}>{tt==="income"?"In":"Out"}</button>
                ))}
              </div>
              <EmojiPicker value={newCatIcon} onChange={setNewCatIcon} t={t} categoryHint={newCatType==="income"?"finance":"food"}/>
              <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="Name" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"8px 10px",fontSize:14,fontFamily:"system-ui,sans-serif"}}/>
              <button onClick={()=>{if(!newCatName.trim())return;onCategoriesChange([...categories,{id:uid(),name:newCatName.trim(),icon:newCatIcon||"📌",color:newCatType==="income"?"#10b981":"#ef4444",type:newCatType,subcategories:[]}]);setNewCatName("");setNewCatIcon("📌");}} style={{background:"#10b981",border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",cursor:"pointer",fontSize:16,fontWeight:700,flexShrink:0}}>+</button>
            </div>
            <div style={{fontSize:11,color:t.textMuted,marginTop:6,fontStyle:"italic"}}>💡 Tip: tap any category above to add subcategories to it.</div>
          </div>
        </div>
      )}

      <Section k="fixed" label={tr("Fixed Expenses",settings.uiLanguage)} icon="📅"/>
      {sec==="fixed"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:12}}>
          {fixedExpenses.map(fe=>(
            <div key={fe.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0",borderBottom:`1px solid ${t.border}`}}>
              <div style={{flex:1}}>
                <div style={{fontSize:14,color:t.text,fontWeight:500}}>{fe.name}</div>
                <div style={{fontSize:11,color:t.textMuted}}>{fmtAmt(fe.amount,fe.currency)} · Day {fe.dayOfMonth}</div>
              </div>
              <button onClick={()=>onFixedChange(fixedExpenses.filter(x=>x.id!==fe.id))} style={{background:"#ef444422",border:"none",borderRadius:6,padding:"5px 10px",color:"#ef4444",cursor:"pointer",fontSize:12}}>✕</button>

// ── ONBOARDING ──
// Walks new users through setup: name, banks, crypto, pet, currency.
// Runs on first launch; skipped thereafter.
function OnboardingScreen({tgUser,onComplete}){
  const[step,setStep]=useState(0);
  const[name,setName]=useState(tgUser?.first_name||"");
  const[profilePic,setProfilePic]=useState(tgUser?.photo_url||null);
  const[selectedBanks,setSelectedBanks]=useState([]);
  const[selectedCrypto,setSelectedCrypto]=useState([]);
  const[customBankName,setCustomBankName]=useState("");
  const[customCryptoName,setCustomCryptoName]=useState("");
  const[pet,setPet]=useState("dog");
  const[currency,setCurrency]=useState("KZT");

  const toggleBank=(bankName)=>setSelectedBanks(s=>s.includes(bankName)?s.filter(x=>x!==bankName):[...s,bankName]);
  const toggleCrypto=(c)=>setSelectedCrypto(s=>s.includes(c)?s.filter(x=>x!==c):[...s,c]);

  const addCustomBank=()=>{
    const n=customBankName.trim();
    if(!n)return;
    if(!selectedBanks.includes(n))setSelectedBanks([...selectedBanks,n]);
    setCustomBankName("");
  };
  const addCustomCrypto=()=>{
    const n=customCryptoName.trim();
    if(!n)return;
    if(!selectedCrypto.includes(n))setSelectedCrypto([...selectedCrypto,n]);
    setCustomCryptoName("");
  };

  const canAdvance=()=>{
    if(step===0)return name.trim().length>0;
    return true;
  };

  const finish=()=>{
    // Build account list from selections
    const accounts=[];
    selectedBanks.forEach(bankName=>{
      const preset=BANK_PRESETS.find(b=>b.name===bankName);

        isActive:true
      });
    });
    selectedCrypto.forEach(cryptoName=>{
      const preset=CRYPTO_PRESETS.find(c=>c.name===cryptoName);
      accounts.push({
        id:uid(),
        name:cryptoName,
        type:"crypto",
        currency:"USDT",
        balance:0,
        icon:preset?.icon||"💰",
        color:preset?.color||"#f59e0b",
        isActive:true

    onComplete({
      displayName:name.trim(),
      profilePicture:profilePic,
      aiPet:pet,
      selectedCurrency:currency,
      accounts

  const STEPS=["Welcome","Banks","Crypto","Companion","Currency"];

  const containerStyle={
    height:"100vh",
    display:"flex",

    background:"linear-gradient(160deg,#0a0f1e,#0f2027,#0a0f1e)",

  const subtitleStyle={fontSize:14,color:"#94a3b8",lineHeight:1.5};
