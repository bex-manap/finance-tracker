<script>
// Global error handler — displays any uncaught JavaScript error directly on the splash
// so the user can see what's wrong instead of staring at an infinite spinner.
window.addEventListener("error",function(ev){
  var errEl=document.getElementById("splash-err");
  if(errEl){
    var msg=ev.message||"Unknown error";
    var src=(ev.filename||"").split("/").pop();
    errEl.innerHTML+="<div style='margin-bottom:8px'>❌ "+msg+(ev.lineno?" (line "+ev.lineno+")":"")+(src?" in "+src:"")+"</div>";
  }
});
window.addEventListener("unhandledrejection",function(ev){
  var errEl=document.getElementById("splash-err");
  if(errEl){
    errEl.innerHTML+="<div style='margin-bottom:8px'>⚠️ Promise error: "+(ev.reason?.message||String(ev.reason))+"</div>";
  }
});
// Emergency timeout — if the app hasn't started after 10 seconds, show reload button
setTimeout(function(){
  var splash=document.getElementById("splash");
  if(splash&&!splash.classList.contains("hidden")){
    var msg=document.getElementById("splash-msg");
    if(msg){
      msg.innerHTML="Taking longer than expected...<br><a href='javascript:location.reload()' style='color:#10b981;text-decoration:underline'>Tap to reload</a>";
    }
  }
},10000);
</script>

// ── CUSTOM PIE CHART ──
// A lightweight SVG donut chart — no external chart library needed.
// More reliable than CDN-loaded chart libraries in Telegram's WebView.
function SimplePieChart({data,size=180,innerR=52,outerR=82}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return null;
  const cx=size/2,cy=size/2;
  let cum=-Math.PI/2; // start at 12 o'clock
  const slices=data.map((d,i)=>{
    const a=(d.value/total)*Math.PI*2;
    const s0=cum,s1=cum+a;
    cum=s1;
    const x1=cx+outerR*Math.cos(s0),y1=cy+outerR*Math.sin(s0);
    const x2=cx+outerR*Math.cos(s1),y2=cy+outerR*Math.sin(s1);
    const x3=cx+innerR*Math.cos(s1),y3=cy+innerR*Math.sin(s1);
    const x4=cx+innerR*Math.cos(s0),y4=cy+innerR*Math.sin(s0);
    const large=a>Math.PI?1:0;
    // Handle the edge case of a single 100% slice which would collapse the path
    const path=a>=Math.PI*2-0.001
      ?`M ${cx-outerR} ${cy} A ${outerR} ${outerR} 0 1 1 ${cx+outerR} ${cy} A ${outerR} ${outerR} 0 1 1 ${cx-outerR} ${cy} M ${cx-innerR} ${cy} A ${innerR} ${innerR} 0 1 0 ${cx+innerR} ${cy} A ${innerR} ${innerR} 0 1 0 ${cx-innerR} ${cy} Z`
      :`M ${x1} ${y1} A ${outerR} ${outerR} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 ${large} 0 ${x4} ${y4} Z`;
    return{path,color:d.color,name:d.name};
  });
  return(
    <svg width="100%" height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",margin:"0 auto",maxWidth:size}}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="rgba(0,0,0,0.15)" strokeWidth="1"/>)}
    </svg>
  );
}

  if(abs>=1000)return`${(n/1000).toFixed(abs>=10000?0:1).replace(/\.0$/,"")}K`;
  return Math.round(n).toString();

// ── ANALYTICS TRACKING ──
// Sends anonymous events to the Cloudflare Worker for the admin dashboard.
// Only sends behavioral events (app opens, transactions created — count only, no amounts).
// Each browser tab gets a unique session_id so we can compute session lengths.
const TRACK_URL="https://finance-tracker-proxy.life-bekzat.workers.dev/track";
const SESSION_ID=Math.random().toString(36).slice(2,12)+"-"+Date.now().toString(36);

const track=(event_type,metadata={})=>{
  // Only track if we have a Telegram user (skip standalone web visitors)
  const u=tg?.initDataUnsafe?.user;
  if(!u?.id)return;

  // Read latest settings from localStorage (synchronous, fast — runs once per event)
  let s={};
  try{s=JSON.parse(localStorage.getItem("ft_settings")||"{}");}catch{}

  const platform=tg?.platform||"unknown"; // "ios" | "android" | "tdesktop" | "weba" | "webk" | etc.

  const payload={
    tg_id:u.id,
    username:u.username||null,
    first_name:u.first_name||null,
    language_code:u.language_code||null,
    ui_language:s.uiLanguage||null,
    ai_language:s.aiLanguage||null,
    ai_pet:s.aiPet||null,
    ai_tone:s.aiTone||null,
    platform,
    // Reminders preference — default ON if not set yet, so new users get reminders
    reminders_enabled:s.remindersEnabled!==false,
    session_id:SESSION_ID,
    event_type,
    metadata
  };
  // Fire-and-forget — never block the UI on telemetry
  try{
    fetch(TRACK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload),
      keepalive:true // lets the request survive page unload
    }).catch(()=>{});
  }catch{}
};

// ── STORAGE ──
// Telegram CloudStorage syncs data across devices for the same Telegram user.
// Falls back to localStorage if not running inside Telegram.
const CS = window.Telegram?.WebApp?.CloudStorage;
const CS_AVAILABLE = !!(CS && typeof CS.setItem === "function");

const LS={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  remove:(k)=>{try{localStorage.removeItem(k);}catch{}}
};

// Promise wrappers for Telegram CloudStorage callback API.
// Each call has a hard 2.5s timeout — if CloudStorage silently hangs
// (which can happen in certain Telegram contexts), the wrapper resolves
// to a safe fallback value and the app continues via localStorage.
const CS_TIMEOUT=2500;
const withTimeout=(fn,fallback)=>new Promise((resolve)=>{
  let done=false;
  const finish=(v)=>{if(!done){done=true;resolve(v);}};
  setTimeout(()=>finish(fallback),CS_TIMEOUT);
  try{fn(finish);}catch{finish(fallback);}
});

const csGetItem=(key)=>withTimeout(
  (done)=>CS.getItem(key,(err,val)=>done(err?null:val)),
  null
);
const csGetItems=(keys)=>withTimeout(
  (done)=>CS.getItems(keys,(err,vals)=>done(err?{}:(vals||{}))),
  {}
);
const csSetItem=(key,val)=>withTimeout(
  (done)=>CS.setItem(key,val,(err)=>done(!err)),
  false
);
const csRemoveItem=(key)=>withTimeout(
  (done)=>CS.removeItem(key,(err)=>done(!err)),
  false
);
const csGetKeys=()=>withTimeout(
  (done)=>CS.getKeys((err,keys)=>done(err?[]:(keys||[]))),
  []
);

// High-level storage: writes to both CloudStorage (if available) and localStorage.
// Reads prefer CloudStorage, falling back to localStorage.
const STORE={
  async get(key,def){
    if(CS_AVAILABLE){
      const val=await csGetItem(key);
      if(val){try{return JSON.parse(val);}catch{}}
    }
    return LS.get(key,def);
  },
  async set(key,value){
    LS.set(key,value);
    if(CS_AVAILABLE){
      const str=JSON.stringify(value);
      // CloudStorage has a 4096 char limit per value. Small items fit fine.
      if(str.length<=4096)await csSetItem(key,str);
    }
  },
  async remove(key){
    LS.remove(key);
    if(CS_AVAILABLE)await csRemoveItem(key);
  },
  // Transactions are stored individually as ft_txn_{id} because the array
  // can grow beyond the 4096 char per-value limit.
  async getAllTransactions(){
    if(CS_AVAILABLE){
      const keys=await csGetKeys();
      const txnKeys=keys.filter(k=>k.startsWith("ft_txn_"));
      if(txnKeys.length>0){
        const items=await csGetItems(txnKeys);
        return Object.values(items).map(v=>{try{return JSON.parse(v);}catch{return null;}}).filter(Boolean);
      }
    }
    return LS.get("ft_transactions",[]);
  },
  async saveTransaction(txn){
    const allLocal=LS.get("ft_transactions",[]);
    const filtered=allLocal.filter(t=>t.id!==txn.id);
    LS.set("ft_transactions",[...filtered,txn]);
    if(CS_AVAILABLE)await csSetItem(`ft_txn_${txn.id}`,JSON.stringify(txn));
  },
  async deleteTransaction(id){
    const allLocal=LS.get("ft_transactions",[]);
    LS.set("ft_transactions",allLocal.filter(t=>t.id!==id));
    if(CS_AVAILABLE)await csRemoveItem(`ft_txn_${id}`);
  }
};

// ── LIVE EXCHANGE RATES ──
// Fetches real-time rates from free public APIs. No API key required.
// - Fiat (USD, EUR): exchangerate-api (open access, no key)
// - Crypto (BTC, ETH, USDT): CoinGecko public API
// Returns an object like {KZT:1, USD:520, EUR:560, USDT:520, BTC:35000000, ETH:1750000}
// Each value = how many KZT equals 1 unit of that currency.
const fetchLiveRates=async()=>{
  const rates={KZT:1};
  try{
    // Fiat rates (USD, EUR) — converts from USD base, then cross-rates via USD→KZT
    const fiatRes=await fetch("https://open.er-api.com/v6/latest/USD");
    const fiatData=await fiatRes.json();
    if(fiatData?.rates?.KZT){
      const usdToKzt=fiatData.rates.KZT;
      rates.USD=usdToKzt;
      rates.EUR=fiatData.rates.EUR?usdToKzt/fiatData.rates.EUR:560;
      rates.USDT=usdToKzt; // USDT tracks USD 1:1
    }
  }catch(e){console.warn("Fiat rate fetch failed:",e);}

  try{
    // Crypto rates from CoinGecko — returns prices in USD, we convert to KZT
    const cryptoRes=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd");
    const cryptoData=await cryptoRes.json();
    const usdKzt=rates.USD||520;
    if(cryptoData?.bitcoin?.usd)rates.BTC=cryptoData.bitcoin.usd*usdKzt;
    if(cryptoData?.ethereum?.usd)rates.ETH=cryptoData.ethereum.usd*usdKzt;
    if(cryptoData?.tether?.usd)rates.USDT=cryptoData.tether.usd*usdKzt;
  }catch(e){console.warn("Crypto rate fetch failed:",e);}

  return rates;
};

const getAIComment=async(type,amount,currency,category,subcategory,note,settings)=>{
  if(!settings.aiEnabled)return null;
  const toneMap={
    soft:"gentle, warm, and encouraging — like a supportive friend cheering them on. Focus on positives even when the spending was questionable. Never make them feel bad",
    medium:"direct and lightly humorous — give an honest take with relatable comparisons. Comment on whether the purchase makes sense without being mean about it",
    harsh:"blunt, sarcastic, and brutally honest — call out wasteful spending directly. Be witty but cutting. Don't sugarcoat. Make them think twice next time",
    explicit:"completely uncensored, profane, and savage — use heavy profanity freely (fuck, shit, damn, hell, ass, dumbass, etc). Roast their spending choice HARD with creative, cutting insults specifically about the purchase decision. Be the friend who tells them their financial choices are stupid in the bluntest, funniest way possible. Mock the specific item, the amount, the timing — get creative and brutal. The goal is to make them laugh AND seriously reconsider next time. Stay focused on the SPENDING DECISION — never attack them as a person, their appearance, their relationships, or anything personal. Money choices only. Make it sting in a way that's funny enough to share."
  };
  const tone=toneMap[settings.aiTone]||toneMap.medium;
  const customExtra=settings.aiCustomPrompt?` ${settings.aiCustomPrompt}`:"";
  const lang=settings.aiLanguage||"English";
  const pet=PETS[settings.aiPet]||PETS.dog;

  const actionDesc=type==="income"
    ?`just received ${fmtFull(amount,currency)} as income from ${subcategory||category||"unspecified source"}`
    :`just spent ${fmtFull(amount,currency)} on ${subcategory||category||"something"}`;

  // Real price reference points for Kazakhstan (Astana/Almaty, 2026) so the AI can make
  // accurate, relatable comparisons. Without these, the model defaults to US prices and
  // says nonsense like "1000 KZT = 2 weeks of groceries". Anchored in KZT, with USD/USDT
  // rough equivalents the AI can derive from at ~520 KZT/USD.
  const kzPriceContext=`PRICE REFERENCE POINTS for Kazakhstan (use these for accurate comparisons):
- Coffee at a cafe: 1,500-2,500 KZT
- Bottle of water/soda: 200-500 KZT
- Bus/metro ride: 100-200 KZT
- Quick takeaway lunch (kebab, plov, samsa): 1,500-3,000 KZT
- Restaurant dinner for one: 5,000-10,000 KZT
- Fancy restaurant dinner for one: 15,000-30,000 KZT
- Weekly groceries for one person: 25,000-40,000 KZT
- Monthly groceries for one person: 100,000-150,000 KZT
- Movie ticket: 2,500-4,000 KZT
- Gym membership/month: 15,000-30,000 KZT
- Apartment rent (1-bedroom, Astana): 200,000-350,000 KZT/month
- Average monthly salary: 350,000-500,000 KZT
- Taxi across city: 1,500-3,000 KZT
- iPhone (latest): 700,000-900,000 KZT
- Domestic flight: 30,000-60,000 KZT
- Tank of gas: 15,000-25,000 KZT
For USD/USDT: roughly divide KZT amounts by 520 (so $1 ≈ 520 KZT).
Use ONLY benchmarks that fit naturally — don't list multiple comparisons.`;

  // Add stronger language guidance for Kazakh — the model needs explicit instructions
  // to produce natural Kazakh rather than awkward word-for-word translations
  const langGuidance=lang==="Kazakh"
    ? `Respond in Kazakh (қазақ тілі). Use natural, native-sounding Kazakh — proper grammar, correct verb endings, and idiomatic phrasing. Avoid Russian loanwords when a clear Kazakh equivalent exists. Use the colloquial register (informal "сен" form) since this is a personal pet companion. Keep currency names in their natural Kazakh forms (теңге, доллар).`
    : `Respond in ${lang}.`;

  const systemPrompt=`${pet.persona} You live in their budgeting app and comment briefly on their financial actions. Tone style: ${tone}.

${kzPriceContext}

When making "that's X cups of coffee" type comparisons, use the price points above and ROUND sensibly. For small amounts (under 500 KZT), don't compare to groceries or rent — pick something that actually costs that much (a soda, a bus ride). Match the comparison to the actual size of the expense.${customExtra}

Keep it to 1-2 sentences MAX. ${langGuidance} No preamble, no emoji overload (pet emojis are added by the app separately), just the comment directly in character.`;

  const userMsg=`I ${actionDesc}. My note: "${note||"no note"}". Give me your quick take.`;

  try{
    // Calls are routed through a Cloudflare Worker which holds the Anthropic API key
    // as an encrypted secret, keeping it out of this public repo.
    // Model selection: Kazakh is underrepresented in LLM training data and benefits
    // significantly from Sonnet's stronger multilingual abilities. English/Russian
    // work well on Haiku 4.5 (~5x cheaper), so we only use Sonnet when needed.
    // Note: model IDs change as Anthropic releases new versions — currently on Sonnet 4.6.
    const model=lang==="Kazakh"?"claude-sonnet-4-6":"claude-haiku-4-5-20251001";
    const res=await fetch("https://finance-tracker-proxy.life-bekzat.workers.dev",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:model,
        max_tokens:120,
        system:systemPrompt,
        messages:[{role:"user",content:userMsg}]
      })
    });
    const d=await res.json();
    // If the API returned an error, surface it in the comment so the user can diagnose
    if(d.error){
      console.error("API error:",d.error);
      track("ai_error",{message:(d.error.message||d.error.type||"unknown").slice(0,200)});
      return `(Error: ${d.error.message||d.error.type||"AI unavailable"})`;
    }
    return d.content?.[0]?.text||null;
  }catch(e){
    console.error("AI error:",e);
    return null;
  }
};

// Translation function: returns translated string or falls back to the original English

// Detect the user's system language and map to one of our supported UI languages.
// Priority: Telegram WebApp language → browser language → English fallback.
// Maps any "ru-*" code to Russian, "kk-*" to Kazakh, everything else → English.
const detectSystemLanguage=()=>{
  try{
    const tgLang=window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code;
    const browserLang=navigator.language||navigator.userLanguage||"";
    const code=(tgLang||browserLang||"").toLowerCase();
    if(code.startsWith("ru"))return"Russian";
    if(code.startsWith("kk")||code.startsWith("kz"))return"Kazakh";
    return"English";
  }catch(e){return"English";}
};

// ── ADD TRANSACTION MODAL ──
function AddModal({open,onClose,accounts,categories,settings,onSave,t,initMode}){
  const[mode,setMode]=useState(initMode||"expense");
  const[amount,setAmount]=useState("");
  const[accountId,setAccountId]=useState(accounts[0]?.id||"");
  const[toAccountId,setToAccountId]=useState(accounts[1]?.id||"");
  const[currency,setCurrency]=useState("KZT");
  const[categoryId,setCategoryId]=useState("");
  const[subcategoryId,setSubcategoryId]=useState("");
  const[note,setNote]=useState("");
  const[date,setDate]=useState(new Date().toISOString().split("T")[0]);
  const[time,setTime]=useState(()=>{
    const d=new Date();
    return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  });
  const[customRate,setCustomRate]=useState(null);
  const[loading,setLoading]=useState(false);

  const selAcc=accounts.find(a=>a.id===accountId);
  const availableCurrencies=selAcc?getAccountCurrencies(selAcc.type):["KZT"];

  // When the From account changes, if the chosen currency isn't valid for that account type, reset to the account's default
  useEffect(()=>{
    if(selAcc&&!availableCurrencies.includes(currency)){
      setCurrency(selAcc.currency||availableCurrencies[0]);
    }
  },[accountId]);

  // CRITICAL FIX: When the From account changes, ensure the To account is different.
  // Without this, the To dropdown filters out the new From account but the underlying
  // toAccountId state can still point to it, causing "transfer to same account" bugs.
  useEffect(()=>{
    if(toAccountId===accountId||!accounts.find(a=>a.id===toAccountId)){
      const firstOther=accounts.find(a=>a.id!==accountId);
      if(firstOther)setToAccountId(firstOther.id);
    }
    // Reset custom rate when accounts change so live rate is used by default
    setCustomRate(null);
  },[accountId,accounts]);

  useEffect(()=>{
    if(open){
      setMode(initMode||"expense");
      setAmount("");setNote("");setCategoryId("");setSubcategoryId("");
      setCustomRate(null);
      // Reset date and time to "now" each time the modal opens
      const now=new Date();
      setDate(now.toISOString().split("T")[0]);
      setTime(`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`);
      // Default currency = selected account's native currency
      const acc=accounts.find(a=>a.id===accountId);
      if(acc)setCurrency(acc.currency);
    }
  },[open,initMode]);

  const selCat=categories.find(c=>c.id===categoryId);
  const filteredCategories=categories.filter(c=>categoryMatchesMode(c,mode));
  const handleModeChange=(newMode)=>{
    setMode(newMode);
    setCategoryId("");
    setSubcategoryId("");
  };

  // For transfers: compute how much the destination account will receive.
  // Default uses the live exchange rate, but customRate (if set) overrides it.
  // The rate represents "1 source-currency unit = X destination-currency units".
  const toAcc=accounts.find(a=>a.id===toAccountId);
  const autoRate=useMemo(()=>{
    if(!selAcc||!toAcc)return 1;
    if(selAcc.currency===toAcc.currency)return 1;
    const rates=settings.exchangeRates||{};
    // Cross-rate via KZT: 1 source = X KZT = X / dest_rate destination units
    return(rates[selAcc.currency]||1)/(rates[toAcc.currency]||1);
  },[selAcc,toAcc,settings.exchangeRates]);
  const effectiveRate=customRate!=null?+customRate:autoRate;
  const transferConverted=useMemo(()=>{
    if(mode!=="transfer"||!selAcc||!toAcc||!amount||isNaN(+amount))return null;
    return{amount:(+amount)*effectiveRate,currency:toAcc.currency};
  },[mode,selAcc,toAcc,amount,effectiveRate]);

  const handleSave=async()=>{
    if(!amount||isNaN(+amount)||+amount<=0)return;
    // Safety check: prevent transfer to the same account (would otherwise lose money on screen)
    if(mode==="transfer"&&accountId===toAccountId){
      alert("Source and destination accounts must be different.");
      return;
    }
    haptic();
    const acc=accounts.find(a=>a.id===accountId);
    // For non-transfers, use the selected transaction currency.
    // For transfers, we record the outgoing amount in the source account's currency
    // and handle the destination conversion via toAmount/toCurrency.
    const txnCurrency=mode==="transfer"?(acc?.currency||"KZT"):currency;
    const txn={
      id:uid(),type:mode,amount:+amount,currency:txnCurrency,
      accountId,toAccountId:mode==="transfer"?toAccountId:null,
      categoryId:categoryId||null,subcategoryId:subcategoryId||null,
      note,date:new Date(`${date}T${time||"00:00"}`).toISOString(),aiComment:null,
      // For transfers, store the converted destination amount AND the rate used,
      // so the same conversion is reversed exactly when the transaction is deleted.
      toAmount:mode==="transfer"&&transferConverted?transferConverted.amount:null,
      toCurrency:mode==="transfer"&&transferConverted?transferConverted.currency:null,
      transferRate:mode==="transfer"?effectiveRate:null
    };
    if((mode==="expense"||mode==="income")&&settings.aiEnabled){
      setLoading(true);
      const cat=categories.find(c=>c.id===categoryId);
      const sub=cat?.subcategories?.find(s=>s.id===subcategoryId);
      const comment=await getAIComment(mode,+amount,txnCurrency,cat?.name||"",sub?.name||"",note,settings);
      txn.aiComment=comment;
      setLoading(false);
    }
    onSave(txn);
    // Track count only — never amount, account name, category name, or note content
    track("txn_create",{type:mode,currency:txnCurrency,has_note:!!note});
    if((mode==="expense"||mode==="income")&&settings.aiEnabled){
      track("ai_request",{language:settings.aiLanguage,pet:settings.aiPet,tone:settings.aiTone});
    }
    onClose();
  };

  const modes=[{k:"expense",l:tr("Expense",settings.uiLanguage),c:"#ef4444"},{k:"income",l:tr("Income",settings.uiLanguage),c:"#10b981"},{k:"transfer",l:tr("Transfer",settings.uiLanguage),c:"#3b82f6"}];

  return(
    <Modal open={open} onClose={onClose} title={tr("Add Transaction",settings.uiLanguage)} t={t}>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {modes.map(({k,l,c})=>(
          <button key={k} onClick={()=>handleModeChange(k)} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1.5px solid ${k===mode?c:t.border}`,background:k===mode?c+"22":"transparent",color:k===mode?c:t.textMuted,fontWeight:500,fontSize:13,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>{l}</button>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div>
          <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Amount",settings.uiLanguage)}</div>
          <div style={{display:"flex",gap:8}}>
            <input value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" type="number" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"13px 14px",fontSize:24,fontFamily:"monospace",fontWeight:500}}/>
            {/* Currency picker — only shown for income/expense, not transfers (transfers use source account's currency) */}
            {mode!=="transfer"&&(
              <select value={currency} onChange={e=>setCurrency(e.target.value)} style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"0 12px",fontSize:14,fontWeight:600,cursor:"pointer",minWidth:80,flexShrink:0}}>
                {availableCurrencies.map(c=><option key={c} value={c}>{sym[c]} {c}</option>)}
              </select>
            )}
          </div>
        </div>
        <div>
          <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("From Account",settings.uiLanguage)}</div>
          <select value={accountId} onChange={e=>setAccountId(e.target.value)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name} ({a.currency})</option>)}
          </select>
        </div>
        {mode==="transfer"&&(
          <div>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("To Account",settings.uiLanguage)}</div>
            <select value={toAccountId} onChange={e=>setToAccountId(e.target.value)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
              {accounts.filter(a=>a.id!==accountId).map(a=><option key={a.id} value={a.id}>{a.icon} {a.name} ({a.currency})</option>)}
            </select>
            {/* Cross-currency: show editable rate field with live default + arrival preview */}
            {selAcc&&toAcc&&selAcc.currency!==toAcc.currency&&(
              <div style={{marginTop:10,padding:"12px",background:t.bgCard2,borderRadius:10,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{fontSize:12,color:t.textMuted}}>Exchange rate</span>
                  {customRate!=null&&(
                    <span onClick={()=>setCustomRate(null)} style={{fontSize:11,color:"#10b981",cursor:"pointer",textDecoration:"underline"}}>Use live rate</span>
                  )}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:t.text}}>
                  <span style={{fontFamily:"monospace",color:t.textMuted}}>1 {selAcc.currency} =</span>
                  <input
                    type="number"
                    step="any"
                    value={customRate!=null?customRate:autoRate.toFixed(autoRate>=100?2:6)}
                    onChange={e=>setCustomRate(e.target.value)}
                    style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${customRate!=null?"#10b981":t.border}`,borderRadius:8,padding:"7px 10px",fontSize:13,fontFamily:"monospace",textAlign:"right"}}
                  />
                  <span style={{fontFamily:"monospace",color:t.textMuted}}>{toAcc.currency}</span>
                </div>
                <div style={{fontSize:11,color:t.textMuted,fontStyle:"italic"}}>
                  {customRate!=null?"📝 Using your rate":"🌐 Live rate (tap to override)"}
                </div>
                {transferConverted&&(
                  <div style={{paddingTop:8,borderTop:`1px solid ${t.border}`,display:"flex",alignItems:"center",gap:8,fontSize:13}}>
                    <span>💱</span>
                    <span style={{color:t.textMuted}}>Will arrive:</span>
                    <span style={{color:t.text,fontWeight:600,fontFamily:"monospace",marginLeft:"auto"}}>{fmtFull(transferConverted.amount,transferConverted.currency)}</span>
                  </div>
                )}
              </div>
            )}
          </div>
        )}
        {mode!=="transfer"&&(
          <div>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Category",settings.uiLanguage)}</div>
            <select value={categoryId} onChange={e=>{setCategoryId(e.target.value);setSubcategoryId("");}} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
              <option value="">— Select category —</option>
              {filteredCategories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
            </select>
          </div>
        )}
        {mode!=="transfer"&&selCat?.subcategories?.length>0&&(
          <div>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Subcategory",settings.uiLanguage)}</div>
            <select value={subcategoryId} onChange={e=>setSubcategoryId(e.target.value)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
              <option value="">— Select subcategory —</option>
              {selCat.subcategories.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
        )}
        <div style={{display:"flex",gap:10,width:"100%"}}>
          <div style={{flex:"3 1 0",minWidth:0,overflow:"hidden"}}>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Date",settings.uiLanguage)}</div>
            <input value={date} onChange={e=>setDate(e.target.value)} type="date" style={{width:"100%",maxWidth:"100%",display:"block",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 8px",fontSize:13,boxSizing:"border-box",textAlign:"center",WebkitAppearance:"none"}}/>
          </div>
          <div style={{flex:"2 1 0",minWidth:0,overflow:"hidden"}}>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Time",settings.uiLanguage)}</div>
            <input value={time} onChange={e=>setTime(e.target.value)} type="time" style={{width:"100%",maxWidth:"100%",display:"block",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 8px",fontSize:13,boxSizing:"border-box",textAlign:"center",WebkitAppearance:"none"}}/>
          </div>
        </div>
        <div>
          <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Note",settings.uiLanguage)}</div>

          ):(

          )}
        </div>
      </div>
    </Modal>
  );
}

// ── TRANSACTION DETAIL MODAL ──
function TxnDetail({txn,open,onClose,accounts,categories,onDelete,settings,t}){
  if(!txn)return null;
  const acc=accounts.find(a=>a.id===txn.accountId);
  const toAcc=accounts.find(a=>a.id===txn.toAccountId);
  const cat=categories.find(c=>c.id===txn.categoryId);
  const sub=cat?.subcategories?.find(s=>s.id===txn.subcategoryId);

  const rows=[

    {l:"Date",v:`${new Date(txn.date).toLocaleDateString("en-US",{weekday:"short",year:"numeric",month:"short",day:"numeric"})} · ${fmtTime(txn.date)}`},
    txn.note?{l:"Note",v:txn.note}:null,

  return(
    <Modal open={open} onClose={onClose} title={tr("Transaction Detail",settings?.uiLanguage)} t={t}>

          <div style={{fontSize:15,color:t.textMuted,marginTop:4}}>{cat?.name}{sub?` · ${sub.name}`:""}</div>
        </div>
        {rows.map(({l,v})=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${t.border}`}}>
            <span style={{color:t.textMuted,fontSize:14}}>{l}</span>

          <div style={{background:t.bgCard2,borderRadius:12,padding:"14px",borderLeft:"3px solid #10b981"}}>
            <div style={{fontSize:12,color:"#10b981",marginBottom:5,fontWeight:600}}>{(PETS[settings?.aiPet]||PETS.dog).emoji} Your {(PETS[settings?.aiPet]||PETS.dog).name} says</div>

          </div>
        )}

          const lang=settings?.uiLanguage||"English";
          const confirmMsg=lang==="Russian"?"Точно удалить эту операцию? Это действие необратимо.":
                          lang==="Kazakh"?"Бұл операцияны жою керек пе? Бұл әрекетті қайтаруға болмайды.":
                          "Delete this transaction? This action cannot be undone.";
          if(confirm(confirmMsg)){
            haptic("heavy");
            onDelete(txn.id);
            onClose();
          }
        }} style={{width:"100%",background:"transparent",color:"#ef4444",border:"1.5px solid #ef4444",borderRadius:12,padding:"13px",fontSize:15,fontWeight:500,cursor:"pointer",fontFamily:"system-ui,sans-serif",marginTop:4}}>{tr("Delete Transaction",settings?.uiLanguage)}</button>
      </div>
    </Modal>
  );
}

// ── GOALS CARD (HOME SCREEN) ──
// Compact horizontal scroll showing each goal's progress with bar + comparison.
// Tap a goal to expand and see what the remaining amount could buy.
function GoalsCard({goals,transactions,settings,t}){
  const[expandedId,setExpandedId]=useState(null);
  if(!goals||goals.length===0)return null;
  const{selectedCurrency,exchangeRates,uiLanguage}=settings;
  const lang=uiLanguage||"English";

  // For each goal: compute saved amount = sum(income) - sum(expense) since the goal's createdAt date.
  // This means "savings achieved while pursuing this goal" rather than total balance.
  const computeSaved=(goal)=>{
    const since=new Date(goal.createdAt).getTime();
    let net=0;
    transactions.forEach(tx=>{
      if(new Date(tx.date).getTime()<since)return;
      if(tx.type==="income")net+=toKZT(tx.amount,tx.currency,exchangeRates);
      else if(tx.type==="expense")net-=toKZT(tx.amount,tx.currency,exchangeRates);
    });
    return Math.max(0,net);
  };

  return(
    <div style={{marginBottom:18}}>
      <div style={{fontSize:16,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif",marginBottom:10,display:"flex",alignItems:"center",gap:6}}>
        🎯 {tr("Savings Goals",lang)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {goals.map(goal=>{
          const savedKzt=computeSaved(goal);
          const targetKzt=goal.targetKzt;
          const remainingKzt=Math.max(0,targetKzt-savedKzt);
          const pct=targetKzt>0?Math.min(100,(savedKzt/targetKzt)*100):0;
          const isComplete=savedKzt>=targetKzt;
          const isExpanded=expandedId===goal.id;

          // Days info (if deadline set)
          let deadlineText=null;
          if(goal.deadline){
            const daysLeft=Math.ceil((new Date(goal.deadline).getTime()-Date.now())/(1000*60*60*24));
            if(daysLeft>0)deadlineText=`${daysLeft} ${tr("days left",lang)}`;
            else if(daysLeft===0)deadlineText=tr("Due today",lang);
            else deadlineText=`${Math.abs(daysLeft)} ${tr("days overdue",lang)}`;
          }

          return(
            <div key={goal.id} onClick={()=>setExpandedId(isExpanded?null:goal.id)} style={{background:t.bgCard,borderRadius:14,padding:"14px",border:`1px solid ${isComplete?"#10b98166":t.border}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{fontSize:24}}>{goal.emoji||"🎯"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:600,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{goal.name}</div>
                  <div style={{fontSize:11,color:t.textMuted}}>
                    {fmtAmt(fromKZT(savedKzt,selectedCurrency,exchangeRates),selectedCurrency)} / {fmtAmt(fromKZT(targetKzt,selectedCurrency,exchangeRates),selectedCurrency)}
                    {deadlineText&&<span style={{marginLeft:8}}>· {deadlineText}</span>}
                  </div>
                </div>
                <div style={{fontSize:14,fontWeight:700,color:isComplete?"#10b981":t.text,fontFamily:"monospace"}}>{Math.round(pct)}%</div>
              </div>
              {/* Progress bar */}
              <div style={{height:8,background:t.bgInput,borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,background:isComplete?"linear-gradient(90deg,#10b981,#34d399)":"linear-gradient(90deg,#3b82f6,#10b981)",borderRadius:4,transition:"width .4s ease"}}/>
              </div>
              {/* Expanded view: comparison breakdown */}
              {isExpanded&&!isComplete&&(
                <div className="fade-in" style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${t.border}`}}>
                  <div style={{fontSize:11,color:t.textMuted,marginBottom:8,fontStyle:"italic"}}>
                    {tr("Remaining",lang)}: {fmtAmt(fromKZT(remainingKzt,selectedCurrency,exchangeRates),selectedCurrency)} = {tr("equivalent of",lang)}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {COMPARISON_ITEMS
                      .map(item=>({...item,count:Math.floor(remainingKzt/item.kzt)}))
                      .filter(item=>item.count>=1&&item.count<=10000)
                      .slice(0,6)
                      .map((item,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:t.text,padding:"4px 0"}}>
                          <span style={{fontSize:16}}>{item.emoji}</span>
                          <span style={{fontFamily:"monospace",fontWeight:600}}>{item.count.toLocaleString()}</span>
                          <span style={{color:t.textMuted,fontSize:11}}>{tr(item.plural,lang)}</span>
                        </div>
                      ))}
                  </div>
                </div>
              )}
              {isExpanded&&isComplete&&(
                <div className="fade-in" style={{marginTop:12,paddingTop:12,borderTop:`1px solid #10b98144`,fontSize:13,color:"#10b981",textAlign:"center",fontWeight:600}}>
                  🎉 {tr("Goal achieved!",lang)}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Time-aware greeting based on hour of day. Returns a translation key so the
// caller can pass it through tr(). Picks Morning/Afternoon/Evening/Night.
const getGreetingKey=()=>{
  const h=new Date().getHours();
  if(h<5) return "Good night";
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  if(h<22) return "Good evening";
  return "Good night";
};

function HomeScreen({accounts,transactions,categories,fixedExpenses,goals,settings,onSettingsChange,onAddTxn,t,onTxnClick}){
  const{selectedCurrency,balanceHidden,exchangeRates}=settings;
  // Pick today's quote from the user's UI language. Use the same daily index across
  // all languages so the same wisdom appears in different languages on the same day.
  const quoteList=useMemo(()=>getQuotes(settings.uiLanguage),[settings.uiLanguage]);
  const quoteIdx=useMemo(()=>Math.floor(Date.now()/86400000)%quoteList.length,[quoteList.length]);
  const quote=quoteList[quoteIdx];
  const currencies=settings.activeCurrencies||["KZT","USD","EUR","USDT"];
  const cycleCur=()=>{const i=currencies.indexOf(selectedCurrency);onSettingsChange({...settings,selectedCurrency:currencies[(i+1)%currencies.length]});};
  const totalKZT=accounts.reduce((s,a)=>s+toKZT(a.balance,a.currency,exchangeRates),0);
  const total=fromKZT(totalKZT,selectedCurrency,exchangeRates);
  const now=new Date();
  const monthTxns=transactions.filter(tx=>sameMonth(tx.date,now.getFullYear(),now.getMonth()));
  const monthIncome=monthTxns.filter(t=>t.type==="income").reduce((s,t)=>s+toKZT(t.amount,t.currency,exchangeRates),0);
  const monthExpense=monthTxns.filter(t=>t.type==="expense").reduce((s,t)=>s+toKZT(t.amount,t.currency,exchangeRates),0);
  const upcomingFixed=fixedExpenses.filter(fe=>{
    const paid=monthTxns.some(t=>t.type==="expense"&&t.note&&t.note.toLowerCase().includes(fe.name.toLowerCase()));
    return!paid;
  });
  const totalFixed=upcomingFixed.reduce((s,fe)=>s+toKZT(fe.amount,fe.currency,exchangeRates),0);
  const remaining=monthIncome-monthExpense-totalFixed;
  // Show last 10 transactions on the home screen, grouped by date for easier scanning.
  // The grouping mirrors the History screen's pattern: a date header with daily total, then the rows.
  const recentTxns=transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
  // Group recent txns into [{ dateKey, label, dailyKzt, items: [...] }, ...] in display order
  const recentByDate=useMemo(()=>{
    const groups={};
    recentTxns.forEach(tx=>{
      const d=new Date(tx.date);
      const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if(!groups[key]){
        groups[key]={
          dateKey:key,
          dateObj:d,
          // "Mon, Apr 10" style — matches the History screen
          label:d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),
          items:[],
          incomeKzt:0,
          expenseKzt:0
        };
      }
      groups[key].items.push(tx);
      const kzt=toKZT(tx.amount,tx.currency,exchangeRates);
      if(tx.type==="income")groups[key].incomeKzt+=kzt;
      else if(tx.type==="expense")groups[key].expenseKzt+=kzt;
    });
    // Maintain newest-first order based on the most recent transaction's date
    return Object.values(groups).sort((a,b)=>b.dateObj-a.dateObj);
  },[recentTxns,exchangeRates]);

  return(
    <div style={{height:"100%",overflow:"auto",paddingBottom:16}}>
      {/* ─── REFINED HEADER ─── */}
      {/* No more dark gradient banner — the page background carries through. Cleaner, more spacious. */}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            {settings.profilePicture
              ? <img src={settings.profilePicture} style={{width:42,height:42,borderRadius:"50%",objectFit:"cover",border:`2px solid ${t.bgCard}`}} alt="profile"/>
              : <div style={{width:42,height:42,borderRadius:"50%",background:"linear-gradient(135deg,#10b981,#34d399)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:600,fontSize:17,color:"#fff"}}>{(settings.displayName||"U")[0]}</div>
            }
            <div>
              {/* Time-aware greeting + name on one line, no date underneath */}
              <div style={{fontSize:12,color:t.textMuted,lineHeight:1.2}}>{tr(getGreetingKey(),settings.uiLanguage)}</div>
              <div style={{fontSize:16,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif",lineHeight:1.2,marginTop:2}}>{settings.displayName}</div>
            </div>
          </div>
          {/* Theme toggle stays in the corner — small, non-intrusive */}
          <button
            onClick={()=>onSettingsChange({...settings,darkMode:!settings.darkMode})}
            style={{background:t.bgCard2,border:`1px solid ${t.border}`,borderRadius:"50%",width:38,height:38,color:t.textMuted,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}
            aria-label="Toggle theme">
            {settings.darkMode?"☀️":"🌙"}
          </button>
        </div>

        {/* ─── HERO BALANCE CARD ─── */}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,position:"relative"}}>
            <div style={{fontSize:12,color:t.textMuted,display:"flex",alignItems:"center",gap:6}}>

                {balanceHidden?"🙈":"👁"}

            </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,paddingTop:12,borderTop:`1px solid ${t.border}`,position:"relative"}}>

                  {/* Date header row */}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,padding:"0 4px"}}>
                    <div style={{fontSize:12,color:t.textMuted,fontWeight:500,fontFamily:"system-ui,sans-serif"}}>{group.label}</div>
                    {dailyNet!==0&&(
                      <div style={{fontSize:12,fontWeight:600,color:dailyColor,fontFamily:"monospace"}}>
                        {dailySign}{fmtAmt(dailyDisplay,selectedCurrency)}
                      </div>
                    )}
                  </div>
                  {/* Transactions for this date */}
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {group.items.map(txn=>{
                      const acc=accounts.find(a=>a.id===txn.accountId);
                      const toAcc=accounts.find(a=>a.id===txn.toAccountId);
                      const cat=categories.find(c=>c.id===txn.categoryId);
                      const color=txn.type==="expense"?"#ef4444":txn.type==="income"?"#10b981":"#3b82f6";
                      const sign=txn.type==="expense"?"-":txn.type==="income"?"+":"";
                      const isTransfer=txn.type==="transfer";
                      // Show both arrival amount alongside the outgoing amount when it's a cross-currency transfer
                      const showBothAmounts=isTransfer&&txn.toAmount!=null&&txn.toCurrency&&txn.toCurrency!==txn.currency;
                      return(
                        <div key={txn.id} onClick={()=>onTxnClick(txn)} style={{background:t.bgCard,borderRadius:14,padding:"12px 14px",border:`1px solid ${t.border}`,cursor:"pointer"}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                            <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                              <div style={{width:38,height:38,borderRadius:10,background:(isTransfer?"#3b82f6":(cat?.color||"#64748b"))+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{isTransfer?"⇄":cat?.icon||"💸"}</div>
                              <div style={{minWidth:0,flex:1}}>
                                <div style={{fontSize:14,fontWeight:500,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                                  {isTransfer?(
                                    <span>{acc?.name||"?"} <span style={{color:t.textMuted}}>→</span> {toAcc?.name||"?"}</span>
                                  ):(cat?.name||"Unknown")}
                                </div>
                                {/* Date is now shown in the group header, so omit it from the row to reduce noise */}
                                <div style={{fontSize:11,color:t.textMuted}}>
                                  {fmtTime(txn.date)} · {isTransfer?"Transfer":(acc?.name||"")}{txn.note?` · ${txn.note}`:""}
                                </div>
                              </div>
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{fontSize:16,fontWeight:700,color,fontFamily:"monospace"}}>{sign}{fmtAmt(txn.amount,txn.currency)}</div>
                              {showBothAmounts&&(
                                <div style={{fontSize:11,color:t.textMuted,fontFamily:"monospace",marginTop:2}}>→ +{fmtAmt(txn.toAmount,txn.toCurrency)}</div>
                              )}
                            </div>
                          </div>
                          {txn.aiComment&&(
                            <PetCommentBlock comment={txn.aiComment} petEmoji={(PETS[settings.aiPet]||PETS.dog).emoji} t={t}/>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── ANALYTICS SCREEN ──
function AnalyticsScreen({transactions,categories,settings,t}){
  const now=new Date();
  const{selectedCurrency,exchangeRates}=settings;
  // Sub-tab state: "overview" (current pie + calendar) or "progress" (period comparison)
  const[subTab,setSubTab]=useState("overview");
  // My Progress controls: mode (weeks/months) and how many periods to compare
  const[periodMode,setPeriodMode]=useState("months");
  const[periodCount,setPeriodCount]=useState(3);

  // ─ Pie chart filter: independent date range ─
  // Default: this month so first-time users see something useful immediately.
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const toDateStr=(d)=>d.toISOString().split("T")[0];
  const[pieFromDate,setPieFromDate]=useState(toDateStr(monthStart));
  const[pieToDate,setPieToDate]=useState(toDateStr(today));
  // Quick-select preset chips for common ranges
  const applyRangePreset=(presetKey)=>{
    const t=new Date();
    let from,to=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    if(presetKey==="thisMonth")from=new Date(t.getFullYear(),t.getMonth(),1);
    else if(presetKey==="lastMonth"){from=new Date(t.getFullYear(),t.getMonth()-1,1);to=new Date(t.getFullYear(),t.getMonth(),0);}
    else if(presetKey==="last30")from=new Date(t.getFullYear(),t.getMonth(),t.getDate()-29);
    else if(presetKey==="last7")from=new Date(t.getFullYear(),t.getMonth(),t.getDate()-6);
    else if(presetKey==="thisYear")from=new Date(t.getFullYear(),0,1);
    setPieFromDate(toDateStr(from));setPieToDate(toDateStr(to));
  };

  // ─ Calendar (daily heatmap) filter: month-by-month navigation, separate from pie ─
  const[calYear,setCalYear]=useState(now.getFullYear());
  const[calMonth,setCalMonth]=useState(now.getMonth());
  const prevCalMonth=()=>{if(calMonth===0){setCalYear(y=>y-1);setCalMonth(11);}else setCalMonth(m=>m-1);};
  const nextCalMonth=()=>{if(calMonth===11){setCalYear(y=>y+1);setCalMonth(0);}else setCalMonth(m=>m+1);};

  // ─ Pie chart data: filtered by the independent date range ─
  const pieRangeData=useMemo(()=>{
    // End-of-day inclusive range so transactions on the toDate are included
    const fromTs=new Date(`${pieFromDate}T00:00:00`).getTime();
    const toTs=new Date(`${pieToDate}T23:59:59`).getTime();
    const filtered=transactions.filter(tx=>{
      if(tx.type!=="expense")return false;
      const ts=new Date(tx.date).getTime();
      return ts>=fromTs&&ts<=toTs;
    });
    const totalKzt=filtered.reduce((s,tx)=>s+toKZT(tx.amount,tx.currency,exchangeRates),0);
    const incomeKzt=transactions.filter(tx=>{
      if(tx.type!=="income")return false;
      const ts=new Date(tx.date).getTime();
      return ts>=fromTs&&ts<=toTs;
    }).reduce((s,tx)=>s+toKZT(tx.amount,tx.currency,exchangeRates),0);
    const bycat={};
    filtered.forEach(tx=>{
      const cat=categories.find(c=>c.id===tx.categoryId);
      const key=cat?.id||"other";
      if(!bycat[key])bycat[key]={name:cat?.name||"Other",icon:cat?.icon||"❓",color:cat?.color||"#64748b",value:0};
      bycat[key].value+=toKZT(tx.amount,tx.currency,exchangeRates);
    });
    return{
      slices:Object.values(bycat).sort((a,b)=>b.value-a.value),
      totalExp:totalKzt,
      totalInc:incomeKzt,
      txnCount:filtered.length
    };
  },[transactions,categories,exchangeRates,pieFromDate,pieToDate]);

  // ─ Calendar data: per-day expense totals for the selected calendar month ─
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const dayTotals=useMemo(()=>{
    const arr=[];
    for(let d=1;d<=daysInMonth;d++){
      const dayExp=transactions.filter(tx=>tx.type==="expense"&&sameDay(tx.date,calYear,calMonth,d))
        .reduce((s,tx)=>s+toKZT(tx.amount,tx.currency,exchangeRates),0);
      arr.push({day:d,amount:dayExp});
    }
    return arr;
  },[transactions,calYear,calMonth,daysInMonth,exchangeRates]);
  const calMonthTotal=dayTotals.reduce((s,d)=>s+d.amount,0);

  const presets=[
    {k:"last7",l:"7d"},
    {k:"last30",l:"30d"},
    {k:"thisMonth",l:"This month"},
    {k:"lastMonth",l:"Last month"},
    {k:"thisYear",l:"Year"}
  ];

  // ─ MY PROGRESS: build the period comparison data ─
  // For each selected period (most recent on the right), compute:
  //   - income / expense / saved totals (KZT, then converted to display currency)
  //   - per-category expense breakdown (top 5 + Other)
  // Periods are aligned to calendar weeks (Mon–Sun) or calendar months for clarity.
  const periods = useMemo(()=>{
    const list = [];
    const today = new Date();
    if(periodMode === "months"){
      // Generate the last N calendar months, oldest first
      for(let i = periodCount - 1; i >= 0; i--){
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        const start = new Date(d.getFullYear(), d.getMonth(), 1);
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
        const label = d.toLocaleDateString("en-US", {month:"short", year: i === 0 ? undefined : "2-digit"});
        list.push({start, end, label});
      }
    } else {
      // Weeks: ISO weeks starting Monday. Most recent is the current (partial) week.
      // Find this week's Monday
      const day = today.getDay() || 7; // Sunday → 7
      const thisMon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (day - 1));
      for(let i = periodCount - 1; i >= 0; i--){
        const start = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - i*7);
        const end   = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6, 23, 59, 59);
        const label = i === 0 ? "This wk" : i === 1 ? "Last wk" : `${start.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
        list.push({start, end, label});
      }
    }
    return list;
  }, [periodMode, periodCount]);

  // Compute totals + category breakdown per period
  const periodStats = useMemo(()=>{
    return periods.map(p=>{
      const startMs = p.start.getTime();
      const endMs = p.end.getTime();
      let incomeKzt = 0, expenseKzt = 0;
      const categoryKzt = {}; // categoryId → kzt expense
      transactions.forEach(tx=>{
        const txMs = new Date(tx.date).getTime();
        if(txMs < startMs || txMs > endMs) return;
        const kzt = toKZT(tx.amount, tx.currency, exchangeRates);
        if(tx.type === "income") incomeKzt += kzt;
        else if(tx.type === "expense"){
          expenseKzt += kzt;
          const cid = tx.categoryId || "uncategorized";
          categoryKzt[cid] = (categoryKzt[cid] || 0) + kzt;
        }
        // transfers don't count toward income/expense in this view
      });
      return {
        ...p,
        incomeKzt, expenseKzt,
        savedKzt: incomeKzt - expenseKzt,
        categoryKzt
      };
    });
  }, [periods, transactions, exchangeRates]);

  // Find top 5 expense categories across all periods (by total spend)
  const topCategories = useMemo(()=>{
    const total = {};
    periodStats.forEach(p=>{
      Object.entries(p.categoryKzt).forEach(([cid, kzt])=>{
        total[cid] = (total[cid] || 0) + kzt;
      });
    });
    return Object.entries(total)
      .sort((a,b)=>b[1]-a[1])
      .slice(0, 5)
      .map(([cid])=>{
        const cat = categories.find(c=>c.id===cid);
        return { id: cid, name: cat?.name || tr("Uncategorized", settings.uiLanguage), icon: cat?.icon || "📂" };
      });
  }, [periodStats, categories, settings.uiLanguage]);

  // Helper: percentage change from first to last period
  const pctChange = (first, last) => {
    if(!first || first === 0) return last > 0 ? 100 : 0;
    return Math.round(((last - first) / Math.abs(first)) * 100);
  };

  return(
    <div style={{height:"100%",overflow:"auto",padding:"calc(env(safe-area-inset-top, 20px) + 40px) 16px 16px"}}>
      <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,fontWeight:700,color:t.text,marginBottom:16}}>{tr("Analytics",settings.uiLanguage)}</div>

      {/* ─────── Sub-tab switcher: Overview | My Progress ─────── */}
      <div style={{display:"flex",gap:0,marginBottom:16,background:t.bgCard2,borderRadius:10,padding:4,border:`1px solid ${t.border}`}}>
        {[{k:"overview",l:tr("Overview",settings.uiLanguage)},{k:"progress",l:tr("My Progress",settings.uiLanguage)}].map(tab=>(
          <button key={tab.k}
            onClick={()=>setSubTab(tab.k)}
            style={{
              flex:1,
              background: subTab===tab.k ? t.bgCard : "transparent",
              color: subTab===tab.k ? t.text : t.textMuted,
              border:"none",
              borderRadius:7,
              padding:"8px 12px",
              fontSize:13,
              fontWeight:600,
              cursor:"pointer",
              fontFamily:"system-ui,sans-serif",
              transition:"all 0.2s ease",
              boxShadow: subTab===tab.k ? "0 1px 3px rgba(0,0,0,0.15)" : "none"
            }}>
            {tab.l}
          </button>
        ))}
      </div>

      {/* ─────── Sliding panel container: Overview | My Progress ─────── */}
      {/* The wrapper has overflow:hidden, the inner flex container is 200% wide and translates left/right */}
      <div style={{overflow:"hidden",position:"relative"}}>
        <div style={{
          display:"flex",
          width:"200%",
          transform: subTab==="overview" ? "translateX(0)" : "translateX(-50%)",
          transition:"transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1)"
        }}>
          {/* ─── Pane 1: Overview (existing content) ─── */}
          <div style={{width:"50%",flexShrink:0,paddingRight:8}}>

      {/* ─────── Pie Chart card with own date range ─────── */}
      <div style={{background:t.bgCard,borderRadius:16,padding:"16px",border:`1px solid ${t.border}`,marginBottom:16}}>
        <div style={{fontSize:15,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif",marginBottom:10}}>Spending by Category</div>

        {/* Quick preset chips */}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          {presets.map(({k,l})=>(
            <button key={k} onClick={()=>applyRangePreset(k)} style={{background:t.bgInput,color:t.textMuted,border:`1px solid ${t.border}`,borderRadius:14,padding:"5px 12px",fontSize:11,cursor:"pointer",fontWeight:500}}>
              {l}
            </button>
          ))}
        </div>

        {/* Custom date range pickers */}
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14,padding:"10px 12px",background:t.bgInput,borderRadius:10}}>
          <input type="date" value={pieFromDate} onChange={e=>setPieFromDate(e.target.value)} style={{flex:1,minWidth:0,background:"transparent",color:t.text,border:"none",fontSize:12,padding:0,fontFamily:"system-ui,sans-serif",WebkitAppearance:"none"}}/>
          <span style={{color:t.textMuted,fontSize:12}}>→</span>
          <input type="date" value={pieToDate} onChange={e=>setPieToDate(e.target.value)} style={{flex:1,minWidth:0,background:"transparent",color:t.text,border:"none",fontSize:12,padding:0,fontFamily:"system-ui,sans-serif",WebkitAppearance:"none"}}/>
        </div>

        {/* Summary numbers for the selected range */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
          {[
            {l:"Income",v:pieRangeData.totalInc,c:"#10b981"},
            {l:"Spent",v:pieRangeData.totalExp,c:"#ef4444"},
            {l:"Net",v:pieRangeData.totalInc-pieRangeData.totalExp,c:"#3b82f6"}
          ].map(({l,v,c})=>(
            <div key={l} style={{background:t.bgInput,borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
              <div style={{fontSize:10,color:t.textMuted,marginBottom:2}}>{l}</div>
              <div style={{fontSize:11,fontWeight:700,color:c,fontFamily:"monospace"}}>{fmtAmt(fromKZT(v,selectedCurrency,exchangeRates),selectedCurrency)}</div>
            </div>
          ))}
        </div>

        {pieRangeData.slices.length>0?(
          <>
            <SimplePieChart data={pieRangeData.slices}/>
            <div style={{textAlign:"center",marginTop:-110,marginBottom:92,fontSize:18,fontWeight:700,color:t.text,fontFamily:"monospace",pointerEvents:"none"}}>
              {fmtAmt(fromKZT(pieRangeData.totalExp,selectedCurrency,exchangeRates),selectedCurrency)}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
              {pieRangeData.slices.map(d=>{
                const pct=pieRangeData.totalExp>0?((d.value/pieRangeData.totalExp)*100).toFixed(1):0;
                const bar=pieRangeData.totalExp>0?(d.value/pieRangeData.totalExp)*100:0;
                return(
                  <div key={d.name}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <div style={{width:10,height:10,borderRadius:2,background:d.color,flexShrink:0}}/>
                      <span style={{fontSize:13,color:t.text,flex:1}}>{d.icon} {d.name}</span>
                      <span style={{fontSize:12,color:t.textMuted}}>{pct}%</span>
                      <span style={{fontSize:13,fontWeight:600,color:t.text,fontFamily:"monospace"}}>{fmtAmt(fromKZT(d.value,selectedCurrency,exchangeRates),selectedCurrency)}</span>
                    </div>
                    <div style={{height:3,background:t.bgInput,borderRadius:2}}><div style={{height:"100%",width:`${bar}%`,background:d.color,borderRadius:2}}/></div>
                  </div>
                );
              })}
            </div>
          </>
        ):(
          <div style={{textAlign:"center",padding:"32px 16px",color:t.textMuted}}>
            <div style={{fontSize:32,marginBottom:8}}>📊</div>
            No expenses in this range
          </div>
        )}
      </div>

      {/* ─────── Calendar card with own month navigation ─────── */}
      <div style={{background:t.bgCard,borderRadius:16,padding:"16px",border:`1px solid ${t.border}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{fontSize:15,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif"}}>Daily Spending</div>
          <div style={{fontSize:12,color:t.textMuted,fontFamily:"monospace"}}>{fmtAmt(fromKZT(calMonthTotal,selectedCurrency,exchangeRates),selectedCurrency)}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,background:t.bgInput,borderRadius:10,padding:"6px 12px"}}>
          <button onClick={prevCalMonth} style={{background:"none",border:"none",color:t.accent,fontSize:18,cursor:"pointer",padding:"2px 6px"}}>‹</button>
          <span style={{fontSize:13,fontWeight:600,color:t.text}}>{MONTHS_FULL[calMonth]} {calYear}</span>
          <button onClick={nextCalMonth} style={{background:"none",border:"none",color:t.accent,fontSize:18,cursor:"pointer",padding:"2px 6px"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
          {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,color:t.textMuted,paddingBottom:4,fontWeight:600}}>{d}</div>)}
          {Array.from({length:new Date(calYear,calMonth,1).getDay()}).map((_,i)=><div key={"e"+i}/>)}
          {dayTotals.map(({day,amount})=>{
            const hasSpending=amount>0;
            const displayAmount=hasSpending?fromKZT(amount,selectedCurrency,exchangeRates):0;
            return(
              <div key={day} style={{
                aspectRatio:"1",
                display:"flex",
                flexDirection:"column",
                alignItems:"center",
                justifyContent:"center",
                background:hasSpending?"#ef444415":"transparent",
                borderRadius:6,
                border:`1px solid ${hasSpending?"#ef444444":t.border}`,
                padding:"2px"
              }}>
                <div style={{fontSize:11,fontWeight:600,color:hasSpending?t.text:t.textMuted,lineHeight:1}}>{day}</div>
                {hasSpending&&(
                  <div style={{fontSize:9,fontWeight:600,color:"#ef4444",fontFamily:"monospace",marginTop:2,lineHeight:1}}>
                    {fmtCompact(displayAmount)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

          </div>
          {/* ─── Pane 2: My Progress ─── */}
          <div style={{width:"50%",flexShrink:0,paddingLeft:8}}>

            {/* Period mode toggle: Weeks | Months */}
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              {[{k:"weeks",l:tr("Weeks",settings.uiLanguage)},{k:"months",l:tr("Months",settings.uiLanguage)}].map(m=>(
                <button key={m.k}
                  onClick={()=>setPeriodMode(m.k)}
                  style={{
                    flex:1,background:periodMode===m.k?"#10b981":t.bgCard2,
                    color:periodMode===m.k?"#fff":t.text,
                    border:`1px solid ${periodMode===m.k?"#10b981":t.border}`,
                    borderRadius:8,padding:"8px",fontSize:13,fontWeight:600,
                    cursor:"pointer",fontFamily:"system-ui,sans-serif"
                  }}>
                  {m.l}
                </button>
              ))}
            </div>

            {/* Period count chips */}
            <div style={{display:"flex",gap:6,marginBottom:14}}>
              {[2,3,6].map(n=>(
                <button key={n}
                  onClick={()=>setPeriodCount(n)}
                  style={{
                    flex:1,background:periodCount===n?t.bgCard:t.bgCard2,
                    color:periodCount===n?t.text:t.textMuted,
                    border:`1px solid ${periodCount===n?t.text:t.border}`,
                    borderRadius:8,padding:"6px",fontSize:12,fontWeight:600,
                    cursor:"pointer",fontFamily:"system-ui,sans-serif"
                  }}>
                  {n} {periodMode==="weeks"?tr("weeks",settings.uiLanguage):tr("months",settings.uiLanguage)}
                </button>
              ))}
            </div>

            {/* Empty state if not enough data */}
            {periodStats.every(p=>p.incomeKzt===0 && p.expenseKzt===0) && (
              <div style={{background:t.bgCard,borderRadius:14,padding:"32px 16px",textAlign:"center",border:`1px solid ${t.border}`}}>
                <div style={{fontSize:36,marginBottom:8}}>📊</div>
                <div style={{fontSize:14,color:t.textMuted,lineHeight:1.5}}>
                  {tr("Not enough data yet for this period range. Log some transactions and check back later!",settings.uiLanguage)}
                </div>
              </div>
            )}

            {/* Summary cards: Income, Expenses, Saved — only show if there's data */}
            {!periodStats.every(p=>p.incomeKzt===0 && p.expenseKzt===0) && (
              <>
                {[
                  {key:"income", label:tr("Income",settings.uiLanguage), color:"#10b981", icon:"💰", getValue:(p)=>p.incomeKzt, higherIsBetter:true},
                  {key:"expense", label:tr("Expenses",settings.uiLanguage), color:"#ef4444", icon:"💸", getValue:(p)=>p.expenseKzt, higherIsBetter:false},
                  {key:"saved", label:tr("Saved",settings.uiLanguage), color:"#3b82f6", icon:"💵", getValue:(p)=>p.savedKzt, higherIsBetter:true}
                ].map(metric=>{
                  const values = periodStats.map(p=>metric.getValue(p));
                  const maxAbs = Math.max(1, ...values.map(Math.abs));
                  const change = pctChange(values[0], values[values.length-1]);
                  // Color the % change green if it moved in the "good" direction for this metric
                  const changeColor = (change > 0) === metric.higherIsBetter ? "#10b981" : (change === 0 ? t.textMuted : "#ef4444");
                  const changeArrow = change > 0 ? "↑" : change < 0 ? "↓" : "→";
                  return(
                    <div key={metric.key} style={{background:t.bgCard,borderRadius:14,padding:"14px",border:`1px solid ${t.border}`,marginBottom:12}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                        <div style={{fontSize:13,color:t.text,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
                          <span>{metric.icon}</span>{metric.label}
                        </div>
                        {periodStats.length > 1 && (
                          <div style={{fontSize:12,fontWeight:700,color:changeColor,fontFamily:"monospace"}}>
                            {changeArrow} {Math.abs(change)}%
                          </div>
                        )}
                      </div>
                      {/* Bars row: one column per period */}
                      <div style={{display:"flex",gap:6,alignItems:"flex-end",height:80,marginBottom:8}}>
                        {periodStats.map((p,i)=>{
                          const v = metric.getValue(p);
                          const heightPct = (Math.abs(v) / maxAbs) * 100;
                          const isNegative = v < 0;
                          const barColor = metric.key === "saved" && isNegative ? "#ef4444" : metric.color;
                          return(
                            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
                              <div style={{width:"100%",height:`${Math.max(2,heightPct)}%`,background:barColor,borderRadius:"4px 4px 0 0",opacity:i===periodStats.length-1?1:0.55}}/>
                            </div>
                          );
                        })}
                      </div>
                      {/* Labels row */}
                      <div style={{display:"flex",gap:6,marginBottom:4}}>
                        {periodStats.map((p,i)=>(
                          <div key={i} style={{flex:1,fontSize:9,color:t.textMuted,textAlign:"center",fontFamily:"system-ui,sans-serif"}}>{p.label}</div>
                        ))}
                      </div>
                      {/* Values row */}
                      <div style={{display:"flex",gap:6}}>
                        {periodStats.map((p,i)=>{
                          const display = fromKZT(metric.getValue(p), selectedCurrency, exchangeRates);
                          return(
                            <div key={i} style={{flex:1,fontSize:11,color:t.text,textAlign:"center",fontFamily:"monospace",fontWeight:i===periodStats.length-1?700:400}}>
                              {fmtCompact(display)}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}

                {/* Per-category breakdown */}
                {topCategories.length > 0 && (
                  <div style={{background:t.bgCard,borderRadius:14,padding:"14px",border:`1px solid ${t.border}`,marginBottom:12}}>
                    <div style={{fontSize:13,fontWeight:600,color:t.text,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
                      📂 {tr("By category",settings.uiLanguage)}
                    </div>
                    {topCategories.map(cat=>{
                      const values = periodStats.map(p=>p.categoryKzt[cat.id] || 0);
                      const maxAbs = Math.max(1, ...values);
                      const change = pctChange(values[0], values[values.length-1]);
                      // For categories, "higher is bad" since it's expense
                      const changeColor = change > 0 ? "#ef4444" : change < 0 ? "#10b981" : t.textMuted;
                      const changeArrow = change > 0 ? "↑" : change < 0 ? "↓" : "→";
                      return(
                        <div key={cat.id} style={{marginBottom:14,paddingBottom:10,borderBottom:`1px solid ${t.border}`}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                            <div style={{fontSize:13,color:t.text,display:"flex",alignItems:"center",gap:6}}>
                              <span>{cat.icon}</span><span>{cat.name}</span>
                            </div>
                            {periodStats.length > 1 && (
                              <div style={{fontSize:11,fontWeight:700,color:changeColor,fontFamily:"monospace"}}>
                                {changeArrow} {Math.abs(change)}%
                              </div>
                            )}
                          </div>
                          {/* Horizontal bars per period */}
                          {periodStats.map((p,i)=>{
                            const v = p.categoryKzt[cat.id] || 0;
                            const widthPct = (v / maxAbs) * 100;
                            const display = fromKZT(v, selectedCurrency, exchangeRates);
                            return(
                              <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:3,fontSize:10}}>
                                <div style={{width:46,color:t.textMuted,fontFamily:"system-ui,sans-serif",fontSize:9,flexShrink:0}}>{p.label}</div>
                                <div style={{flex:1,height:14,background:t.bgInput,borderRadius:3,position:"relative",overflow:"hidden"}}>
                                  <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${Math.max(2,widthPct)}%`,background:"#ef4444",opacity:i===periodStats.length-1?0.9:0.55,borderRadius:3,transition:"width 0.3s ease"}}/>
                                </div>
                                <div style={{width:55,textAlign:"right",fontFamily:"monospace",color:t.text,fontSize:10,fontWeight:i===periodStats.length-1?700:400}}>{fmtCompact(display)}</div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Honest disclaimer */}
                <div style={{fontSize:10,color:t.textMuted,fontStyle:"italic",lineHeight:1.5,padding:"4px 8px"}}>
                  💡 {tr("Saved = income − expenses for the period. Amounts converted to your selected currency at today's exchange rates.",settings.uiLanguage)}
                </div>
              </>
            )}

          </div>
        </div>
      </div>

    </div>
  );
}

// ── HISTORY SCREEN ──
function HistoryScreen({transactions,accounts,categories,settings,onTxnClick,t}){
  const now=new Date();
  const[selYear,setSelYear]=useState(now.getFullYear());
  const[selMonth,setSelMonth]=useState(now.getMonth());
  const{selectedCurrency,exchangeRates}=settings;
  const prevMonth=()=>{if(selMonth===0){setSelYear(y=>y-1);setSelMonth(11);}else setSelMonth(m=>m-1);};
  const nextMonth=()=>{if(selMonth===11){setSelYear(y=>y+1);setSelMonth(0);}else setSelMonth(m=>m+1);};
  const monthTxns=transactions.filter(tx=>sameMonth(tx.date,selYear,selMonth)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const grouped=useMemo(()=>{
    const g={};
    monthTxns.forEach(txn=>{
      const d=new Date(txn.date);
      const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if(!g[key])g[key]={label:d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),txns:[],total:0};
      g[key].txns.push(txn);
      if(txn.type==="expense")g[key].total-=toKZT(txn.amount,txn.currency,exchangeRates);
      else if(txn.type==="income")g[key].total+=toKZT(txn.amount,txn.currency,exchangeRates);
    });
    return Object.values(g);
  },[monthTxns,exchangeRates]);

  return(
    <div style={{height:"100%",overflow:"auto",padding:"calc(env(safe-area-inset-top, 20px) + 40px) 16px 16px"}}>
      <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,fontWeight:700,color:t.text,marginBottom:16}}>{tr("History",settings.uiLanguage)}</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,background:t.bgCard,borderRadius:12,padding:"10px 16px",border:`1px solid ${t.border}`}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",color:t.accent,fontSize:22,cursor:"pointer",padding:"0 6px"}}>‹</button>
        <span style={{fontSize:16,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif"}}>{MONTHS_FULL[selMonth]} {selYear}</span>
        <button onClick={nextMonth} style={{background:"none",border:"none",color:t.accent,fontSize:22,cursor:"pointer",padding:"0 6px"}}>›</button>
      </div>
      {grouped.length===0&&(
        <div style={{textAlign:"center",padding:"48px 0",color:t.textMuted}}>
          <div style={{fontSize:36,marginBottom:8}}>📭</div>
          <div style={{fontSize:15}}>No transactions this month</div>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {grouped.map((g,gi)=>(
          <div key={gi}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:13,fontWeight:600,color:t.textMuted}}>{g.label}</span>
              <span style={{fontSize:13,fontWeight:600,color:g.total>=0?"#10b981":"#ef4444",fontFamily:"monospace"}}>{g.total>=0?"+":""}{fmtAmt(fromKZT(g.total,selectedCurrency,exchangeRates),selectedCurrency)}</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {g.txns.map(txn=>{
                const acc=accounts.find(a=>a.id===txn.accountId);
                const toAcc=accounts.find(a=>a.id===txn.toAccountId);
                const cat=categories.find(c=>c.id===txn.categoryId);
                const sub=cat?.subcategories?.find(s=>s.id===txn.subcategoryId);
                const color=txn.type==="expense"?"#ef4444":txn.type==="income"?"#10b981":"#3b82f6";
                const sign=txn.type==="expense"?"-":txn.type==="income"?"+":"";
                const isTransfer=txn.type==="transfer";
                const showBothAmounts=isTransfer&&txn.toAmount!=null&&txn.toCurrency&&txn.toCurrency!==txn.currency;
                return(
                  <div key={txn.id} onClick={()=>onTxnClick(txn)} style={{background:t.bgCard,borderRadius:12,padding:"12px 14px",border:`1px solid ${t.border}`,cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                        <div style={{width:34,height:34,borderRadius:9,background:(isTransfer?"#3b82f6":(cat?.color||"#64748b"))+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{isTransfer?"⇄":cat?.icon||"💸"}</div>
                        <div style={{minWidth:0,flex:1}}>
                          <div style={{fontSize:14,fontWeight:500,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                            {isTransfer?(
                              <span>{acc?.name||"?"} <span style={{color:t.textMuted}}>→</span> {toAcc?.name||"?"}</span>
                            ):(sub?sub.name:cat?.name)||"Unknown"}
                          </div>
                          <div style={{fontSize:11,color:t.textMuted}}>{fmtTime(txn.date)}{!isTransfer?` · ${acc?.name}`:""}{txn.note?` · ${txn.note.slice(0,22)}${txn.note.length>22?"…":""}`:""}</div>
                        </div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:15,fontWeight:700,color,fontFamily:"monospace"}}>{sign}{fmtAmt(txn.amount,txn.currency)}</div>
                        {showBothAmounts&&(
                          <div style={{fontSize:11,color:t.textMuted,fontFamily:"monospace",marginTop:2}}>→ +{fmtAmt(txn.toAmount,txn.toCurrency)}</div>
                        )}
                      </div>
                    </div>
                    {txn.aiComment&&<PetCommentBlock comment={txn.aiComment} petEmoji={(PETS[settings.aiPet]||PETS.dog).emoji} t={t}/>}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── SETTINGS SCREEN ──

  const[newGoalAmount,setNewGoalAmount]=useState("");
