<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<title>Pet preview — Saqta</title>
<style>
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #0a0f1e;
  color: #e2e8f0;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
.section-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

.balance-card {
  background: #111827;
  border: 1px solid #1e2d3d;
  border-radius: 18px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: center;
  width: 360px;
}
.pet-slot {
  width: 90px;
  height: 90px;
  flex-shrink: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.balance-info { flex: 1; min-width: 0; }
.balance-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
.balance-amount { font-size: 22px; font-weight: 600; color: #fff; font-family: ui-monospace, monospace; }
.balance-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding-top: 8px; margin-top: 8px; border-top: 1px solid #1e2d3d; }
.stat { }
.stat-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
.stat-val { font-size: 11px; font-family: ui-monospace, monospace; }
.in { color: #5dcaa5; }
.out { color: #f87171; }
.save { color: #fbbf24; }

.solo-frame {
  background: #0a0f1e;
  border: 1px dashed #1e2d3d;
  border-radius: 14px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 360px;
}
.solo-pet { width: 160px; height: 160px; position: relative; }

/* The dollar overlay around the cat — 3 dollars orbiting like the original hearts.
   Each plays for 2s (60 frames) staggered by 2s, total 6s loop matching the lottie. */
.dollar-orbit {
  position: absolute;
  font-size: 20px;
  color: #fbbf24;
  text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  font-family: -apple-system, system-ui, sans-serif;
}
.solo-pet .dollar-orbit { font-size: 26px; }

/* These keyframes mimic the original heart motion: rise from below the head, drift up, fade out.
   The hearts in the original spawn near the head and float up + sideways. */
@keyframes dollarOrbit1 {
  0%   { opacity: 0; transform: translate(0, 10px) scale(0.6); }
  10%  { opacity: 1; }
  60%  { transform: translate(20px, -40px) scale(1.05); opacity: 0.95; }
  100% { transform: translate(35px, -65px) scale(0.9); opacity: 0; }
}
@keyframes dollarOrbit2 {
  0%   { opacity: 0; transform: translate(0, 10px) scale(0.6); }
  10%  { opacity: 1; }
  60%  { transform: translate(-15px, -45px) scale(1.05); opacity: 0.95; }
  100% { transform: translate(-30px, -70px) scale(0.9); opacity: 0; }
}
@keyframes dollarOrbit3 {
  0%   { opacity: 0; transform: translate(0, 10px) scale(0.6); }
  10%  { opacity: 1; }
  60%  { transform: translate(8px, -50px) scale(1.05); opacity: 0.95; }
  100% { transform: translate(12px, -75px) scale(0.9); opacity: 0; }
}

.d1 { animation: dollarOrbit1 6s ease-out infinite; animation-delay: 0s; right: 8px; top: 8px; }
.d2 { animation: dollarOrbit2 6s ease-out infinite; animation-delay: 2s; right: 20px; top: 20px; }
.d3 { animation: dollarOrbit3 6s ease-out infinite; animation-delay: 4s; right: 14px; top: 12px; }
</style>
</head>
