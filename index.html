<script>
// Global error handler — displays any uncaught JavaScript error directly on the splash
// so the user can see what's wrong instead of staring at an infinite spinner.
window.addEventListener("error",function(ev){
  var errEl=document.getElementById("splash-err");
  if(errEl){
    var msg=ev.message||"Unknown error";
    var src=(ev.filename||"").split("/").pop();
    errEl.innerHTML+="<div style='margin-bottom:8px'>❌ "+msg+(ev.lineno?" (line "+ev.lineno+")":"")+(src?" in "+src:"")+"</div>";
  }
});
window.addEventListener("unhandledrejection",function(ev){
  var errEl=document.getElementById("splash-err");
  if(errEl){
    errEl.innerHTML+="<div style='margin-bottom:8px'>⚠️ Promise error: "+(ev.reason?.message||String(ev.reason))+"</div>";
  }
});
// Emergency timeout — if the app hasn't started after 10 seconds, show reload button
setTimeout(function(){
  var splash=document.getElementById("splash");
  if(splash&&!splash.classList.contains("hidden")){
    var msg=document.getElementById("splash-msg");
    if(msg){
      msg.innerHTML="Taking longer than expected...<br><a href='javascript:location.reload()' style='color:#10b981;text-decoration:underline'>Tap to reload</a>";
    }
  }
},10000);
</script>

// ── CUSTOM PIE CHART ──
// A lightweight SVG donut chart — no external chart library needed.
// More reliable than CDN-loaded chart libraries in Telegram's WebView.
function SimplePieChart({data,size=180,innerR=52,outerR=82}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return null;
  const cx=size/2,cy=size/2;
  let cum=-Math.PI/2; // start at 12 o'clock
  const slices=data.map((d,i)=>{
    const a=(d.value/total)*Math.PI*2;
    const s0=cum,s1=cum+a;
    cum=s1;
    const x1=cx+outerR*Math.cos(s0),y1=cy+outerR*Math.sin(s0);
    const x2=cx+outerR*Math.cos(s1),y2=cy+outerR*Math.sin(s1);
    const x3=cx+innerR*Math.cos(s1),y3=cy+innerR*Math.sin(s1);
    const x4=cx+innerR*Math.cos(s0),y4=cy+innerR*Math.sin(s0);
    const large=a>Math.PI?1:0;
    // Handle the edge case of a single 100% slice which would collapse the path
    const path=a>=Math.PI*2-0.001
      ?`M ${cx-outerR} ${cy} A ${outerR} ${outerR} 0 1 1 ${cx+outerR} ${cy} A ${outerR} ${outerR} 0 1 1 ${cx-outerR} ${cy} M ${cx-innerR} ${cy} A ${innerR} ${innerR} 0 1 0 ${cx+innerR} ${cy} A ${innerR} ${innerR} 0 1 0 ${cx-innerR} ${cy} Z`
      :`M ${x1} ${y1} A ${outerR} ${outerR} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 ${large} 0 ${x4} ${y4} Z`;
    return{path,color:d.color,name:d.name};
  });
  return(
    <svg width="100%" height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",margin:"0 auto",maxWidth:size}}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="rgba(0,0,0,0.15)" strokeWidth="1"/>)}
    </svg>
  );
}

// ── ANALYTICS TRACKING ──
// Sends anonymous events to the Cloudflare Worker for the admin dashboard.
// Only sends behavioral events (app opens, transactions created — count only, no amounts).
// Each browser tab gets a unique session_id so we can compute session lengths.
const WORKER_URL="https://finance-tracker-proxy.life-bekzat.workers.dev";
const TRACK_URL=WORKER_URL+"/track";
const SESSION_ID=Math.random().toString(36).slice(2,12)+"-"+Date.now().toString(36);

const track=(event_type,metadata={})=>{
  // Only track if we have a Telegram user (skip standalone web visitors)
  const u=tg?.initDataUnsafe?.user;
  if(!u?.id)return;

  // Read latest settings from localStorage (synchronous, fast — runs once per event)
  let s={};
  try{s=JSON.parse(localStorage.getItem("ft_settings")||"{}");}catch{}

  const platform=tg?.platform||"unknown"; // "ios" | "android" | "tdesktop" | "weba" | "webk" | etc.

  const payload={
    tg_id:u.id,
    username:u.username||null,
    first_name:u.first_name||null,
    language_code:u.language_code||null,
    ui_language:s.uiLanguage||null,
    ai_language:s.aiLanguage||null,
    ai_pet:s.aiPet||null,
    ai_tone:s.aiTone||null,
    platform,
    // Reminders preference — default ON if not set yet, so new users get reminders
    reminders_enabled:s.remindersEnabled!==false,
    session_id:SESSION_ID,
    event_type,
    metadata
  };
  // Fire-and-forget — never block the UI on telemetry
  try{
    fetch(TRACK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload),
      keepalive:true // lets the request survive page unload
    }).catch(()=>{});
  }catch{}
};

// ── STORAGE ──
// Telegram CloudStorage syncs data across devices for the same Telegram user.
// Falls back to localStorage if not running inside Telegram.
const CS = window.Telegram?.WebApp?.CloudStorage;
const CS_AVAILABLE = !!(CS && typeof CS.setItem === "function");

const LS={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  remove:(k)=>{try{localStorage.removeItem(k);}catch{}}
};

// Promise wrappers for Telegram CloudStorage callback API.
// Each call has a hard 2.5s timeout — if CloudStorage silently hangs
// (which can happen in certain Telegram contexts), the wrapper resolves
// to a safe fallback value and the app continues via localStorage.
const CS_TIMEOUT=2500;
const withTimeout=(fn,fallback)=>new Promise((resolve)=>{
  let done=false;
  const finish=(v)=>{if(!done){done=true;resolve(v);}};
  setTimeout(()=>finish(fallback),CS_TIMEOUT);
  try{fn(finish);}catch{finish(fallback);}
});

const csGetItem=(key)=>withTimeout(
  (done)=>CS.getItem(key,(err,val)=>done(err?null:val)),
  null
);
const csGetItems=(keys)=>withTimeout(
  (done)=>CS.getItems(keys,(err,vals)=>done(err?{}:(vals||{}))),
  {}
);
const csSetItem=(key,val)=>withTimeout(
  (done)=>CS.setItem(key,val,(err)=>done(!err)),
  false
);
const csRemoveItem=(key)=>withTimeout(
  (done)=>CS.removeItem(key,(err)=>done(!err)),
  false
);
const csGetKeys=()=>withTimeout(
  (done)=>CS.getKeys((err,keys)=>done(err?[]:(keys||[]))),
  []
);

// High-level storage: writes to both CloudStorage (if available) and localStorage.
// Reads prefer CloudStorage, falling back to localStorage.
const STORE={
  async get(key,def){
    if(CS_AVAILABLE){
      const val=await csGetItem(key);
      if(val){try{return JSON.parse(val);}catch{}}
    }
    return LS.get(key,def);
  },
  async set(key,value){
    LS.set(key,value);
    if(CS_AVAILABLE){
      const str=JSON.stringify(value);
      // CloudStorage has a 4096 char limit per value. Small items fit fine.
      if(str.length<=4096)await csSetItem(key,str);
    }
  },
  async remove(key){
    LS.remove(key);
    if(CS_AVAILABLE)await csRemoveItem(key);
  },
  // Transactions are stored individually as ft_txn_{id} because the array
  // can grow beyond the 4096 char per-value limit.
  async getAllTransactions(){
    if(CS_AVAILABLE){
      const keys=await csGetKeys();
      const txnKeys=keys.filter(k=>k.startsWith("ft_txn_"));
      if(txnKeys.length>0){
        const items=await csGetItems(txnKeys);
        return Object.values(items).map(v=>{try{return JSON.parse(v);}catch{return null;}}).filter(Boolean);
      }
    }
    return LS.get("ft_transactions",[]);
  },
  async saveTransaction(txn){
    const allLocal=LS.get("ft_transactions",[]);
    const filtered=allLocal.filter(t=>t.id!==txn.id);
    LS.set("ft_transactions",[...filtered,txn]);
    if(CS_AVAILABLE)await csSetItem(`ft_txn_${txn.id}`,JSON.stringify(txn));
  },
  async deleteTransaction(id){
    const allLocal=LS.get("ft_transactions",[]);
    LS.set("ft_transactions",allLocal.filter(t=>t.id!==id));
    if(CS_AVAILABLE)await csRemoveItem(`ft_txn_${id}`);
  }
};

// ── LIVE EXCHANGE RATES ──
// Fetches real-time rates from free public APIs. No API key required.
// - Fiat (USD, EUR): exchangerate-api (open access, no key)
// - Crypto (BTC, ETH, USDT): CoinGecko public API
// Returns an object like {KZT:1, USD:520, EUR:560, USDT:520, BTC:35000000, ETH:1750000}
// Each value = how many KZT equals 1 unit of that currency.
const fetchLiveRates=async()=>{
  const rates={KZT:1};
  try{
    // Fiat rates (USD, EUR) — converts from USD base, then cross-rates via USD→KZT
    const fiatRes=await fetch("https://open.er-api.com/v6/latest/USD");
    const fiatData=await fiatRes.json();
    if(fiatData?.rates?.KZT){
      const usdToKzt=fiatData.rates.KZT;
      rates.USD=usdToKzt;
      rates.EUR=fiatData.rates.EUR?usdToKzt/fiatData.rates.EUR:560;
      rates.USDT=usdToKzt; // USDT tracks USD 1:1
    }
  }catch(e){console.warn("Fiat rate fetch failed:",e);}

  try{
    // Crypto rates from CoinGecko — returns prices in USD, we convert to KZT
    const cryptoRes=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd");
    const cryptoData=await cryptoRes.json();
    const usdKzt=rates.USD||520;
    if(cryptoData?.bitcoin?.usd)rates.BTC=cryptoData.bitcoin.usd*usdKzt;
    if(cryptoData?.ethereum?.usd)rates.ETH=cryptoData.ethereum.usd*usdKzt;
    if(cryptoData?.tether?.usd)rates.USDT=cryptoData.tether.usd*usdKzt;
  }catch(e){console.warn("Crypto rate fetch failed:",e);}

  return rates;
};

const getAIComment=async(type,amount,currency,category,subcategory,note,settings)=>{
  if(!settings.aiEnabled)return null;
  const toneMap={
    soft:"gentle, warm, and encouraging — like a supportive friend cheering them on. Focus on positives even when the spending was questionable. Never make them feel bad",
    medium:"direct and lightly humorous — give an honest take with relatable comparisons. Comment on whether the purchase makes sense without being mean about it",
    harsh:"blunt, sarcastic, and brutally honest — call out wasteful spending directly. Be witty but cutting. Don't sugarcoat. Make them think twice next time",
    explicit:"completely uncensored, profane, and savage — use heavy profanity freely (fuck, shit, damn, hell, ass, dumbass, etc). Roast their spending choice HARD with creative, cutting insults specifically about the purchase decision. Be the friend who tells them their financial choices are stupid in the bluntest, funniest way possible. Mock the specific item, the amount, the timing — get creative and brutal. The goal is to make them laugh AND seriously reconsider next time. Stay focused on the SPENDING DECISION — never attack them as a person, their appearance, their relationships, or anything personal. Money choices only. Make it sting in a way that's funny enough to share."
  };
  const tone=toneMap[settings.aiTone]||toneMap.medium;
  const customExtra=settings.aiCustomPrompt?` ${settings.aiCustomPrompt}`:"";
  const lang=settings.aiLanguage||"English";
  const pet=PETS[settings.aiPet]||PETS.dog;

  const actionDesc=type==="income"
    ?`just received ${fmtFull(amount,currency)} as income from ${subcategory||category||"unspecified source"}`
    :`just spent ${fmtFull(amount,currency)} on ${subcategory||category||"something"}`;

  // Real price reference points for Kazakhstan (Astana/Almaty, 2026) so the AI can make
  // accurate, relatable comparisons. Without these, the model defaults to US prices and
  // says nonsense like "1000 KZT = 2 weeks of groceries". Anchored in KZT, with USD/USDT
  // rough equivalents the AI can derive from at ~520 KZT/USD.
  const kzPriceContext=`PRICE REFERENCE POINTS for Kazakhstan (use these for accurate comparisons):
- Coffee at a cafe: 1,500-2,500 KZT
- Bottle of water/soda: 200-500 KZT
- Bus/metro ride: 100-200 KZT
- Quick takeaway lunch (kebab, plov, samsa): 1,500-3,000 KZT
- Restaurant dinner for one: 5,000-10,000 KZT
- Fancy restaurant dinner for one: 15,000-30,000 KZT
- Weekly groceries for one person: 25,000-40,000 KZT
- Monthly groceries for one person: 100,000-150,000 KZT
- Movie ticket: 2,500-4,000 KZT
- Gym membership/month: 15,000-30,000 KZT
- Apartment rent (1-bedroom, Astana): 200,000-350,000 KZT/month
- Average monthly salary: 350,000-500,000 KZT
- Taxi across city: 1,500-3,000 KZT
- iPhone (latest): 700,000-900,000 KZT
- Domestic flight: 30,000-60,000 KZT
- Tank of gas: 15,000-25,000 KZT
For USD/USDT: roughly divide KZT amounts by 520 (so $1 ≈ 520 KZT).
Use ONLY benchmarks that fit naturally — don't list multiple comparisons.`;

  // Add stronger language guidance for Kazakh — the model needs explicit instructions
  // to produce natural Kazakh rather than awkward word-for-word translations
  const langGuidance=lang==="Kazakh"
    ? `Respond in Kazakh (қазақ тілі). Use natural, native-sounding Kazakh — proper grammar, correct verb endings, and idiomatic phrasing. Avoid Russian loanwords when a clear Kazakh equivalent exists. Use the colloquial register (informal "сен" form) since this is a personal pet companion. Keep currency names in their natural Kazakh forms (теңге, доллар).`
    : `Respond in ${lang}.`;

  const systemPrompt=`${pet.persona} You live in their budgeting app and comment briefly on their financial actions. Tone style: ${tone}.

${kzPriceContext}

When making "that's X cups of coffee" type comparisons, use the price points above and ROUND sensibly. For small amounts (under 500 KZT), don't compare to groceries or rent — pick something that actually costs that much (a soda, a bus ride). Match the comparison to the actual size of the expense.${customExtra}

Keep it to 1-2 sentences MAX. ${langGuidance} No preamble, no emoji overload (pet emojis are added by the app separately), just the comment directly in character.`;

  const userMsg=`I ${actionDesc}. My note: "${note||"no note"}". Give me your quick take.`;

  try{
    // Calls are routed through a Cloudflare Worker which holds the Anthropic API key
    // as an encrypted secret, keeping it out of this public repo.
    // Model selection: Kazakh is underrepresented in LLM training data and benefits
    // significantly from Sonnet's stronger multilingual abilities. English/Russian
    // work well on Haiku 4.5 (~5x cheaper), so we only use Sonnet when needed.
    // Note: model IDs change as Anthropic releases new versions — currently on Sonnet 4.6.
    const model=lang==="Kazakh"?"claude-sonnet-4-6":"claude-haiku-4-5-20251001";
    const res=await fetch("https://finance-tracker-proxy.life-bekzat.workers.dev",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:model,
        max_tokens:120,
        system:systemPrompt,
        messages:[{role:"user",content:userMsg}]
      })
    });
    const d=await res.json();
    // If the API returned an error, surface it in the comment so the user can diagnose
    if(d.error){
      console.error("API error:",d.error);
      track("ai_error",{message:(d.error.message||d.error.type||"unknown").slice(0,200)});
      return `(Error: ${d.error.message||d.error.type||"AI unavailable"})`;
    }
    return d.content?.[0]?.text||null;
  }catch(e){
    console.error("AI error:",e);
    return null;
  }
};

    "In Settings → Categories, tap any expense category to expand it and enter a monthly budget. The Home screen shows a 'Budget Pulse' card that flags categories near or over budget. Budgets are soft targets — they help you stay aware, not punish you. The coloring is pace-aware: at 60% through the month with 65% spent, you're fine. At 30% through with 65% spent, you're warned.":"В Настройки → Категории нажмите на любую категорию расходов, чтобы раскрыть её и ввести месячный бюджет. На главной появится карточка «Бюджеты», которая отмечает категории близко к лимиту или с перерасходом. Бюджеты — мягкие цели: они помогают осознавать траты, а не наказывают. Цвет учитывает темп: если на 60% месяца потрачено 65% — всё нормально. Если на 30% месяца уже 65% — это предупреждение.",
    "What does the AI Pet Coach do?":"Что делает ИИ-питомец?",
    "After you log income or expense transactions, your chosen pet (dog or cat) writes a short comment about it — encouraging, judgmental, or harsh, depending on the tone you picked in Settings. It's powered by Anthropic's Claude AI. You can disable it anytime in Settings.":"После записи дохода или расхода ваш питомец (собака или кот) пишет короткий комментарий — поддерживающий, осуждающий или жёсткий, в зависимости от тона, выбранного в настройках. Работает на ИИ Claude от Anthropic. Можно отключить в любой момент в настройках.",
    "How are reminders sent?":"Как отправляются напоминания?",
    "If reminders are enabled, the bot sends you one short message per day (~8 PM local time) if you haven't been active in the last 12 hours. It's a different message every day, in your chosen language, with your pet's personality.":"Если напоминания включены, бот отправляет одно короткое сообщение в день (около 20:00 по местному времени), если вы не были активны последние 12 часов. Каждый день — новое сообщение, на выбранном языке, с характером вашего питомца.",
    "Can I edit a transaction after creating it?":"Можно ли редактировать транзакцию после создания?",
    "Currently you can only delete a transaction and create a new one. This was a deliberate design choice to avoid subtle balance bugs. We may add full editing later if there's demand.":"Сейчас можно только удалить транзакцию и создать новую. Это сделано специально, чтобы избежать незаметных багов с балансами. Возможно, позже добавим полное редактирование, если будет спрос.",
    "How do I add a new bank or crypto wallet?":"Как добавить новый банк или крипто-кошелёк?",
    "Go to Settings → Accounts and tap the + button. You can pick from common Kazakh banks (Freedom, Kaspi, Halyk, etc.) and crypto exchanges (Binance, Bybit, Redot, etc.) or add custom ones.":"Зайдите в Настройки → Счета и нажмите кнопку +. Можно выбрать популярные банки Казахстана (Freedom, Kaspi, Halyk и др.) и крипто-биржи (Binance, Bybit, Redot и др.) или добавить свои.",
    "What if I want to see specific dates of transactions?":"Что если я хочу видеть конкретные даты транзакций?",
    "Go to the Analytics tab → 'Overview' for a calendar heatmap showing your spending by day, or 'My Progress' to compare different time periods (weeks/months). The History tab shows all transactions grouped by date.":"Перейдите во вкладку Аналитика → «Обзор», чтобы увидеть календарь с расходами по дням, или «Мой прогресс», чтобы сравнить разные периоды (недели/месяцы). Вкладка История показывает все транзакции, сгруппированные по датам.",
    "Can I use this app outside Telegram?":"Можно ли пользоваться приложением вне Telegram?",
    "Currently no — the app is built as a Telegram Mini App and uses Telegram CloudStorage for your data. A standalone web/PWA version may come later if there's enough interest.":"Пока нет — приложение сделано как Telegram Mini App и хранит данные в Telegram CloudStorage. Отдельная веб/PWA-версия может появиться позже, если будет достаточный интерес.",
    "How do I export my data?":"Как экспортировать мои данные?",
    "Go to Settings → scroll to 'Download CSV'. You'll get a file with all your transactions and current account balances that opens in Excel, Numbers, or Google Sheets.":"Зайдите в Настройки → пролистайте до «Скачать CSV». Получите файл со всеми транзакциями и текущими балансами счетов; открывается в Excel, Numbers или Google Sheets.",
    "What if I lose my phone?":"Что если я потеряю телефон?",
    "Your data is in Telegram CloudStorage, not on your phone. Just install Telegram on your new device, log into the same account, open the bot, and everything will sync.":"Ваши данные хранятся в Telegram CloudStorage, а не на телефоне. Просто установите Telegram на новом устройстве, войдите в тот же аккаунт, откройте бота — всё синхронизируется.",
    "How can I delete all my data?":"Как удалить все мои данные?",
    "Settings → scroll to the bottom → 🗑️ Reset All Data. This wipes everything from your Telegram CloudStorage and the device. It cannot be undone.":"Настройки → в самом низу → 🗑️ Сбросить все данные. Это удалит всё из Telegram CloudStorage и с устройства. Действие необратимо.",
    "Is this app free?":"Приложение бесплатное?",

    // FAQ — questions and answers (Kazakh)
    "Where is my data stored?":"Менің деректерім қайда сақталады?",
    "Your data is stored privately in Telegram CloudStorage, tied to your Telegram account. It's not visible to anyone else, including the app developer. It syncs automatically across devices when you log in with the same Telegram account.":"Деректер Telegram CloudStorage-те, сіздің Telegram аккаунтыңызға байланған түрде сақталады. Оларды басқа ешкім, оның ішінде қолданба әзірлеушісі де көрмейді. Сол Telegram аккаунтымен кірген кезде құрылғылар арасында автоматты түрде синхрондалады.",
    "Is my financial data shared with anyone?":"Қаржылық деректерім біреумен бөлісіле ме?",
    "No. Transaction amounts, account balances, and notes never leave your Telegram CloudStorage. The app only sends anonymous usage statistics (e.g., which features you use, what language you picked) to help improve the app — never your actual financial data.":"Жоқ. Транзакция сомалары, шот баланстары мен жазбалар Telegram CloudStorage-тен ешқашан шықпайды. Қолданба тек анонимді қолдану статистикасын (мысалы, қандай функцияларды қолданасыз, қандай тілді таңдадыңыз) қолданбаны жақсарту үшін жібереді — ешқашан нақты қаржылық деректерді емес.",
    "How do exchange rates work?":"Айырбас бағамдары қалай жұмыс істейді?",
    "Exchange rates update automatically once per hour from open public APIs (open.er-api.com for fiat, CoinGecko for crypto). When you create a transaction in a different currency, it's converted to KZT using the current rate. You can also manually edit rates in Settings → Exchange Rates if you want to lock specific values.":"Бағамдар сағат сайын ашық API арқылы автоматты түрде жаңарып отырады (фиат үшін open.er-api.com, крипто үшін CoinGecko). Басқа валютада транзакция жасағанда, ол ағымдағы бағаммен теңгеге аударылады. Қаласаңыз, нақты мәндерді бекіту үшін Параметрлер → Айырбас бағамдары бөлімінде бағамдарды қолмен өзгертуге болады.",
    "What's the difference between income and a transfer?":"Кіріс пен аударымның айырмашылығы неде?",
    "Income is new money entering your accounts (salary, freelance, gifts). Transfers are moving money between your own accounts (e.g., Freedom Bank → Kaspi) — they don't change your total balance. The Home stats only count income/expenses, not transfers.":"Кіріс — шоттарыңызға жаңадан түсетін ақша (жалақы, фриланс, сыйлықтар). Аударым — өз шоттарыңыздың арасында ақша қозғалысы (мыс. Freedom Bank → Kaspi); ол жалпы балансты өзгертпейді. Басты беттегі статистика тек кіріс/шығысты есепке алады, аударымдарды емес.",
    "How do Savings Goals work?":"Жинақтау мақсаттары қалай жұмыс істейді?",

const tr=(key,lang)=>(TRANSLATIONS[lang||"English"]||{})[key]||key;

// Detect the user's system language and map to one of our supported UI languages.
// Priority: Telegram WebApp language → browser language → English fallback.
// Maps any "ru-*" code to Russian, "kk-*" to Kazakh, everything else → English.
const detectSystemLanguage=()=>{
  try{
    const tgLang=window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code;
    const browserLang=navigator.language||navigator.userLanguage||"";
    const code=(tgLang||browserLang||"").toLowerCase();
    if(code.startsWith("ru"))return"Russian";
    if(code.startsWith("kk")||code.startsWith("kz"))return"Kazakh";
    return"English";
  }catch(e){return"English";}
};

function AddModal({open,onClose,accounts,categories,settings,onSave,t,initMode}){
  const[mode,setMode]=useState(initMode||"expense");
  const[amount,setAmount]=useState("");
  const[accountId,setAccountId]=useState(accounts[0]?.id||"");
  const[toAccountId,setToAccountId]=useState(accounts[1]?.id||"");
  const[currency,setCurrency]=useState("KZT");
  const[categoryId,setCategoryId]=useState("");
  const[subcategoryId,setSubcategoryId]=useState("");
  const[note,setNote]=useState("");
  const[date,setDate]=useState(new Date().toISOString().split("T")[0]);
  const[time,setTime]=useState(()=>{
    const d=new Date();
    return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  });
  const[customRate,setCustomRate]=useState(null);
  const[loading,setLoading]=useState(false);

  const selAcc=accounts.find(a=>a.id===accountId);
  const availableCurrencies=selAcc?getAccountCurrencies(selAcc.type):["KZT"];

  // When the From account changes, if the chosen currency isn't valid for that account type, reset to the account's default
  useEffect(()=>{
    if(selAcc&&!availableCurrencies.includes(currency)){
      setCurrency(selAcc.currency||availableCurrencies[0]);
    }
  },[accountId]);

  // CRITICAL FIX: When the From account changes, ensure the To account is different.
  // Without this, the To dropdown filters out the new From account but the underlying
  // toAccountId state can still point to it, causing "transfer to same account" bugs.
  useEffect(()=>{
    if(toAccountId===accountId||!accounts.find(a=>a.id===toAccountId)){
      const firstOther=accounts.find(a=>a.id!==accountId);
      if(firstOther)setToAccountId(firstOther.id);
    }
    // Reset custom rate when accounts change so live rate is used by default
    setCustomRate(null);
  },[accountId,accounts]);

  useEffect(()=>{
    if(open){
      setMode(initMode||"expense");
      setAmount("");setNote("");setCategoryId("");setSubcategoryId("");
      setCustomRate(null);
      // Reset date and time to "now" each time the modal opens
      const now=new Date();
      setDate(now.toISOString().split("T")[0]);
      setTime(`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`);
      // Default currency = selected account's native currency
      const acc=accounts.find(a=>a.id===accountId);
      if(acc)setCurrency(acc.currency);
    }
  },[open,initMode]);

  const selCat=categories.find(c=>c.id===categoryId);
  const filteredCategories=categories.filter(c=>categoryMatchesMode(c,mode));
  const handleModeChange=(newMode)=>{
    setMode(newMode);
    setCategoryId("");
    setSubcategoryId("");
  };

  // For transfers: compute how much the destination account will receive.
  // Default uses the live exchange rate, but customRate (if set) overrides it.
  // The rate represents "1 source-currency unit = X destination-currency units".
  const toAcc=accounts.find(a=>a.id===toAccountId);
  const autoRate=useMemo(()=>{
    if(!selAcc||!toAcc)return 1;
    if(selAcc.currency===toAcc.currency)return 1;
    const rates=settings.exchangeRates||{};
    // Cross-rate via KZT: 1 source = X KZT = X / dest_rate destination units
    return(rates[selAcc.currency]||1)/(rates[toAcc.currency]||1);
  },[selAcc,toAcc,settings.exchangeRates]);
  const effectiveRate=customRate!=null?+customRate:autoRate;
  const transferConverted=useMemo(()=>{
    if(mode!=="transfer"||!selAcc||!toAcc||!amount||isNaN(+amount))return null;
    return{amount:(+amount)*effectiveRate,currency:toAcc.currency};
  },[mode,selAcc,toAcc,amount,effectiveRate]);

  const handleSave=async()=>{
    if(!amount||isNaN(+amount)||+amount<=0)return;
    // Safety check: prevent transfer to the same account (would otherwise lose money on screen)
    if(mode==="transfer"&&accountId===toAccountId){
      alert("Source and destination accounts must be different.");
      return;
    }
    haptic();
    const acc=accounts.find(a=>a.id===accountId);
    // For non-transfers, use the selected transaction currency.
    // For transfers, we record the outgoing amount in the source account's currency
    // and handle the destination conversion via toAmount/toCurrency.
    const txnCurrency=mode==="transfer"?(acc?.currency||"KZT"):currency;
    const txn={
      id:uid(),type:mode,amount:+amount,currency:txnCurrency,
      accountId,toAccountId:mode==="transfer"?toAccountId:null,
      categoryId:categoryId||null,subcategoryId:subcategoryId||null,
      note,date:new Date(`${date}T${time||"00:00"}`).toISOString(),aiComment:null,
      // For transfers, store the converted destination amount AND the rate used,
      // so the same conversion is reversed exactly when the transaction is deleted.
      toAmount:mode==="transfer"&&transferConverted?transferConverted.amount:null,
      toCurrency:mode==="transfer"&&transferConverted?transferConverted.currency:null,
      transferRate:mode==="transfer"?effectiveRate:null
    };
    if((mode==="expense"||mode==="income")&&settings.aiEnabled){
      setLoading(true);
      const cat=categories.find(c=>c.id===categoryId);
      const sub=cat?.subcategories?.find(s=>s.id===subcategoryId);
      const comment=await getAIComment(mode,+amount,txnCurrency,cat?.name||"",sub?.name||"",note,settings);
      txn.aiComment=comment;
      setLoading(false);
    }
    onSave(txn);
    // Track count only — never amount, account name, category name, or note content
    track("txn_create",{type:mode,currency:txnCurrency,has_note:!!note});
    if((mode==="expense"||mode==="income")&&settings.aiEnabled){
      track("ai_request",{language:settings.aiLanguage,pet:settings.aiPet,tone:settings.aiTone});
    }
    onClose();
  };

  const modes=[{k:"expense",l:tr("Expense",settings.uiLanguage),c:"#ef4444"},{k:"income",l:tr("Income",settings.uiLanguage),c:"#10b981"},{k:"transfer",l:tr("Transfer",settings.uiLanguage),c:"#3b82f6"}];

  return(
    <Modal open={open} onClose={onClose} title={tr("Add Transaction",settings.uiLanguage)} t={t}>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {modes.map(({k,l,c})=>(
          <button key={k} onClick={()=>handleModeChange(k)} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1.5px solid ${k===mode?c:t.border}`,background:k===mode?c+"22":"transparent",color:k===mode?c:t.textMuted,fontWeight:500,fontSize:13,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>{l}</button>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div>
          <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Amount",settings.uiLanguage)}</div>
          <div style={{display:"flex",gap:8}}>
            <input value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" type="number" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"13px 14px",fontSize:24,fontFamily:"monospace",fontWeight:500}}/>
            {/* Currency picker — only shown for income/expense, not transfers (transfers use source account's currency) */}
            {mode!=="transfer"&&(
              <select value={currency} onChange={e=>setCurrency(e.target.value)} style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"0 12px",fontSize:14,fontWeight:600,cursor:"pointer",minWidth:80,flexShrink:0}}>
                {availableCurrencies.map(c=><option key={c} value={c}>{sym[c]} {c}</option>)}
              </select>
            )}
          </div>
        </div>
        <div>
          <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("From Account",settings.uiLanguage)}</div>
          <select value={accountId} onChange={e=>setAccountId(e.target.value)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name} ({a.currency})</option>)}
          </select>
        </div>
        {mode==="transfer"&&(
          <div>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("To Account",settings.uiLanguage)}</div>
            <select value={toAccountId} onChange={e=>setToAccountId(e.target.value)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
              {accounts.filter(a=>a.id!==accountId).map(a=><option key={a.id} value={a.id}>{a.icon} {a.name} ({a.currency})</option>)}
            </select>
            {/* Cross-currency: show editable rate field with live default + arrival preview */}
            {selAcc&&toAcc&&selAcc.currency!==toAcc.currency&&(
              <div style={{marginTop:10,padding:"12px",background:t.bgCard2,borderRadius:10,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{fontSize:12,color:t.textMuted}}>Exchange rate</span>
                  {customRate!=null&&(
                    <span onClick={()=>setCustomRate(null)} style={{fontSize:11,color:"#10b981",cursor:"pointer",textDecoration:"underline"}}>Use live rate</span>
                  )}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:t.text}}>
                  <span style={{fontFamily:"monospace",color:t.textMuted}}>1 {selAcc.currency} =</span>
                  <input
                    type="number"
                    step="any"
                    value={customRate!=null?customRate:autoRate.toFixed(autoRate>=100?2:6)}
                    onChange={e=>setCustomRate(e.target.value)}
                    style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${customRate!=null?"#10b981":t.border}`,borderRadius:8,padding:"7px 10px",fontSize:13,fontFamily:"monospace",textAlign:"right"}}
                  />
                  <span style={{fontFamily:"monospace",color:t.textMuted}}>{toAcc.currency}</span>
                </div>
                <div style={{fontSize:11,color:t.textMuted,fontStyle:"italic"}}>
                  {customRate!=null?"📝 Using your rate":"🌐 Live rate (tap to override)"}
                </div>
                {transferConverted&&(
                  <div style={{paddingTop:8,borderTop:`1px solid ${t.border}`,display:"flex",alignItems:"center",gap:8,fontSize:13}}>
                    <span>💱</span>
                    <span style={{color:t.textMuted}}>Will arrive:</span>
                    <span style={{color:t.text,fontWeight:600,fontFamily:"monospace",marginLeft:"auto"}}>{fmtFull(transferConverted.amount,transferConverted.currency)}</span>
                  </div>
                )}
              </div>
            )}
          </div>
        )}
        {mode!=="transfer"&&(
          <div>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Category",settings.uiLanguage)}</div>
            <select value={categoryId} onChange={e=>{setCategoryId(e.target.value);setSubcategoryId("");}} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
              <option value="">— Select category —</option>
              {filteredCategories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
            </select>
          </div>
        )}
        {mode!=="transfer"&&selCat?.subcategories?.length>0&&(
          <div>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Subcategory",settings.uiLanguage)}</div>
            <select value={subcategoryId} onChange={e=>setSubcategoryId(e.target.value)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15,cursor:"pointer"}}>
              <option value="">— Select subcategory —</option>
              {selCat.subcategories.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
        )}
        <div style={{display:"flex",gap:10,width:"100%"}}>
          <div style={{flex:"3 1 0",minWidth:0,overflow:"hidden"}}>
            <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Date",settings.uiLanguage)}</div>
            <input value={date} onChange={e=>setDate(e.target.value)} type="date" style={{width:"100%",maxWidth:"100%",display:"block",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 8px",fontSize:13,boxSizing:"border-box",textAlign:"center",WebkitAppearance:"none"}}/>
          </div>
          <div style={{flex:"2 1 0",minWidth:0,overflow:"hidden"}}>

            <input value={time} onChange={e=>setTime(e.target.value)} type="time" style={{width:"100%",maxWidth:"100%",display:"block",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 8px",fontSize:13,boxSizing:"border-box",textAlign:"center",WebkitAppearance:"none"}}/>
          </div>

        <div>
          <div style={{fontSize:13,color:t.textMuted,marginBottom:5}}>{tr("Note",settings.uiLanguage)}</div>
          <input value={note} onChange={e=>setNote(e.target.value)} placeholder={tr("Add a note...",settings.uiLanguage)} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:10,padding:"11px 14px",fontSize:15}}/>

        <div style={{marginTop:4}}>
          {loading?(

          ):(

          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${t.border}`}}>

// ── GOALS CARD (HOME SCREEN) ──
// Compact horizontal scroll showing each goal's progress with bar + comparison.
// Tap a goal to expand and see what the remaining amount could buy.
// ── BUDGET PULSE CARD (HOME) ──
// Shows categories that are near or over their monthly budget. Quiet when everything is fine.
// Color is determined by *pace* — % of budget spent vs % of month elapsed — not raw percentage.
// This is the key insight: 60% through the month at 65% of budget is fine.
// 30% through the month at 65% of budget is a warning.
function BudgetPulseCard({categories,transactions,settings,t,onTabChange}){
  const{selectedCurrency,exchangeRates,uiLanguage}=settings;
  const lang=uiLanguage||"English";

  // Compute current month progress (0 to 1)
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59);
  const monthProgress=(now.getTime()-monthStart.getTime())/(monthEnd.getTime()-monthStart.getTime());
  const daysLeft=Math.max(0,Math.ceil((monthEnd.getTime()-now.getTime())/86400000));

  // Get categories that have budgets set
  const budgetedCats=(categories||[]).filter(c=>c.budgetKzt&&c.budgetKzt>0&&(c.type||"expense")==="expense");
  if(budgetedCats.length===0)return null;

  // Compute spend this month per budgeted category
  const stats=budgetedCats.map(cat=>{
    let spentKzt=0;
    transactions.forEach(tx=>{
      if(tx.type!=="expense")return;
      const txDate=new Date(tx.date);
      if(txDate<monthStart||txDate>monthEnd)return;
      if(tx.categoryId!==cat.id)return;
      spentKzt+=toKZT(tx.amount,tx.currency,exchangeRates);
    });
    const pctSpent=spentKzt/cat.budgetKzt;
    // Pace ratio: how much you've spent vs how much of the month has passed.
    // 1.0 = perfectly on pace; >1 = ahead of pace (concerning); <1 = under pace (good).
    const paceRatio=monthProgress>0.05?pctSpent/monthProgress:pctSpent;
    let status="ok";
    if(pctSpent>=1)status="over";
    else if(paceRatio>=1.3)status="warning";  // 30% ahead of pace
    else if(paceRatio>=1.1)status="watch";    // 10% ahead of pace
    return{cat,spentKzt,pctSpent,paceRatio,status};
  });

  // Sort: over budget first, then ahead-of-pace ones, then by raw % spent
  const statusOrder={over:0,warning:1,watch:2,ok:3};
  stats.sort((a,b)=>{
    if(a.status!==b.status)return statusOrder[a.status]-statusOrder[b.status];
    return b.pctSpent-a.pctSpent;
  });

  // Only show categories that need attention OR show top 3 if everything is ok
  const concerning=stats.filter(s=>s.status!=="ok").slice(0,4);
  const toShow=concerning.length>0?concerning:stats.slice(0,2); // when all ok, show top 2 anyway for context

  // Color + label per status
  const statusInfo={
    over:    {color:"#ef4444",bg:"#ef444415",border:"#ef444433",label:tr("Over budget",lang)},
    warning: {color:"#f59e0b",bg:"#f59e0b15",border:"#f59e0b33",label:tr("Ahead of pace",lang)},
    watch:   {color:"#eab308",bg:"#eab30815",border:"#eab30833",label:tr("Watch",lang)},
    ok:      {color:"#10b981",bg:"#10b98115",border:"#10b98133",label:tr("On track",lang)},
  };

  return(
    <div style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:16,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif",display:"flex",alignItems:"center",gap:6}}>
          💼 {tr("Budget Pulse",lang)}
        </div>
        <div style={{fontSize:11,color:t.textMuted}}>{daysLeft} {tr("days left",lang)}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {toShow.map(({cat,spentKzt,pctSpent,status})=>{
          const info=statusInfo[status];
          const budgetDisplay=fromKZT(cat.budgetKzt,selectedCurrency,exchangeRates);
          const spentDisplay=fromKZT(spentKzt,selectedCurrency,exchangeRates);
          const overByKzt=spentKzt-cat.budgetKzt;
          const overDisplay=fromKZT(Math.abs(overByKzt),selectedCurrency,exchangeRates);
          // Cap bar at 100% visually, but show the actual overflow in numbers
          const barPct=Math.min(100,pctSpent*100);
          return(
            <div key={cat.id}
              onClick={()=>onTabChange&&onTabChange("history")}
              style={{background:t.bgCard,borderRadius:12,padding:"12px 14px",border:`1px solid ${info.border}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <div style={{fontSize:20}}>{cat.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                    <div style={{fontSize:14,fontWeight:600,color:t.text}}>{cat.name}</div>
                    <div style={{fontSize:11,fontWeight:600,color:info.color,background:info.bg,padding:"2px 7px",borderRadius:8,whiteSpace:"nowrap"}}>{info.label}</div>
                  </div>
                  <div style={{fontSize:11,color:t.textMuted,marginTop:2,fontFamily:"monospace"}}>
                    {fmtAmt(spentDisplay,selectedCurrency)} / {fmtAmt(budgetDisplay,selectedCurrency)}
                    {status==="over"&&<span style={{color:"#ef4444",marginLeft:6}}>(+{fmtAmt(overDisplay,selectedCurrency)})</span>}
                  </div>
                </div>
              </div>
              <div style={{height:6,background:t.bgInput,borderRadius:3,overflow:"hidden",position:"relative"}}>
                <div style={{height:"100%",width:`${barPct}%`,background:info.color,borderRadius:3,transition:"width .4s"}}/>
                {/* Vertical line marking month-progress position so user sees pace context */}
                {monthProgress>0.05&&monthProgress<0.95&&(
                  <div style={{position:"absolute",left:`${monthProgress*100}%`,top:-1,bottom:-1,width:1,background:t.textMuted,opacity:0.5}}/>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function GoalsCard({goals,accounts,settings,onGoalsChange,t}){
  const[expandedId,setExpandedId]=useState(null);
  const[contributingGoal,setContributingGoal]=useState(null); // null or the goal object
  if(!goals||goals.length===0)return null;
  const{selectedCurrency,exchangeRates,uiLanguage}=settings;
  const lang=uiLanguage||"English";

  // Saved amount = sum of all contributions to this goal (manual, user-initiated).
  // Contributions are virtual reservations — they don't move real money between accounts,
  // they're just intentional "I'm setting aside X for this goal" entries.
  const computeSaved=(goal)=>{
    return (goal.contributions||[]).reduce((sum,c)=>sum+(c.kzt||0),0);
  };

  // Add a contribution to a goal (called from the modal)
  const handleAddContribution=(goal,amount,accountId,note)=>{
    const kzt=toKZT(amount,selectedCurrency,exchangeRates); // amount entered in the user's display currency
    const contribution={
      id:uid(),
      amount, // in selectedCurrency at time of contribution
      currency:selectedCurrency,
      kzt,
      accountId:accountId||null,
      note:note||"",
      date:new Date().toISOString()
    };
    onGoalsChange(goals.map(g=>
      g.id===goal.id
        ? {...g,contributions:[...(g.contributions||[]),contribution]}
        : g
    ));
  };

  return(
    <div style={{marginBottom:18}}>
      <div style={{fontSize:16,fontWeight:600,color:t.text,fontFamily:"system-ui,sans-serif",marginBottom:10,display:"flex",alignItems:"center",gap:6}}>
        🎯 {tr("Savings Goals",lang)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {goals.map(goal=>{
          const savedKzt=computeSaved(goal);
          const targetKzt=goal.targetKzt;
          const remainingKzt=Math.max(0,targetKzt-savedKzt);
          const pct=targetKzt>0?Math.min(100,(savedKzt/targetKzt)*100):0;
          const isComplete=savedKzt>=targetKzt;

                  <button
                    onClick={(e)=>{e.stopPropagation();setContributingGoal(goal);}}

                      width:"100%",
                      background:"#10b981",
                      border:"none",
                      borderRadius:10,
                      padding:"10px",
                      color:"#fff",
                      fontSize:13,
                      fontWeight:600,

                      fontFamily:"system-ui,sans-serif",

      {/* Contribute modal — opens when user taps the Contribute button on any goal */}

// Time-aware greeting based on hour of day. Returns a translation key so the
// caller can pass it through tr(). Picks Morning/Afternoon/Evening/Night.
const getGreetingKey=()=>{
  const h=new Date().getHours();
  if(h<5) return "Good night";
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  if(h<22) return "Good evening";
  return "Good night";
};

// Compute the user's current logging streak — consecutive calendar days ending today (or yesterday)
// with EITHER a non-transfer transaction OR an explicit "quiet day" marker (user tapped to confirm
// they had no spending). Transfers between own accounts don't count alone — too cheap to game.
// quietDays: Set<string> of "YYYY-M-D" date keys the user marked as deliberately empty.
// Returns { current, longest }.
const computeStreak=(transactions,quietDays)=>{
  // Build the set of qualifying days
  const days=new Set();
  (transactions||[]).forEach(tx=>{
    if(tx.type==="transfer")return;
    const d=new Date(tx.date);
    days.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
  });
  // Quiet-day markers also count
  if(quietDays&&typeof quietDays.forEach==="function"){
    quietDays.forEach(key=>days.add(key));
  }
  if(days.size===0)return{current:0,longest:0};

  // Walk backwards from today to find current streak length.
  // Grace rule: if today isn't logged yet but yesterday is, streak still counts (gives user
  // until end of day to log without breaking it). Streak only breaks once a full day passes empty.
  const today=new Date();
  const todayKey=`${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
  const yesterday=new Date(today.getTime()-86400000);
  const yesterdayKey=`${yesterday.getFullYear()}-${yesterday.getMonth()}-${yesterday.getDate()}`;
  let cursor;
  if(days.has(todayKey)) cursor=new Date(today);
  else if(days.has(yesterdayKey)) cursor=new Date(yesterday);
  else return{current:0,longest:computeLongestStreak(days)};

  let current=0;
  while(true){
    const key=`${cursor.getFullYear()}-${cursor.getMonth()}-${cursor.getDate()}`;
    if(days.has(key)){
      current++;
      cursor=new Date(cursor.getTime()-86400000);
    }else{
      break;
    }
  }
  return{current,longest:Math.max(current,computeLongestStreak(days))};
};

// Helper: find the longest run of consecutive days in the set (for "best ever" stat).
const computeLongestStreak=(days)=>{
  if(days.size===0)return 0;
  // Sort all day-keys chronologically by parsing them back to dates
  const sorted=[...days].map(k=>{
    const[y,m,d]=k.split("-").map(Number);
    return new Date(y,m,d).getTime();
  }).sort((a,b)=>a-b);
  let longest=1,run=1;
  for(let i=1;i<sorted.length;i++){
    const diffDays=Math.round((sorted[i]-sorted[i-1])/86400000);
    if(diffDays===1){run++;longest=Math.max(longest,run);}
    else run=1;
  }
  return longest;
};

function HomeScreen({accounts,transactions,categories,fixedExpenses,goals,settings,onSettingsChange,onAddTxn,onGoalsChange,onTabChange,t,onTxnClick}){
  const{selectedCurrency,balanceHidden,exchangeRates}=settings;
  // Pick today's quote from the user's UI language. Use the same daily index across
  // all languages so the same wisdom appears in different languages on the same day.
  const quoteList=useMemo(()=>getQuotes(settings.uiLanguage),[settings.uiLanguage]);
  const quoteIdx=useMemo(()=>Math.floor(Date.now()/86400000)%quoteList.length,[quoteList.length]);
  const quote=quoteList[quoteIdx];
  const currencies=settings.activeCurrencies||["KZT","USD","EUR","USDT"];
  const cycleCur=()=>{const i=currencies.indexOf(selectedCurrency);onSettingsChange({...settings,selectedCurrency:currencies[(i+1)%currencies.length]});};
  const totalKZT=accounts.reduce((s,a)=>s+toKZT(a.balance,a.currency,exchangeRates),0);
  const total=fromKZT(totalKZT,selectedCurrency,exchangeRates);
  const now=new Date();
  const monthTxns=transactions.filter(tx=>sameMonth(tx.date,now.getFullYear(),now.getMonth()));
  const monthIncome=monthTxns.filter(t=>t.type==="income").reduce((s,t)=>s+toKZT(t.amount,t.currency,exchangeRates),0);
  const monthExpense=monthTxns.filter(t=>t.type==="expense").reduce((s,t)=>s+toKZT(t.amount,t.currency,exchangeRates),0);
  // Quiet days from settings: dates the user explicitly marked as "no spending" via the Home button.
  // Stored as an array of "YYYY-M-D" strings in settings.quietDays so it persists with all other prefs.
  const quietDaysSet=useMemo(()=>new Set(settings.quietDays||[]),[settings.quietDays]);
  // Streak: consecutive days with at least one non-transfer transaction OR a quiet-day marker.
  // Memoized for perf; recompute only when transactions or quietDays change.
  const streak=useMemo(()=>computeStreak(transactions,quietDaysSet),[transactions,quietDaysSet]);
  // Has today been "covered" already? Used to disable the quiet-day button to prevent double-tapping.
  const todayKey=(()=>{const d=new Date();return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;})();
  const todayHasTxn=transactions.some(tx=>{
    if(tx.type==="transfer")return false;
    const d=new Date(tx.date);
    return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`===todayKey;
  });
  const todayIsQuiet=quietDaysSet.has(todayKey);
  const todayCovered=todayHasTxn||todayIsQuiet;
  // Controls whether the streak-rules modal is open

  // Mark today as a quiet day — appends to settings.quietDays array. Idempotent (won't double-add).
  const markQuietDay=()=>{
    if(todayCovered)return;
    const newQuietDays=[...(settings.quietDays||[]),todayKey];
    onSettingsChange({...settings,quietDays:newQuietDays});
    haptic();

  const upcomingFixed=fixedExpenses.filter(fe=>{
    const paid=monthTxns.some(t=>t.type==="expense"&&t.note&&t.note.toLowerCase().includes(fe.name.toLowerCase()));
    return!paid;
  });
  const totalFixed=upcomingFixed.reduce((s,fe)=>s+toKZT(fe.amount,fe.currency,exchangeRates),0);
  const remaining=monthIncome-monthExpense-totalFixed;
  // Show last 10 transactions on the home screen, grouped by date for easier scanning.
  // The grouping mirrors the History screen's pattern: a date header with daily total, then the rows.
  const recentTxns=transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);

    const groups={};

      const d=new Date(tx.date);
      const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if(!groups[key]){
        groups[key]={
          dateKey:key,

      if(tx.type==="income")groups[key].incomeKzt+=kzt;
      else if(tx.type==="expense")groups[key].expenseKzt+=kzt;
    });
    // Maintain newest-first order based on the most recent transaction's date
    return Object.values(groups).sort((a,b)=>b.dateObj-a.dateObj);
  },[recentTxns,exchangeRates]);

      <div style={{padding:"0 16px"}}>

        </div>

        {upcomingFixed.length>0&&(

                      return(

                              {showBothAmounts&&(
                                <div style={{fontSize:11,color:t.textMuted,fontFamily:"monospace",marginTop:2}}>→ +{fmtAmt(txn.toAmount,txn.toCurrency)}</div>
                              )}
                            </div>
                          </div>
                          {txn.aiComment&&(
                            <PetCommentBlock comment={txn.aiComment} petEmoji={(PETS[settings.aiPet]||PETS.dog).emoji} t={t}/>
                          )}

                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
          {/* "Go to History" hint — only shown when there are transactions, gives a way to see more.
              Tapping switches to the History tab via the onTabChange callback. */}
          {recentTxns.length>0&&(
            <button
              onClick={()=>{haptic();onTabChange&&onTabChange("history");}}
              style={{
                width:"100%",
                marginTop:14,
                background:"transparent",
                border:`1px dashed ${t.border}`,
                borderRadius:12,
                padding:"12px",
                color:t.textMuted,
                fontSize:12,
                cursor:"pointer",
                fontFamily:"system-ui,sans-serif",
                display:"flex",
                alignItems:"center",
                justifyContent:"center",
                gap:6
              }}>
              <i className="ti ti-history" style={{fontSize:14}} aria-hidden="true"/>
              {tr("Go to History to view all transactions",settings.uiLanguage)}
            </button>
          )}
          {/* "Mark today as a quiet day" — visible when today has no real txn AND hasn't been marked yet.
              This is how users keep their streak alive on days with no spending without faking transactions. */}
          {!todayCovered&&(
            <button
              onClick={markQuietDay}
              style={{
                width:"100%",
                marginTop:8,
                background:"#f59e0b15",
                border:`1px dashed #f59e0b55`,
                borderRadius:12,
                padding:"12px",
                color:"#f59e0b",
                fontSize:12,
                cursor:"pointer",
                fontFamily:"system-ui,sans-serif",
                display:"flex",
                alignItems:"center",
                justifyContent:"center",
                gap:6,
                fontWeight:600
              }}>
              🔥 {tr("Nothing spent today? Tap to keep your streak",settings.uiLanguage)}
            </button>
          )}
        </div>
      </div>

      {/* ── STREAK RULES MODAL ── */}
      {/* Bottom-sheet style modal that explains how streaks work + shows the user's current/best stats. */}
      {showStreakRules&&(
        <div onClick={()=>setShowStreakRules(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:t.bg,borderRadius:"24px 24px 0 0",padding:"20px 16px calc(20px + env(safe-area-inset-bottom, 0px))",width:"100%",maxWidth:430,maxHeight:"90vh",overflow:"auto"}}>
            <div style={{width:36,height:4,background:t.border,borderRadius:2,margin:"0 auto 16px"}}/>

            {/* Header: big streak number + best ever */}
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:48,marginBottom:4}}>🔥</div>
              <div style={{fontSize:32,fontWeight:700,color:streak.current>0?"#f59e0b":t.text,fontFamily:"system-ui,sans-serif",lineHeight:1}}>
                {streak.current}
              </div>
              <div style={{fontSize:13,color:t.textMuted,marginTop:4}}>
                {tr("day streak",settings.uiLanguage)}
              </div>
              {streak.longest>streak.current&&(
                <div style={{fontSize:11,color:t.textMuted,marginTop:8}}>
                  {tr("Best ever",settings.uiLanguage)}: <span style={{color:t.text,fontWeight:600}}>{streak.longest} {tr("days",settings.uiLanguage)}</span>

                {icon:"✅",text:tr("Log any income or expense to count today",settings.uiLanguage)},
                {icon:"🔥",text:tr("Or tap 'Nothing spent today' on Home if you had no spending",settings.uiLanguage)},
                {icon:"🔄",text:tr("Transfers between your own accounts don't count alone",settings.uiLanguage)},
                {icon:"⏰",text:tr("You have until midnight to keep today's streak alive",settings.uiLanguage)},
