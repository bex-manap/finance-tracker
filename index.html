      </div>
      <span style={{color:t.textMuted,fontSize:20,transform:sec===k?"rotate(90deg)":"",transition:"transform .2s",lineHeight:1}}>›</span>
    </div>
  );

  return(
    <div style={{height:"100%",overflow:"auto",padding:"calc(env(safe-area-inset-top, 20px) + 40px) 16px 16px"}}>
      <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,fontWeight:700,color:t.text,marginBottom:16}}>{tr("Settings",settings.uiLanguage)}</div>

      {/* Profile */}
      <div style={{background:t.bgCard,borderRadius:16,padding:"16px",border:`1px solid ${t.border}`,marginBottom:12,display:"flex",alignItems:"center",gap:14}}>
        <div onClick={()=>fileRef.current?.click()} style={{cursor:"pointer",position:"relative",flexShrink:0}}>
          {settings.profilePicture
            ?<img src={settings.profilePicture} style={{width:58,height:58,borderRadius:"50%",objectFit:"cover"}} alt="profile"/>
            :<div style={{width:58,height:58,borderRadius:"50%",background:"#10b981",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:24,color:"#fff"}}>{(settings.displayName||"U")[0]}</div>}
          <div style={{position:"absolute",bottom:0,right:0,width:20,height:20,background:"#10b981",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff"}}>✎</div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>onSettingsChange({...settings,profilePicture:ev.target.result});r.readAsDataURL(f);}}/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:12,color:t.textMuted,marginBottom:5}}>Display Name</div>
          <input value={settings.displayName||""} onChange={e=>onSettingsChange({...settings,displayName:e.target.value})} style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"9px 12px",fontSize:15,width:"100%",fontFamily:"system-ui,sans-serif"}}/>
        </div>
      </div>

      {/* Quick Toggles */}
      <div style={{background:t.bgCard,borderRadius:14,padding:"14px 16px",border:`1px solid ${t.border}`,marginBottom:12}}>
        {[{l:"🌙 Dark Mode",k:"darkMode"},{l:"🤖 AI Coach",k:"aiEnabled"},{l:"🔔 Daily Reminders",k:"remindersEnabled"}].map(({l,k},i)=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:i===0?12:0,borderBottom:i===0?`1px solid ${t.border}`:"none",paddingTop:i===1?12:0}}>
            <span style={{fontSize:15,fontWeight:500,color:t.text}}>{l}</span>
            <Toggle value={settings[k]} onChange={()=>onSettingsChange({...settings,[k]:!settings[k]})}/>
          </div>
        ))}
      </div>

      <Section k="accounts" label={tr("Accounts",settings.uiLanguage)} icon="🏦"/>
      {sec==="accounts"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:8}}>
          {accounts.map(a=>{
            const isEditing=editAccId===a.id;
            const allowedCurrencies=getAccountCurrencies(a.type);
            return(
              <div key={a.id} style={{padding:"9px 0",borderBottom:`1px solid ${t.border}`}}>
                {isEditing?(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                      <EmojiPicker value={editAccIcon} onChange={setEditAccIcon} t={t} categoryHint={a.type==="crypto"?"crypto":"accounts"}/>
                      <input value={editAccName} onChange={e=>setEditAccName(e.target.value)} placeholder="Account name" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"9px 10px",fontSize:14,fontFamily:"system-ui,sans-serif"}}/>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:11,color:t.textMuted,minWidth:60}}>Currency:</span>
                      <select value={editAccCurrency} onChange={e=>setEditAccCurrency(e.target.value)} style={{flex:1,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"6px 10px",fontSize:13,cursor:"pointer"}}>
                        {allowedCurrencies.map(c=><option key={c} value={c}>{sym[c]} {c}</option>)}
                      </select>
                    </div>
                    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                      <button onClick={()=>{onAccountsChange(accounts.map(x=>x.id===a.id?{...x,name:editAccName,currency:editAccCurrency,icon:editAccIcon||x.icon}:x));setEditAccId(null);}} style={{background:"#10b981",border:"none",borderRadius:6,padding:"5px 12px",color:"#fff",cursor:"pointer",fontSize:12}}>Save</button>
                      <button onClick={()=>setEditAccId(null)} style={{background:t.bgInput,border:"none",borderRadius:6,padding:"5px 12px",color:t.textMuted,cursor:"pointer",fontSize:12}}>Cancel</button>
                    </div>
                  </div>
                ):(
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:18}}>{a.icon}</span>
                    <span style={{flex:1,fontSize:14,color:t.text,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name} <span style={{color:t.textMuted}}>({a.currency})</span></span>
                    <button onClick={()=>{setEditAccId(a.id);setEditAccName(a.name);setEditAccCurrency(a.currency);setEditAccIcon(a.icon||"🏦");}} style={{background:t.bgInput,border:"none",borderRadius:6,padding:"5px 10px",color:t.textMuted,cursor:"pointer",fontSize:12,flexShrink:0}}>✎</button>
                    <button onClick={()=>{if(confirm(`Delete account "${a.name}"? This will not delete its transactions.`))onAccountsChange(accounts.filter(x=>x.id!==a.id));}} style={{background:"#ef444422",border:"none",borderRadius:6,padding:"5px 10px",color:"#ef4444",cursor:"pointer",fontSize:12,flexShrink:0}}>✕</button>
                  </div>
                )}
              </div>
            );
          })}
          <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${t.border}`}}>
            <div style={{fontSize:11,fontWeight:700,color:t.textMuted,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Add new account</div>
            <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <EmojiPicker value={newAccIcon} onChange={setNewAccIcon} t={t} categoryHint={newAccType==="crypto"?"crypto":"accounts"}/>
              <input value={newAccName} onChange={e=>setNewAccName(e.target.value)} placeholder="Account name" style={{flex:1,minWidth:0,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"9px 10px",fontSize:14,fontFamily:"system-ui,sans-serif"}}/>
              <select value={newAccType} onChange={e=>{setNewAccType(e.target.value);setNewAccIcon(e.target.value==="crypto"?"💎":"🏦");}} style={{background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"9px 6px",fontSize:13,flexShrink:0}}>
                <option value="bank">Bank</option><option value="crypto">Crypto</option>
              </select>
              <button onClick={()=>{
                if(!newAccName.trim())return;
                onAccountsChange([...accounts,{id:uid(),name:newAccName.trim(),type:newAccType,currency:newAccType==="crypto"?"USDT":"KZT",balance:0,icon:newAccIcon||(newAccType==="bank"?"🏦":"💰"),color:"#10b981",isActive:true}]);
                track("account_create",{type:newAccType});
                setNewAccName("");
                setNewAccIcon(newAccType==="bank"?"🏦":"💎");
              }} style={{background:"#10b981",border:"none",borderRadius:8,padding:"9px 14px",color:"#fff",cursor:"pointer",fontSize:16,fontWeight:700,flexShrink:0}}>+</button>
            </div>
          </div>
        </div>
      )}

      <Section k="categories" label={tr("Categories",settings.uiLanguage)} icon="🗂️"/>
      {sec==="categories"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:8}}>
          {/* Group categories by type for clearer Income vs Expense separation */}
          {["expense","income"].map(groupType=>{
            const groupCats=categories.filter(c=>{
              const ct=c.type||(/salary|income|loan|freelance/i.test(c.name)?"income":"expense");
              return ct===groupType;
            });
            if(groupCats.length===0)return null;
            const headerColor=groupType==="income"?"#10b981":"#ef4444";
            return(
              <div key={groupType} style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:headerColor,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6,paddingLeft:2}}>
                  {groupType==="income"?"💰 Income":"💸 Expense"} categories
                </div>
                {groupCats.map(c=>{
                  const isExpanded=expandedCatId===c.id;
                  const subs=c.subcategories||[];
                  return(
                    <div key={c.id} style={{background:t.bgInput,borderRadius:10,marginBottom:6,overflow:"hidden"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",cursor:"pointer"}} onClick={()=>{setExpandedCatId(isExpanded?null:c.id);setNewSubName("");}}>
                        <span style={{fontSize:18}}>{c.icon}</span>
                        <span style={{flex:1,fontSize:14,color:t.text,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                        <span style={{color:t.textMuted,fontSize:11,flexShrink:0}}>{subs.length} sub</span>
                        <span style={{color:t.textMuted,fontSize:14,transform:isExpanded?"rotate(90deg)":"none",transition:"transform .15s"}}>›</span>
                        <button onClick={(e)=>{e.stopPropagation();if(confirm(`Delete category "${c.name}" and all its subcategories?`))onCategoriesChange(categories.filter(x=>x.id!==c.id));}} style={{background:"#ef444422",border:"none",borderRadius:6,padding:"4px 9px",color:"#ef4444",cursor:"pointer",fontSize:11,flexShrink:0}}>✕</button>
                      </div>
                      {isExpanded&&(
                        <div className="fade-in" style={{padding:"4px 12px 12px",borderTop:`1px solid ${t.border}`}}>

                              <span style={{flex:1,fontSize:13,color:t.text}}>{s.name}</span>
                              <button onClick={()=>{
                                const updated=categories.map(cat=>cat.id===c.id?{...cat,subcategories:subs.filter(x=>x.id!==s.id)}:cat);
                                onCategoriesChange(updated);
                              }} style={{background:"transparent",border:"none",color:t.textMuted,cursor:"pointer",fontSize:14,padding:"2px 6px"}}>✕</button>
                            </div>
                          ))}
                          <div style={{display:"flex",gap:6,marginTop:8}}>
                            <input
                              value={newSubName}
                              onChange={e=>setNewSubName(e.target.value)}
                              onKeyDown={e=>{
                                if(e.key==="Enter"&&newSubName.trim()){
                                  const updated=categories.map(cat=>cat.id===c.id?{...cat,subcategories:[...subs,{id:uid(),name:newSubName.trim()}]}:cat);
                                  onCategoriesChange(updated);
                                  setNewSubName("");

                              }}

                              style={{flex:1,minWidth:0,background:t.bgCard,color:t.text,border:`1px solid ${t.border}`,borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"system-ui,sans-serif"}}

                              if(!newSubName.trim())return;

                              setNewSubName("");

                          </div>
                        </div>

            );

      <Section k="fixed" label={tr("Fixed Expenses",settings.uiLanguage)} icon="📅"/>

              <button onClick={()=>{if(!newFeName.trim()||!newFeAmt)return;onFixedChange([...fixedExpenses,{id:uid(),name:newFeName.trim(),amount:+newFeAmt,currency:"KZT",dayOfMonth:+newFeDay||1,categoryId:"cat3",accountId:accounts[0]?.id}]);setNewFeName("");setNewFeAmt("");}} style={{background:"#10b981",border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",cursor:"pointer",fontSize:16,fontWeight:700}}>+</button>

      <Section k="goals" label={tr("Savings Goals",settings.uiLanguage)} icon="🎯"/>
      {sec==="goals"&&(

            <div style={{fontSize:12,color:t.textMuted,fontStyle:"italic",padding:"8px 4px",lineHeight:1.5}}>

                  <div style={{fontSize:14,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{g.name}</div>

              <button onClick={()=>{

                onGoalsChange([...(goals||[]),{

                  name:newGoalName.trim(),
                  emoji:newGoalEmoji||"🎯",

            </div>
            <div style={{fontSize:11,color:t.textMuted,marginTop:8,fontStyle:"italic",lineHeight:1.5}}>
              💡 Progress = total income minus total expenses since the goal was created. Amounts are entered and stored in tenge.
            </div>
          </div>
        </div>
      )}

      <Section k="appLang" label={tr("App Language",settings.uiLanguage)} icon="🌐"/>
      {sec==="appLang"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:8}}>
          <div style={{fontSize:11,color:t.textMuted,marginBottom:8,lineHeight:1.5}}>
            Controls the language of buttons, labels, and menus throughout the app. Independent from your AI companion's language.
          </div>
          <select
            value={settings.uiLanguage||"English"}
            onChange={e=>onSettingsChange({...settings,uiLanguage:e.target.value})}
            style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"10px 12px",fontSize:14,cursor:"pointer"}}
          >
            <option value="English">🇺🇸 English</option>
            <option value="Russian">🇷🇺 Русский</option>
            <option value="Kazakh">🇰🇿 Қазақша</option>
          </select>
          <button
            onClick={()=>onSettingsChange({...settings,uiLanguage:detectSystemLanguage()})}
            style={{marginTop:8,width:"100%",background:"transparent",color:t.textMuted,border:`1px dashed ${t.border}`,borderRadius:8,padding:"8px",fontSize:12,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}
          >
            🔄 {tr("Auto (System)",settings.uiLanguage)}
          </button>
        </div>
      )}

      <Section k="ai" label={tr("AI Coach Settings",settings.uiLanguage)} icon="🤖"/>
      {sec==="ai"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:8,display:"flex",flexDirection:"column",gap:10}}>
          <div>
            <div style={{fontSize:12,color:t.textMuted,marginBottom:8}}>Your AI Companion</div>
            <div style={{display:"flex",gap:10}}>
              {[{k:"dog",emoji:"🐶",label:"Dog",desc:"Loyal & supportive"},{k:"cat",emoji:"🐱",label:"Cat",desc:"Sassy & judgmental"}].map(({k,emoji,label,desc})=>{
                const active=settings.aiPet===k;
                return(
                  <div key={k} onClick={()=>onSettingsChange({...settings,aiPet:k})} style={{flex:1,padding:"14px 10px",borderRadius:12,border:`2px solid ${active?"#10b981":t.border}`,background:active?"#10b98122":t.bgInput,cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
                    <div style={{fontSize:32,marginBottom:4}}>{emoji}</div>
                    <div style={{fontSize:14,fontWeight:600,color:active?"#10b981":t.text}}>{label}</div>
                    <div style={{fontSize:11,color:t.textMuted,marginTop:2}}>{desc}</div>
                  </div>
                );
              })}
            </div>
          </div>
          {[
            {l:"Tone",k:"aiTone",opts:[{v:"soft",l:"😇 Soft — Gentle & encouraging"},{v:"medium",l:"😏 Medium — Direct & witty"},{v:"harsh",l:"😈 Harsh — Brutally honest"},{v:"explicit",l:"🔞 18+ — Unfiltered & profane"}]},
            {l:tr("AI Language",settings.uiLanguage),k:"aiLanguage",opts:[{v:"English",l:"English"},{v:"Russian",l:"Русский"},{v:"Kazakh",l:"Қазақша"}]},
          ].map(({l,k,opts})=>(
            <div key={k}>
              <div style={{fontSize:12,color:t.textMuted,marginBottom:5}}>{l}</div>
              <select value={settings[k]} onChange={e=>onSettingsChange({...settings,[k]:e.target.value})} style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"10px 12px",fontSize:14}}>
                {opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
              </select>
            </div>
          ))}
          <div>
            <div style={{fontSize:12,color:t.textMuted,marginBottom:5}}>Custom Prompt Prefix</div>
            <input value={settings.aiCustomPrompt||""} onChange={e=>onSettingsChange({...settings,aiCustomPrompt:e.target.value})} placeholder="e.g. Always compare to cups of coffee." style={{width:"100%",background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"10px 12px",fontSize:14,fontFamily:"system-ui,sans-serif"}}/>
          </div>
          <div style={{fontSize:11,color:t.textMuted,fontStyle:"italic",padding:"4px 2px"}}>Your {PETS[settings.aiPet]?.name||"pet"} will comment on both expenses and income when you log them.</div>
        </div>
      )}

      <Section k="currencies" label={tr("Exchange Rates",settings.uiLanguage)} icon="💱"/>
      {sec==="currencies"&&(
        <div style={{background:t.bgCard2,borderRadius:12,padding:"12px",border:`1px solid ${t.border}`,marginBottom:8}}>
          <div style={{fontSize:11,color:t.textMuted,marginBottom:10,lineHeight:1.5}}>
            Rates update automatically once per hour from public APIs (exchangerate-api.com & CoinGecko).
            {settings.lastRateUpdate&&(
              <div style={{marginTop:4}}>Last updated: {new Date(settings.lastRateUpdate).toLocaleString()}</div>
            )}
          </div>
          {["USD","EUR","USDT","BTC","ETH"].map(c=>(
            <div key={c} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:`1px solid ${t.border}`}}>
              <span style={{fontSize:14,color:t.text,width:48,fontWeight:700,fontFamily:"monospace"}}>{c}</span>
              <span style={{fontSize:13,color:t.textMuted,flex:1}}>1 {c} =</span>
              <input value={Math.round((settings.exchangeRates[c]||0)*100)/100} onChange={e=>onSettingsChange({...settings,exchangeRates:{...settings.exchangeRates,[c]:+e.target.value}})} type="number" style={{width:100,background:t.bgInput,color:t.text,border:`1px solid ${t.border}`,borderRadius:8,padding:"6px 10px",fontSize:13,textAlign:"right",fontFamily:"monospace"}}/>
              <span style={{fontSize:13,color:t.textMuted}}>₸</span>
            </div>
          ))}
          <button onClick={onRefreshRates} style={{width:"100%",marginTop:12,background:"transparent",color:"#10b981",border:"1.5px solid #10b981",borderRadius:10,padding:"10px",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>
            🔄 Refresh rates now
          </button>
        </div>
      )}

      {/* Export — download a CSV of all transactions */}
      <div style={{marginTop:16,padding:"16px",background:t.bgCard,borderRadius:12,border:`1px solid ${t.border}`}}>
        <div style={{fontSize:13,fontWeight:600,color:t.textMuted,marginBottom:10}}>📤 Export Data</div>
        <button onClick={onExport} style={{width:"100%",background:"transparent",color:t.accent,border:`1.5px solid ${t.accent}`,borderRadius:10,padding:"12px",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>
          📊 Download CSV
        </button>
        <div style={{fontSize:11,color:t.textMuted,marginTop:8,textAlign:"center",lineHeight:1.5}}>
          Includes all transactions and current account balances. Opens in Excel, Numbers, or Google Sheets.
        </div>
      </div>

      {/* Danger Zone — wipes everything and starts fresh */}
      <div style={{marginTop:24,padding:"16px",background:t.bgCard,borderRadius:12,border:`1px solid ${t.border}`}}>
        <div style={{fontSize:13,fontWeight:600,color:t.textMuted,marginBottom:10}}>⚠️ Danger Zone</div>
        <button onClick={()=>{
          if(confirm("This will permanently delete all your accounts, transactions, categories, and settings. Are you sure?")){
            if(confirm("Really sure? This cannot be undone.")){
              onReset();
            }
          }
        }} style={{width:"100%",background:"transparent",color:"#ef4444",border:"1.5px solid #ef4444",borderRadius:10,padding:"12px",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"system-ui,sans-serif"}}>
          🗑️ Reset All Data
        </button>
        <div style={{fontSize:11,color:t.textMuted,marginTop:8,textAlign:"center"}}>Clears all accounts, transactions, and settings on this device and in the cloud.</div>
      </div>
    </div>
  );
}

// ── ONBOARDING ──
// Walks new users through setup: name, banks, crypto, pet, currency.
// Runs on first launch; skipped thereafter.
function OnboardingScreen({tgUser,onComplete}){
  const[step,setStep]=useState(0);
  const[name,setName]=useState(tgUser?.first_name||"");
  const[profilePic,setProfilePic]=useState(tgUser?.photo_url||null);
  const[selectedBanks,setSelectedBanks]=useState([]);
  const[selectedCrypto,setSelectedCrypto]=useState([]);
  const[customBankName,setCustomBankName]=useState("");
  const[customCryptoName,setCustomCryptoName]=useState("");
  const[pet,setPet]=useState("dog");
  const[currency,setCurrency]=useState("KZT");

  const toggleBank=(bankName)=>setSelectedBanks(s=>s.includes(bankName)?s.filter(x=>x!==bankName):[...s,bankName]);
  const toggleCrypto=(c)=>setSelectedCrypto(s=>s.includes(c)?s.filter(x=>x!==c):[...s,c]);

  const addCustomBank=()=>{
    const n=customBankName.trim();
    if(!n)return;
    if(!selectedBanks.includes(n))setSelectedBanks([...selectedBanks,n]);
    setCustomBankName("");
  };
  const addCustomCrypto=()=>{
    const n=customCryptoName.trim();
    if(!n)return;
    if(!selectedCrypto.includes(n))setSelectedCrypto([...selectedCrypto,n]);
    setCustomCryptoName("");
  };

  const canAdvance=()=>{
    if(step===0)return name.trim().length>0;
    return true;
  };

  const finish=()=>{
    // Build account list from selections
    const accounts=[];
    selectedBanks.forEach(bankName=>{
      const preset=BANK_PRESETS.find(b=>b.name===bankName);
      accounts.push({
        id:uid(),
        name:bankName,
        type:"bank",
        currency:currency,
        balance:0,
        icon:preset?.icon||"🏦",
        color:preset?.color||"#3b82f6",
        isActive:true
      });
    });
    selectedCrypto.forEach(cryptoName=>{
      const preset=CRYPTO_PRESETS.find(c=>c.name===cryptoName);
      accounts.push({
        id:uid(),
        name:cryptoName,
        type:"crypto",
        currency:"USDT",
        balance:0,
        icon:preset?.icon||"💰",
        color:preset?.color||"#f59e0b",
        isActive:true
      });
    });
    onComplete({
      displayName:name.trim(),
      profilePicture:profilePic,
      aiPet:pet,
      selectedCurrency:currency,
      accounts
    });
  };

  const STEPS=["Welcome","Banks","Crypto","Companion","Currency"];

  const containerStyle={
    height:"100vh",
    display:"flex",
    flexDirection:"column",
    background:"linear-gradient(160deg,#0a0f1e,#0f2027,#0a0f1e)",
    color:"#e2e8f0",
    padding:"calc(env(safe-area-inset-top, 20px) + 40px) 20px calc(20px + env(safe-area-inset-bottom, 0px))",
    overflow:"auto"
  };
  const headerStyle={textAlign:"center",marginBottom:24};
  const titleStyle={fontSize:26,fontWeight:700,marginBottom:8};
  const subtitleStyle={fontSize:14,color:"#94a3b8",lineHeight:1.5};
  const chipBase={padding:"10px 14px",borderRadius:12,border:`1.5px solid #1e2d3d`,background:"#111827",cursor:"pointer",fontSize:14,color:"#e2e8f0",transition:"all .15s"};
  const chipActive={borderColor:"#10b981",background:"#10b98122",color:"#10b981"};
  const inputStyle={width:"100%",background:"#1e2d3d",color:"#e2e8f0",border:"1px solid #1e2d3d",borderRadius:12,padding:"14px 16px",fontSize:16,fontFamily:"system-ui,sans-serif"};
  const primaryBtn={width:"100%",background:"#10b981",color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:16,fontWeight:600,cursor:"pointer",marginTop:20,opacity:canAdvance()?1:0.5};

  return(
    <div style={containerStyle}>
      {/* Progress dots */}
      <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:32}}>
        {STEPS.map((_,i)=>(
          <div key={i} style={{width:i===step?24:8,height:8,borderRadius:4,background:i<=step?"#10b981":"#1e2d3d",transition:"all .2s"}}/>
        ))}
      </div>

      <div style={{flex:1,maxWidth:400,margin:"0 auto",width:"100%"}}>
        {/* Step 0: Welcome + Name */}
        {step===0&&(
          <div>
            <div style={headerStyle}>
              <div style={{fontSize:64,marginBottom:16}}>💰</div>
              <div style={titleStyle}>Welcome to Finance Tracker!</div>
              <div style={subtitleStyle}>Let's set things up. This takes about 30 seconds.</div>
            </div>
            {profilePic&&(
              <div style={{textAlign:"center",marginBottom:20}}>
                <img src={profilePic} style={{width:72,height:72,borderRadius:"50%",objectFit:"cover",border:"2px solid #10b981"}} alt="profile"/>
              </div>
            )}
            <div style={{fontSize:13,color:"#94a3b8",marginBottom:6}}>What should we call you?</div>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={inputStyle} autoFocus/>
          </div>
        )}

        {/* Step 1: Banks */}
        {step===1&&(
          <div>
            <div style={headerStyle}>
              <div style={{fontSize:48,marginBottom:12}}>🏦</div>
              <div style={titleStyle}>Your Banks</div>
              <div style={subtitleStyle}>Select the banks you use. You can add more later.</div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:16}}>
              {BANK_PRESETS.map(bank=>{
                const active=selectedBanks.includes(bank.name);
                return(
                  <div key={bank.name} onClick={()=>toggleBank(bank.name)} style={{...chipBase,...(active?chipActive:{}),display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:18}}>{bank.icon}</span>
                    <span>{bank.name}</span>
                    {active&&<span style={{fontSize:11,color:"#10b981"}}>✓</span>}
                  </div>
                );
              })}
            </div>
            {/* Custom ones already added */}
            {selectedBanks.filter(b=>!BANK_PRESETS.find(p=>p.name===b)).map(n=>(
              <div key={n} style={{...chipBase,...chipActive,display:"inline-flex",alignItems:"center",gap:8,marginRight:8,marginBottom:8}}>
                🏦 {n}
                <span onClick={()=>toggleBank(n)} style={{cursor:"pointer",color:"#ef4444"}}>✕</span>
              </div>
            ))}
            <div style={{fontSize:13,color:"#94a3b8",marginTop:16,marginBottom:6}}>Add a custom bank</div>
            <div style={{display:"flex",gap:8}}>
              <input value={customBankName} onChange={e=>setCustomBankName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCustomBank()} placeholder="Bank name" style={{...inputStyle,flex:1}}/>
              <button onClick={addCustomBank} style={{background:"#10b981",color:"#fff",border:"none",borderRadius:12,padding:"0 20px",fontSize:20,fontWeight:700,cursor:"pointer",flexShrink:0}}>+</button>
            </div>
          </div>
        )}

        {/* Step 2: Crypto */}
        {step===2&&(
          <div>
            <div style={headerStyle}>
              <div style={{fontSize:48,marginBottom:12}}>₿</div>
              <div style={titleStyle}>Crypto Wallets</div>
              <div style={subtitleStyle}>Any crypto accounts? Skip if none.</div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:16}}>
              {CRYPTO_PRESETS.map(c=>{
                const active=selectedCrypto.includes(c.name);
                return(
                  <div key={c.name} onClick={()=>toggleCrypto(c.name)} style={{...chipBase,...(active?chipActive:{}),display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:18}}>{c.icon}</span>
                    <span>{c.name}</span>
                    {active&&<span style={{fontSize:11,color:"#10b981"}}>✓</span>}
                  </div>
                );
              })}
            </div>
            {selectedCrypto.filter(c=>!CRYPTO_PRESETS.find(p=>p.name===c)).map(n=>(
              <div key={n} style={{...chipBase,...chipActive,display:"inline-flex",alignItems:"center",gap:8,marginRight:8,marginBottom:8}}>
                💰 {n}
                <span onClick={()=>toggleCrypto(n)} style={{cursor:"pointer",color:"#ef4444"}}>✕</span>
              </div>
            ))}
            <div style={{fontSize:13,color:"#94a3b8",marginTop:16,marginBottom:6}}>Add a custom wallet</div>
            <div style={{display:"flex",gap:8}}>
              <input value={customCryptoName} onChange={e=>setCustomCryptoName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCustomCrypto()} placeholder="Wallet name" style={{...inputStyle,flex:1}}/>
              <button onClick={addCustomCrypto} style={{background:"#10b981",color:"#fff",border:"none",borderRadius:12,padding:"0 20px",fontSize:20,fontWeight:700,cursor:"pointer",flexShrink:0}}>+</button>
            </div>
          </div>
        )}

        {/* Step 3: Pet */}
        {step===3&&(
          <div>
            <div style={headerStyle}>
              <div style={{fontSize:48,marginBottom:12}}>🤖</div>
              <div style={titleStyle}>Pick Your AI Companion</div>
              <div style={subtitleStyle}>They'll react to every transaction you log. Pick a vibe.</div>
            </div>
            <div style={{display:"flex",gap:12}}>
              {[
                {k:"dog",emoji:"🐶",label:"Dog",desc:"Loyal, enthusiastic, supportive"},
                {k:"cat",emoji:"🐱",label:"Cat",desc:"Sassy, judgmental, dryly funny"}
              ].map(({k,emoji,label,desc})=>{
                const active=pet===k;
                return(
                  <div key={k} onClick={()=>setPet(k)} style={{flex:1,padding:"24px 14px",borderRadius:16,border:`2px solid ${active?"#10b981":"#1e2d3d"}`,background:active?"#10b98122":"#111827",cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
                    <div style={{fontSize:64,marginBottom:10}}>{emoji}</div>
                    <div style={{fontSize:18,fontWeight:600,color:active?"#10b981":"#e2e8f0",marginBottom:6}}>{label}</div>
                    <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.4}}>{desc}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Step 4: Currency */}
        {step===4&&(
          <div>
            <div style={headerStyle}>
              <div style={{fontSize:48,marginBottom:12}}>💱</div>
              <div style={titleStyle}>Default Currency</div>
              <div style={subtitleStyle}>What currency do you mostly use? You can switch any time.</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {[
                {k:"KZT",label:"Tenge",sym:"₸"},
                {k:"USD",label:"US Dollar",sym:"$"},
                {k:"EUR",label:"Euro",sym:"€"},
                {k:"USDT",label:"Tether (Crypto)",sym:"₮"}
              ].map(({k,label,sym})=>{
                const active=currency===k;
                return(
                  <div key={k} onClick={()=>setCurrency(k)} style={{padding:"16px 18px",borderRadius:12,border:`1.5px solid ${active?"#10b981":"#1e2d3d"}`,background:active?"#10b98122":"#111827",cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
                    <span style={{fontSize:24,fontWeight:700,color:active?"#10b981":"#94a3b8",minWidth:32}}>{sym}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:15,fontWeight:600,color:active?"#10b981":"#e2e8f0"}}>{k}</div>
                      <div style={{fontSize:12,color:"#94a3b8"}}>{label}</div>
                    </div>
                    {active&&<span style={{color:"#10b981",fontSize:20}}>✓</span>}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* Nav buttons */}
      <div style={{maxWidth:400,margin:"0 auto",width:"100%",marginTop:20}}>
        {step===STEPS.length-1?(
          <button onClick={finish} style={primaryBtn}>Start Tracking 🚀</button>
        ):(
          <button disabled={!canAdvance()} onClick={()=>setStep(step+1)} style={primaryBtn}>Continue</button>
        )}
        {step>0&&(
          <button onClick={()=>setStep(step-1)} style={{width:"100%",background:"transparent",color:"#94a3b8",border:"none",borderRadius:12,padding:"10px",fontSize:14,cursor:"pointer",marginTop:8}}>
            ← Back
          </button>
        )}
        {(step===1||step===2)&&(
          <button onClick={()=>setStep(step+1)} style={{width:"100%",background:"transparent",color:"#64748b",border:"none",borderRadius:12,padding:"6px",fontSize:13,cursor:"pointer"}}>
            Skip
          </button>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP ──
function App(){
  const[loaded,setLoaded]=useState(false);
  const[accounts,setAccountsRaw]=useState(DEF_ACCOUNTS);
  const[transactions,setTransactionsRaw]=useState([]);
  const[categories,setCategoriesRaw]=useState(DEF_CATS);
  const[fixedExpenses,setFixedRaw]=useState(DEF_FIXED);
  const[goals,setGoalsRaw]=useState(DEF_GOALS);
  const[settings,setSettingsRaw]=useState(DEF_SETTINGS);
  const[tab,setTab]=useState("home");
  const[addModal,setAddModal]=useState(false);
  const[addMode,setAddMode]=useState("expense");
  const[selTxn,setSelTxn]=useState(null);

  const save=(key,val)=>{STORE.set(key,val).catch(()=>{});};
  const setAccounts=v=>{setAccountsRaw(v);save("ft_accounts",v);};
  const setTransactions=v=>{setTransactionsRaw(v);LS.set("ft_transactions",v);}; // full array only to localStorage; CS updates happen per-txn
  const setCategories=v=>{setCategoriesRaw(v);save("ft_categories",v);};
  const setFixed=v=>{setFixedRaw(v);save("ft_fixed",v);};
  const setGoals=v=>{setGoalsRaw(v);save("ft_goals",v);};
  const setSettings=v=>{setSettingsRaw(v);save("ft_settings",v);};

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      let accs=null,cats=null,sets=null,fxd=null,gls=null,txns=[];
      try{
        // Try to load from CloudStorage first; falls back to localStorage if CS unavailable or times out.
        accs=await STORE.get("ft_accounts",null);
        cats=await STORE.get("ft_categories",null);
        sets=await STORE.get("ft_settings",null);
        fxd=await STORE.get("ft_fixed",null);
        gls=await STORE.get("ft_goals",null);
        txns=await STORE.getAllTransactions();
      }catch(e){
        console.error("Load error, falling back to localStorage:",e);
      }

      try{
        const isFirstRun=!accs&&!cats&&!sets;

        if(isFirstRun){
          // Brand new user — seed with empty data (user will add their own)
          accs=DEF_ACCOUNTS;
          cats=DEF_CATS;
          sets=DEF_SETTINGS;
          fxd=DEF_FIXED;
          gls=DEF_GOALS;
          txns=[];
          // Persist seed data (fire and forget — don't block UI)
          STORE.set("ft_accounts",accs).catch(()=>{});
          STORE.set("ft_categories",cats).catch(()=>{});
          STORE.set("ft_settings",sets).catch(()=>{});
          STORE.set("ft_fixed",fxd).catch(()=>{});
          STORE.set("ft_goals",gls).catch(()=>{});
          LS.set("ft_init",true);
        } else {
          // Returning user — backfill any missing pieces with defaults
          accs=accs||LS.get("ft_accounts",DEF_ACCOUNTS);
          cats=cats||LS.get("ft_categories",DEF_CATS);
          sets=sets||LS.get("ft_settings",DEF_SETTINGS);
          fxd=fxd||LS.get("ft_fixed",DEF_FIXED);
          gls=gls||LS.get("ft_goals",DEF_GOALS);
          if(!txns||txns.length===0)txns=LS.get("ft_transactions",[]);
          // Merge with default settings so new fields (like aiPet) always have a value
          sets={...DEF_SETTINGS,...sets};
          // Existing users from before onboarding existed: if they have a displayName
          // or any accounts, treat them as already onboarded (don't force flow on them)
          if(sets.onboarded===undefined||sets.onboarded===false){
            if((accs&&accs.length>0)||(sets.displayName&&sets.displayName.length>0)){
              sets.onboarded=true;
            }
          }
          // One-time migration: if CloudStorage is available but hasn't been populated yet,
          // push everything from localStorage up to the cloud (fire and forget)
          if(CS_AVAILABLE&&!LS.get("ft_cs_migrated",false)){
            STORE.set("ft_accounts",accs).catch(()=>{});
            STORE.set("ft_categories",cats).catch(()=>{});
            STORE.set("ft_settings",sets).catch(()=>{});
            STORE.set("ft_fixed",fxd).catch(()=>{});
            for(const tx of txns)STORE.saveTransaction(tx).catch(()=>{});
            LS.set("ft_cs_migrated",true);
          }
        }
      }catch(e){
        console.error("Data prep error:",e);
        // Last resort fallback to defaults
        accs=accs||DEF_ACCOUNTS;
        cats=cats||DEF_CATS;
        sets=sets||DEF_SETTINGS;
        fxd=fxd||DEF_FIXED;
        txns=txns||[];
      }

      if(cancelled)return;

      // Always complete loading, no matter what happened above
      try{
        setAccountsRaw(accs||DEF_ACCOUNTS);
        setCategoriesRaw(cats||DEF_CATS);
        // Resolve uiLanguage: if null/missing (first launch), auto-detect from system
        const merged={...DEF_SETTINGS,...(sets||{})};
        if(!merged.uiLanguage)merged.uiLanguage=detectSystemLanguage();
        setSettingsRaw(merged);
        setFixedRaw(fxd||DEF_FIXED);
        setGoalsRaw(gls||DEF_GOALS);
        setTransactionsRaw(txns||[]);
      }catch(e){console.error("State set error:",e);}

      // Hide splash screen
      const splash=document.getElementById("splash");
      if(splash){splash.classList.add("hidden");setTimeout(()=>splash.remove(),300);}
      setLoaded(true);

      // Track this session for analytics — fire-and-forget, won't block anything
      track("app_open");

      // Fetch live exchange rates in the background — refresh once per hour to avoid
      // hammering public APIs. Doesn't block app startup; if it fails, cached rates are used.
      try{
        const lastUpdate=sets?.lastRateUpdate||0;
        const hourAgo=Date.now()-3600000;
        if(lastUpdate<hourAgo){
          const liveRates=await fetchLiveRates();
          if(cancelled)return;
          // Only update rates that actually came back (partial updates OK)
          const mergedRates={...(sets?.exchangeRates||DEF_SETTINGS.exchangeRates),...liveRates};
          const updatedSettings={...DEF_SETTINGS,...(sets||{}),exchangeRates:mergedRates,lastRateUpdate:Date.now()};
          setSettingsRaw(updatedSettings);
          STORE.set("ft_settings",updatedSettings).catch(()=>{});
        }
      }catch(e){console.warn("Rate update failed, using cached rates:",e);}
    })();
    return()=>{cancelled=true;};
  },[]);

  // Helper: convert an amount from one currency to another using current rates.
  // All rates are stored as "1 UNIT = X KZT", so we go via KZT as the common base.
  const convertAmount=useCallback((amount,fromCurrency,toCurrency)=>{
    if(fromCurrency===toCurrency)return amount;
    const rates=settings.exchangeRates||{};
    const kztValue=amount*(rates[fromCurrency]||1);
    return kztValue/(rates[toCurrency]||1);
  },[settings.exchangeRates]);

  // Apply the balance impact of a transaction to the accounts list.
  // Used both for normal save and for the "edit" flow (apply new) / "delete" flow (reverse).
  const handleSaveTxn=useCallback((txn)=>{
    const newTxns=[...transactions,txn];
    setTransactions(newTxns);
    STORE.saveTransaction(txn).catch(()=>{});
    const updAcc=accounts.map(a=>{
      if(txn.type==="income"&&a.id===txn.accountId){
        const delta=convertAmount(txn.amount,txn.currency,a.currency);
        return{...a,balance:a.balance+delta};
      }
      if(txn.type==="expense"&&a.id===txn.accountId){
        const delta=convertAmount(txn.amount,txn.currency,a.currency);
        return{...a,balance:a.balance-delta};
      }
      if(txn.type==="transfer"){
        if(a.id===txn.accountId){
          return{...a,balance:a.balance-txn.amount};
        }
        if(a.id===txn.toAccountId){
          const incoming=txn.toAmount!=null?txn.toAmount:convertAmount(txn.amount,txn.currency,a.currency);
          return{...a,balance:a.balance+incoming};
        }
      }
      return a;
    });
    setAccounts(updAcc);
  },[transactions,accounts,convertAmount]);

  const handleDeleteTxn=useCallback((id)=>{
    const txn=transactions.find(t=>t.id===id);
    if(!txn)return;
    const updAcc=accounts.map(a=>{
      if(txn.type==="income"&&a.id===txn.accountId){
        const delta=convertAmount(txn.amount,txn.currency,a.currency);
        return{...a,balance:a.balance-delta};
      }
      if(txn.type==="expense"&&a.id===txn.accountId){
        const delta=convertAmount(txn.amount,txn.currency,a.currency);
        return{...a,balance:a.balance+delta};
      }
      if(txn.type==="transfer"){
        if(a.id===txn.accountId)return{...a,balance:a.balance+txn.amount};
        if(a.id===txn.toAccountId){
          const incoming=txn.toAmount!=null?txn.toAmount:convertAmount(txn.amount,txn.currency,a.currency);
          return{...a,balance:a.balance-incoming};
        }
      }
      return a;
    });
    setAccounts(updAcc);
    setTransactions(transactions.filter(t=>t.id!==id));
    STORE.deleteTransaction(id).catch(()=>{});
  },[transactions,accounts,convertAmount]);

  // Reset all data: clears both localStorage and CloudStorage, then reloads the app
  const handleReset=useCallback(async()=>{
    try{
      // Clear localStorage keys used by this app
      ["ft_accounts","ft_categories","ft_settings","ft_fixed","ft_goals","ft_transactions","ft_init","ft_cs_migrated"]
        .forEach(k=>LS.remove(k));
      // Clear CloudStorage — remove all ft_* keys
      if(CS_AVAILABLE){
        const keys=await csGetKeys();
        const ftKeys=keys.filter(k=>k.startsWith("ft_"));
        for(const k of ftKeys){await csRemoveItem(k);}
      }
    }catch(e){console.error("Reset error:",e);}
    // Hard reload to re-initialize with empty defaults
    location.reload();
  },[]);

  // Manual refresh of exchange rates — bypasses the hourly cooldown
  const handleRefreshRates=useCallback(async()=>{
    try{
      haptic();
      const liveRates=await fetchLiveRates();
      const mergedRates={...settings.exchangeRates,...liveRates};
      setSettings({...settings,exchangeRates:mergedRates,lastRateUpdate:Date.now()});
    }catch(e){
      console.error("Rate refresh failed:",e);
      alert("Could not fetch rates. Check your connection and try again.");
    }
  },[settings]);

  // Export all transactions to CSV. Excel and Google Sheets both open .csv natively,
  // and CSV is the most universal format — no library needed.
  const handleExportCSV=useCallback(()=>{
    try{
      haptic();
      // Escape CSV values: wrap in quotes if it contains comma/quote/newline, double internal quotes
      const csvEscape=(v)=>{
        if(v===null||v===undefined)return"";
        const s=String(v);
        if(/[",\n\r]/.test(s))return`"${s.replace(/"/g,'""')}"`;
        return s;
      };
      const headers=["Date","Time","Type","Amount","Currency","From Account","To Account","Converted Amount","Converted Currency","Category","Subcategory","Note","AI Comment"];
      const rows=transactions
        .slice()
        .sort((a,b)=>new Date(b.date)-new Date(a.date))
        .map(tx=>{
          const acc=accounts.find(a=>a.id===tx.accountId);
          const toAcc=accounts.find(a=>a.id===tx.toAccountId);
          const cat=categories.find(c=>c.id===tx.categoryId);
          const sub=cat?.subcategories?.find(s=>s.id===tx.subcategoryId);
          const d=new Date(tx.date);
          return[
            d.toISOString().split("T")[0],
            `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`,
            tx.type,
            tx.amount,
            tx.currency,
            acc?.name||"",
            toAcc?.name||"",
            tx.toAmount||"",
            tx.toCurrency||"",
            cat?.name||"",
            sub?.name||"",
            tx.note||"",
            tx.aiComment||""
          ].map(csvEscape).join(",");
        });

      // Account balances summary section appended at the bottom for reference
      const summaryHeader=["","","","","","","","","","","","",""].join(",");
      const summaryTitle=["ACCOUNT BALANCES (snapshot at export)","","","","","","","","","","","",""].map(csvEscape).join(",");
      const balanceHeaders=["Account","Type","Currency","Balance","","","","","","","","",""].map(csvEscape).join(",");
      const balanceRows=accounts.map(a=>[a.name,a.type,a.currency,a.balance,"","","","","","","","",""].map(csvEscape).join(","));

      // BOM for Excel to render UTF-8 correctly (currency symbols, Cyrillic notes, etc.)
      const csv="\uFEFF"+[
        headers.map(csvEscape).join(","),
        ...rows,
        summaryHeader,
        summaryTitle,
        balanceHeaders,
        ...balanceRows
      ].join("\n");

      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const filename=`finance-tracker-${new Date().toISOString().split("T")[0]}.csv`;

      // Try to share via Telegram first (works inside the Mini App), fall back to browser download
      const tg=window.Telegram?.WebApp;
      const url=URL.createObjectURL(blob);
      const link=document.createElement("a");
      link.href=url;
      link.download=filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      // Revoke the blob URL after a short delay to ensure the download starts
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){
      console.error("Export failed:",e);
      alert("Could not export data. Please try again.");
    }
  },[transactions,accounts,categories]);

  const t=useMemo(()=>mkTheme(settings.darkMode),[settings.darkMode]);

  // Handle onboarding completion: save user's setup to settings + accounts
  const handleOnboardingComplete=useCallback((data)=>{
    const newSettings={...settings,
      displayName:data.displayName,
      profilePicture:data.profilePicture,
      aiPet:data.aiPet,
      selectedCurrency:data.selectedCurrency,
      onboarded:true
    };
    setSettings(newSettings);
    if(data.accounts&&data.accounts.length>0){
      setAccounts(data.accounts);
    }
  },[settings]);

  if(!loaded){
    return(
      <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#0a0f1e"}}>
        <div style={{fontSize:48,marginBottom:16}}>💰</div>
        <div style={{fontFamily:"system-ui,sans-serif",fontSize:22,color:"#10b981",fontWeight:700}}>Finance Tracker</div>
        <div style={{fontSize:14,color:"#64748b",marginTop:8}}>Loading your data...</div>
      </div>
    );
  }

  // Show onboarding if user hasn't completed setup yet
  if(!settings.onboarded){
    const tgUser=window.Telegram?.WebApp?.initDataUnsafe?.user;
    return <OnboardingScreen tgUser={tgUser} onComplete={handleOnboardingComplete}/>;
  }

  const lang=settings.uiLanguage||"English";
  // Tab icons use Tabler Icons (outline style) — loaded via CSS link in <head>.
  // Format: "ti ti-NAME" — NAME is the icon's slug from tabler.io/icons
  const TABS=[
    {k:"home",     icon:"ti ti-home",      label:tr("Home",lang)},
    {k:"analytics",icon:"ti ti-chart-pie", label:tr("Analytics",lang)},
    {k:"__add__",  icon:"ti ti-plus",      label:""},
    {k:"history",  icon:"ti ti-clock",     label:tr("History",lang)},
    {k:"settings", icon:"ti ti-settings",  label:tr("Settings",lang)},
  ];

  return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:t.bg,maxWidth:430,margin:"0 auto",position:"relative",overflow:"hidden"}}>
      <div style={{flex:1,overflow:"hidden",position:"relative"}} className="fade-in">
        {tab==="home"&&<HomeScreen accounts={accounts} transactions={transactions} categories={categories} fixedExpenses={fixedExpenses} goals={goals} settings={settings} onSettingsChange={setSettings} onAddTxn={(mode)=>{setAddMode(mode);setAddModal(true);}} t={t} onTxnClick={setSelTxn}/>}
        {tab==="analytics"&&<AnalyticsScreen transactions={transactions} categories={categories} settings={settings} t={t}/>}
        {tab==="history"&&<HistoryScreen transactions={transactions} accounts={accounts} categories={categories} settings={settings} onTxnClick={setSelTxn} t={t}/>}
        {tab==="settings"&&<SettingsScreen accounts={accounts} categories={categories} fixedExpenses={fixedExpenses} goals={goals} settings={settings} onSettingsChange={setSettings} onAccountsChange={setAccounts} onCategoriesChange={setCategories} onFixedChange={setFixed} onGoalsChange={setGoals} onReset={handleReset} onRefreshRates={handleRefreshRates} onExport={handleExportCSV} t={t}/>}
      </div>
      <div style={{flexShrink:0,display:"flex",alignItems:"center",background:t.tabBg,borderTop:`1px solid ${t.tabBorder}`,padding:"6px 0 calc(10px + env(safe-area-inset-bottom, 0px))",zIndex:50}}>
        {TABS.map(({k,icon,label})=>{
          const isAdd=k==="__add__";
          const active=tab===k;
          return(
            <button key={k} onClick={()=>{haptic();if(isAdd){setAddMode("expense");setAddModal(true);}else setTab(k);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",padding:"4px 0"}}>
              {isAdd?(
                /* Center "+" button — bigger, prominent, gradient green */
                <div style={{width:50,height:50,borderRadius:"50%",background:"linear-gradient(135deg,#10b981,#34d399)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",marginTop:-18,boxShadow:"0 4px 20px rgba(16,185,129,0.55)"}}>
                  <i className={icon} style={{fontSize:26}} aria-hidden="true"/>
                </div>
              ):(
                <>
                  {/* Tabler icon — colors handled by parent so active/inactive state animates the same as text */}
                  <i className={icon} style={{fontSize:22,color:active?t.accent:t.textMuted,opacity:active?1:0.7,transition:"all .15s"}} aria-hidden="true"/>
                  <div style={{fontSize:10,fontWeight:active?600:400,color:active?t.accent:t.textMuted,fontFamily:"system-ui,sans-serif",transition:"color .15s"}}>{label}</div>
                </>
              )}
            </button>
          );
        })}
      </div>
      <AddModal open={addModal} onClose={()=>setAddModal(false)} accounts={accounts} categories={categories} settings={settings} onSave={handleSaveTxn} t={t} initMode={addMode}/>
      <TxnDetail txn={selTxn} open={!!selTxn} onClose={()=>setSelTxn(null)} accounts={accounts} categories={categories} onDelete={handleDeleteTxn} settings={settings} t={t}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
